<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fixture Green</title>
<style>html,body{margin:0;height:100%;background:#101426;display:grid;place-items:center}canvas{background:#1a2140}</style>
</head>
<body>
<script>
(function () {
  const W = 640;
  const H = 360;
  const canvas = document.createElement('canvas');
  canvas.width = W;
  canvas.height = H;
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  let state = 'title';
  let score = 0;
  let x = W / 2;
  const keys = {};
  window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if (state === 'title') state = 'playing';
    else if (e.code === 'Space') score += 5;
    else score += 1;
  });
  window.addEventListener('keyup', (e) => {
    keys[e.code] = false;
  });
  canvas.addEventListener('pointerdown', () => {
    if (state === 'title') state = 'playing';
    score += 3;
  });
  window.__GF__ = {
    version: 'fixture-green-1.0',
    info: { title: 'Fixture Green' },
    errors: [],
    flags: {},
    getState: () => state,
    getScore: () => score,
    getBest: () => score,
    getFps: () => 60,
    getTime: () => performance.now() / 1000,
    restart: () => {
      score = 0;
      state = 'playing';
    }
  };
  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = (now - last) / 1000;
    last = now;
    if (state === 'playing') {
      if (keys['ArrowLeft']) x -= 200 * dt;
      if (keys['ArrowRight']) x += 200 * dt;
    }
    ctx.fillStyle = '#1a2140';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#7c5cff';
    ctx.beginPath();
    ctx.arc(state === 'playing' ? x : W / 2, H / 2, 30, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '700 24px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(state === 'title' ? 'FIXTURE GREEN - press key' : 'SCORE ' + Math.floor(score), W / 2, 50);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
