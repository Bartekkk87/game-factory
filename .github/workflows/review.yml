name: Review Gate

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  gate:
    if: >
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      (startsWith(github.event.comment.body, '/approve') || startsWith(github.event.comment.body, '/reject') || startsWith(github.event.comment.body, '/feedback'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT: ${{ github.event.comment.body }}
        run: |
          SLUG=$(printf '%s' "$ISSUE_BODY" | grep -oE '\[slug:[a-z0-9-]+\]' | head -n 1 | tr -d '[]' | sed 's/^slug://')
          if printf '%s' "$COMMENT" | grep -q '^/approve'; then
            ACTION=approve
          elif printf '%s' "$COMMENT" | grep -q '^/reject'; then
            ACTION=reject
          else
            ACTION=feedback
          fi
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"

      - name: Capture immutable Owner feedback evidence
        if: steps.parse.outputs.slug != ''
        env:
          GF_OWNER_ISSUE_NUMBER: ${{ github.event.issue.number }}
          GF_OWNER_COMMENT_ID: ${{ github.event.comment.id }}
          GF_OWNER_ISSUE_URL: ${{ github.event.issue.html_url }}
          GF_OWNER_COMMENT_URL: ${{ github.event.comment.html_url }}
          GF_OWNER_AUTHOR: ${{ github.event.comment.user.login }}
          GF_OWNER_COMMENT: ${{ github.event.comment.body }}
          GF_OWNER_SLUG: ${{ steps.parse.outputs.slug }}
          GF_OWNER_CREATED_AT: ${{ github.event.comment.created_at }}
        run: node factory/src/learning/owner-feedback.mjs

      - name: Run controlled learning orchestration
        if: steps.parse.outputs.slug != ''
        env:
          GF_LEARNING_EVENT_KIND: owner-feedback
          GF_LEARNING_EVENT_ID: gh-issue-${{ github.event.issue.number }}-comment-${{ github.event.comment.id }}
        run: node factory/src/learning/orchestrate.mjs

      - name: Finalize verdict
        if: steps.parse.outputs.slug != '' && steps.parse.outputs.action != 'feedback'
        env:
          SLUG: ${{ steps.parse.outputs.slug }}
          ACTION: ${{ steps.parse.outputs.action }}
          COMMENT: ${{ github.event.comment.body }}
        run: |
          if [ "$ACTION" = "reject" ]; then
            REASON=$(printf '%s' "$COMMENT" | sed -E '1s#^/reject[[:space:]]*##')
            node factory/src/publish/finalize.mjs --slug "$SLUG" --action reject --reason "$REASON"
          else
            node factory/src/publish/finalize.mjs --slug "$SLUG" --action approve
          fi

      - name: Verify protected paths were not changed at runtime
        if: steps.parse.outputs.slug != ''
        run: node factory/src/control/staged-commit-policy.mjs --mode review --check-runtime

      - name: Commit review state and evidence
        if: steps.parse.outputs.slug != ''
        run: |
          git config user.name "game-factory-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- runs drafts products archive memory learning evaluation/results
          node factory/src/control/staged-commit-policy.mjs --mode review --check-staged
          git diff --cached --quiet || git commit -m "review: ${{ steps.parse.outputs.action }} ${{ steps.parse.outputs.slug }}"
          git push

      - name: Close verdict review issue
        if: success() && steps.parse.outputs.slug != '' && steps.parse.outputs.action != 'feedback'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ steps.parse.outputs.action }}
          SLUG: ${{ steps.parse.outputs.slug }}
        run: |
          if [ "$ACTION" = "approve" ]; then
            MSG="Published to the Game Library under \`products/$SLUG/\`. Owner evidence was captured."
          else
            MSG="Archived. Owner rejection was captured as raw learning evidence; any resulting learning candidate remains inactive pending validation and human promotion."
          fi
          gh issue comment ${{ github.event.issue.number }} --body "$MSG"
          gh issue close ${{ github.event.issue.number }}

      - name: Acknowledge feedback-only capture
        if: success() && steps.parse.outputs.slug != '' && steps.parse.outputs.action == 'feedback'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment ${{ github.event.issue.number }} --body "Feedback captured as durable learning evidence. Controlled learning orchestration ran; Product state and Production prompts were not changed, and no candidate can be auto-validated or auto-activated."

      - name: Warn about missing slug
        if: steps.parse.outputs.slug == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment ${{ github.event.issue.number }} --body "Could not find a `[slug:...]` marker in this issue body - nothing was changed."
