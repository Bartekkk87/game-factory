name: Project Kepler Canary M1

on:
  pull_request:
    paths:
      - '.github/workflows/project-kepler-canary.yml'
      - 'factory/src/project/kepler-launch-gate.mjs'
      - 'factory/src/project/test-kepler-launch-gate.mjs'
      - 'factory/src/project/kepler-retry-gate.mjs'
      - 'factory/src/project/test-kepler-retry-gate.mjs'
      - 'factory/src/project/launch-records/kepler-outpost/KEPLER-M1-T1.json'
      - 'factory/src/project/launch-records/kepler-outpost/KEPLER-M1-T1-RETRY-1.json'
  workflow_run:
    workflows: ['Branch Verifier Selftest']
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: project-kepler-canary-m1
  cancel-in-progress: false

jobs:
  launch-gate-selftest:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prove fail-closed Kepler launch and retry contracts
        run: |
          node factory/src/project/test-kepler-launch-gate.mjs
          node factory/src/project/test-kepler-retry-gate.mjs

      - name: Validate proposed Kepler authorization
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          LAUNCH_PATH='factory/src/project/launch-records/kepler-outpost/KEPLER-M1-T1.json'
          RETRY_PATH='factory/src/project/launch-records/kepler-outpost/KEPLER-M1-T1-RETRY-1.json'
          TASK_PATH='projects/kepler-outpost/.factory/tasks/KEPLER-M1-T1.json'
          HEAD_SHA=$(git rev-parse HEAD)
          LAUNCH_CHANGE=$(git diff --name-status "$BASE_SHA" "$HEAD_SHA" -- "$LAUNCH_PATH")
          RETRY_CHANGE=$(git diff --name-status "$BASE_SHA" "$HEAD_SHA" -- "$RETRY_PATH")
          if [ -n "$LAUNCH_CHANGE" ] && [ -n "$RETRY_CHANGE" ]; then
            echo "Kepler launch and retry authorization may not be changed together" >&2
            exit 1
          fi
          if [ -n "$LAUNCH_CHANGE" ]; then
            EXPECTED=$(printf 'A\t%s' "$LAUNCH_PATH")
            if [ "$LAUNCH_CHANGE" != "$EXPECTED" ]; then
              echo "Kepler launch record must be added exactly once and may not be modified or deleted" >&2
              exit 1
            fi
            node factory/src/project/kepler-launch-gate.mjs "$LAUNCH_PATH" "$TASK_PATH" "$BASE_SHA"
          fi
          if [ -n "$RETRY_CHANGE" ]; then
            EXPECTED=$(printf 'A\t%s' "$RETRY_PATH")
            if [ "$RETRY_CHANGE" != "$EXPECTED" ]; then
              echo "Kepler retry record must be added exactly once and may not be modified or deleted" >&2
              exit 1
            fi
            node factory/src/project/kepler-retry-gate.mjs \
              "$RETRY_PATH" "$LAUNCH_PATH" "$TASK_PATH" "$BASE_SHA"
          fi

  autonomous-preflight:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      launch: ${{ steps.gate.outputs.launch }}
      authorization_kind: ${{ steps.gate.outputs.authorization_kind }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
      base_sha: ${{ steps.gate.outputs.base_sha }}
    steps:
      - name: Checkout exact verified main head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate verified-main launch publication
        id: gate
        env:
          VERIFIED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          VERIFIED_RUN_ID: ${{ github.event.workflow_run.id }}
          VERIFIED_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          VERIFIED_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail
          LAUNCH_PATH='factory/src/project/launch-records/kepler-outpost/KEPLER-M1-T1.json'
          RETRY_PATH='factory/src/project/launch-records/kepler-outpost/KEPLER-M1-T1-RETRY-1.json'
          TASK_PATH='projects/kepler-outpost/.factory/tasks/KEPLER-M1-T1.json'
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$HEAD_SHA" != "$VERIFIED_HEAD_SHA" ]; then
            echo "verified Kepler authorization head mismatch" >&2
            exit 1
          fi
          if [ "$VERIFIED_EVENT" != 'push' ] || [ "$VERIFIED_RUN_ATTEMPT" != '1' ]; then
            echo "Kepler authorization requires the first automatic push verifier attempt" >&2
            exit 1
          fi
          git fetch origin main --quiet
          if [ "$(git rev-parse origin/main)" != "$HEAD_SHA" ]; then
            echo "verified Kepler authorization head is no longer current main" >&2
            exit 1
          fi
          BASE_SHA=$(git rev-parse "${HEAD_SHA}^1")
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          LAUNCH_CHANGE=$(git diff --name-status "$BASE_SHA" "$HEAD_SHA" -- "$LAUNCH_PATH")
          RETRY_CHANGE=$(git diff --name-status "$BASE_SHA" "$HEAD_SHA" -- "$RETRY_PATH")
          if [ -n "$LAUNCH_CHANGE" ] && [ -n "$RETRY_CHANGE" ]; then
            echo "Kepler launch and retry authorization may not be published together" >&2
            exit 1
          fi
          if [ -z "$LAUNCH_CHANGE" ] && [ -z "$RETRY_CHANGE" ]; then
            echo 'launch=false' >> "$GITHUB_OUTPUT"
            echo 'authorization_kind=none' >> "$GITHUB_OUTPUT"
            echo "KEPLER_M1_AUTONOMOUS_TRIGGER_SKIPPED={\"reason\":\"no-new-launch-or-retry-record\",\"verifiedRunId\":\"$VERIFIED_RUN_ID\",\"headSha\":\"$HEAD_SHA\",\"baseSha\":\"$BASE_SHA\"}"
            exit 0
          fi
          if [ -n "$LAUNCH_CHANGE" ]; then
            EXPECTED=$(printf 'A\t%s' "$LAUNCH_PATH")
            if [ "$LAUNCH_CHANGE" != "$EXPECTED" ]; then
              echo "Kepler launch record must be added exactly once and may not be modified or deleted" >&2
              exit 1
            fi
            EVIDENCE=$(node factory/src/project/kepler-launch-gate.mjs "$LAUNCH_PATH" "$TASK_PATH" "$BASE_SHA")
            AUTHORIZATION_KIND='launch'
          else
            EXPECTED=$(printf 'A\t%s' "$RETRY_PATH")
            if [ "$RETRY_CHANGE" != "$EXPECTED" ]; then
              echo "Kepler retry record must be added exactly once and may not be modified or deleted" >&2
              exit 1
            fi
            EVIDENCE=$(node factory/src/project/kepler-retry-gate.mjs \
              "$RETRY_PATH" "$LAUNCH_PATH" "$TASK_PATH" "$BASE_SHA")
            AUTHORIZATION_KIND='retry'
          fi
          echo 'launch=true' >> "$GITHUB_OUTPUT"
          echo "authorization_kind=$AUTHORIZATION_KIND" >> "$GITHUB_OUTPUT"
          echo "KEPLER_M1_AUTONOMOUS_TRIGGER={\"verifiedRunId\":\"$VERIFIED_RUN_ID\",\"headSha\":\"$HEAD_SHA\",\"baseSha\":\"$BASE_SHA\",\"authorizationKind\":\"$AUTHORIZATION_KIND\",\"authorization\":$EVIDENCE}"
          {
            echo '## Kepler M1 autonomous trigger'
            echo
            echo "- verifier run: $VERIFIED_RUN_ID"
            echo "- verified head: $HEAD_SHA"
            echo "- verified base: $BASE_SHA"
            echo "- authorization kind: $AUTHORIZATION_KIND"
            echo "- authorization evidence: \`$EVIDENCE\`"
          } >> "$GITHUB_STEP_SUMMARY"

  canary-m1:
    needs: autonomous-preflight
    if: needs.autonomous-preflight.outputs.launch == 'true'
    permissions:
      actions: write
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact verified launch head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.autonomous-preflight.outputs.head_sha }}
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Revalidate bounded authorization before setup
        env:
          EXPECTED_HEAD_SHA: ${{ needs.autonomous-preflight.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ needs.autonomous-preflight.outputs.base_sha }}
          AUTHORIZATION_KIND: ${{ needs.autonomous-preflight.outputs.authorization_kind }}
        run: |
          set -euo pipefail
          LAUNCH_PATH='factory/src/project/launch-records/kepler-outpost/KEPLER-M1-T1.json'
          RETRY_PATH='factory/src/project/launch-records/kepler-outpost/KEPLER-M1-T1-RETRY-1.json'
          TASK_PATH='projects/kepler-outpost/.factory/tasks/KEPLER-M1-T1.json'
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse "${EXPECTED_HEAD_SHA}^1")" = "$EXPECTED_BASE_SHA"
          if [ "$AUTHORIZATION_KIND" = 'launch' ]; then
            node factory/src/project/kepler-launch-gate.mjs \
              "$LAUNCH_PATH" "$TASK_PATH" "$EXPECTED_BASE_SHA"
          elif [ "$AUTHORIZATION_KIND" = 'retry' ]; then
            node factory/src/project/kepler-retry-gate.mjs \
              "$RETRY_PATH" "$LAUNCH_PATH" "$TASK_PATH" "$EXPECTED_BASE_SHA"
          else
            echo "unknown Kepler authorization kind" >&2
            exit 1
          fi

      - name: Configure Project Canary Git identity
        run: |
          git config user.name "Project Kepler Canary"
          git config user.email "project-kepler-canary@example.invalid"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prove bounded Project Engineer adapter
        run: node factory/src/project/test-engineer-requester.mjs

      - name: Reconfirm and materialize exact main before model spend
        env:
          EXPECTED_HEAD_SHA: ${{ needs.autonomous-preflight.outputs.head_sha }}
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          if [ "$(git rev-parse origin/main)" != "$EXPECTED_HEAD_SHA" ]; then
            echo "main advanced after Kepler authorization verification; refusing model spend" >&2
            exit 1
          fi
          git switch -C main "$EXPECTED_HEAD_SHA"
          test "$(git branch --show-current)" = 'main'
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_HEAD_SHA"

      - name: Execute bounded low-cost Kepler M1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENROUTER_PRODUCTION: ${{ secrets.OPENROUTER_PRODUCTION }}
          GF_LLM_PROVIDER_ENGINEER_PROJECT_TASK: openrouter
          GF_MODEL_ENGINEER_PROJECT_TASK: deepseek/deepseek-chat-v3.1
          GF_LLM_LANE_ENGINEER_PROJECT_TASK: production
          GF_PROJECT_ENGINEER_MAX_TOKENS: '32768'
        run: node factory/src/project/run-kepler-canary.mjs
