name: Project P1 Closure Fixture Migration

on:
  push:
    branches: [codex/project-game-p1-closure]
    paths:
      - '.github/workflows/p1-closure-fixture-migration.yml'

permissions:
  contents: write

jobs:
  migrate-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/project-game-p1-closure
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Migrate bounded Project Game fixtures
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(file, before, after) {
            const current = fs.readFileSync(file, 'utf8');
            if (!current.includes(before)) throw new Error(`fixture pattern missing in ${file}`);
            fs.writeFileSync(file, current.replace(before, after));
          }

          replaceOnce(
            'factory/src/project/test-foundation.mjs',
            "equivalenceProjection: ['world.ticks', 'inventory.metal']",
            "transientStatePaths: ['transient']"
          );
          replaceOnce(
            'factory/src/project/test-browser-persistence.mjs',
            "equivalenceProjection: ['world.ticks', 'inventory.metal']",
            "transientStatePaths: ['transient']"
          );

          const block = [
            "  fs.writeFileSync(",
            "    path.join(projectRoot, '.factory', 'approvals', `${task.taskId}.json`),",
            "    `${JSON.stringify({`,",
            "      schemaVersion: 'project-game.owner-task-approval/v1',",
            "      projectId: task.projectId,",
            "      taskId: task.taskId,",
            "      taskContractSha256: task.contractSha256,",
            "      approvedBy: 'owner-test-fixture',",
            "      authorityVersion: 'test-fixture/v1'",
            "    }, null, 2)}\\n`",
            "  );"
          ].join('\n');

          for (const file of ['factory/src/project/test-pg-a0.mjs', 'factory/src/project/test-pg-a0-negative.mjs']) {
            const current = fs.readFileSync(file, 'utf8');
            const marker = current.includes("  git(['init']);") ? "  git(['init']);" : "  git(root, ['init']);";
            if (!current.includes(marker)) throw new Error(`git init marker missing in ${file}`);
            fs.writeFileSync(file, current.replace(marker, `${block}\n\n${marker}`));
          }
          NODE
      - name: Capture existing Project Game regression result
        run: |
          set +e
          node factory/src/control/test-architecture-finalization.mjs > p1-closure-test-output.txt 2>&1
          STATUS=$?
          set -e
          printf '\nEXIT_STATUS=%s\n' "$STATUS" >> p1-closure-test-output.txt
          cat p1-closure-test-output.txt
      - name: Commit migrated fixtures and remove helper workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p1-closure-fixture-migration.yml
          git add factory/src/project/test-foundation.mjs factory/src/project/test-browser-persistence.mjs factory/src/project/test-pg-a0.mjs factory/src/project/test-pg-a0-negative.mjs p1-closure-test-output.txt
          git commit -m 'test(project): migrate P1 closure fixtures'
          git push origin HEAD:codex/project-game-p1-closure
