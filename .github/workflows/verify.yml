name: Verifier Selftest

on:
  push:
    paths:
      - 'engine/**'
      - 'examples/**'
      - 'evaluation/**'
      - 'factory/src/**'
      - 'factory/prompts/**'
      - 'skills/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
      - '.github/CODEOWNERS'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate GitHub workflow YAML
        run: |
          ruby -e "require 'yaml'; Dir['.github/workflows/*.{yml,yaml}'].sort.each { |f| YAML.parse_file(f); puts \"workflow yaml OK: #{f}\" }"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check all Node modules
        run: find factory/src -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Prove zero-valued operational limit semantics
        run: node factory/src/test-config-limits.mjs
      - name: Prove workflow protected-path and staged-evidence commit policy
        run: node factory/src/control/test-staged-commit-policy.mjs
      - name: Prove release gate uses only deterministic authoritative criteria
        run: node factory/src/control/test-release-gate-advisory.mjs
      - name: Prove every model registry request contract
        run: node factory/src/llm/test-request-contract.mjs
      - name: Prove transport retry preserves billing uncertainty fail-closed
        run: node factory/src/llm/test-transport-policy.mjs
      - name: Prove generated-page tag and CSP isolation
        run: node factory/src/publish/test-assemble-safety.mjs
      - name: Prove audit-v2 flat-frame and network verifier hardening
        run: node factory/src/verify/test-audit-v2-hardening.mjs
      - name: Prove Golden Corpus S0 registry and coverage baseline
        run: node factory/src/evaluation/test-corpus-registry.mjs
      - name: Prove Golden Corpus S1 manifest and bounded sibling provenance
        run: node factory/src/evaluation/test-corpus-s1.mjs
      - name: Prove Golden Corpus S1a individual case execution contract
        run: node factory/src/evaluation/test-corpus-case-execution.mjs
      - name: Prove Golden Corpus S2 baseline and metric semantics
        run: node factory/src/evaluation/test-corpus-s2.mjs
      - name: Prove Golden Corpus S3 analysis-only evaluation failure intake
        run: node factory/src/evaluation/test-evaluation-failure-intake.mjs
      - name: Prove Golden Corpus S4 durable application receipt and fail-closed boundaries
        run: node factory/src/learning/test-application-receipt.mjs
      - name: Prove S5 zero-paid system configuration benchmark contracts
        run: node factory/src/evaluation/test-system-config-benchmark.mjs
      - name: Prove control kernel budgets and release gate
        run: node factory/src/control/test-control.mjs
      - name: Prove model/provider router and capability gates
        run: node factory/src/llm/test-router.mjs
      - name: Prove Production credential isolation and OpenRouter challenger
        run: node factory/src/llm/test-openrouter.mjs
      - name: Prove Owner Contract decomposition and provenance
        run: node factory/src/contract/test-owner-contract.mjs
      - name: Prove independent Canary zero-paid preflight
        run: node factory/src/contract/test-independent-canary-preflight.mjs
      - name: Prove Titan Step 3 candidate validation
        run: node factory/src/contract/test-titan-candidate-validation.mjs
      - name: Prove controlled learning safety and lifecycle
        run: node factory/src/learning/test-learning.mjs
      - name: Prove cross-run learning trigger threshold
        run: node factory/src/learning/test-cross-run-trigger.mjs
      - name: Prove automatic controlled learning orchestration
        run: node factory/src/learning/test-orchestration.mjs
      - name: Prove autonomous failed-run root cause diagnosis
        run: |
          node factory/src/learning/test-root-cause.mjs
          node factory/src/learning/test-autonomous-orchestration.mjs
      - name: Prove L4 production-agent integrity
        run: node factory/src/roles/test-production-agents.mjs
      - name: Prove art-direction runtime prompt truth
        run: node factory/src/roles/test-art-direction-runtime.mjs
      - name: Prove P0-03 product-fidelity event hardening
        run: node factory/src/verify/test-fidelity-hardening.mjs
      - name: Prove proof-plan reachability before Engineer spend
        run: node factory/src/verify/test-proof-reachability.mjs
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Run Golden Corpus S2 evaluation and quality/delta report
        run: |
          set +e
          node factory/src/evaluation/run-corpus.mjs --out evaluation/results/S2-latest.json
          S2_STATUS=$?
          set -e
          if [ -f evaluation/results/S2-latest.json ]; then
            node factory/src/evaluation/intake-failures.mjs \
              --report evaluation/results/S2-latest.json \
              --observation-id "github-${{ github.run_id }}-attempt-${{ github.run_attempt }}" \
              | tee evaluation/results/S3-intake-latest.json
            node -e "const r=require('./evaluation/results/S2-latest.json'); console.log('S2 summary', JSON.stringify({commit:r.evaluatedCommitSha,cases:r.metrics.totalCases,passRate:r.metrics.expectedOutcomePassRate,criticalFalsePasses:r.metrics.criticalFalsePassCount,delta:r.delta.expectedOutcomePassRateDelta}))"
          else
            echo "S2 report was not produced; no case-level evaluation failure was admitted to S3" >&2
          fi
          exit "$S2_STATUS"
      - name: Stage current S3 learning artifacts
        if: always()
        run: |
          mkdir -p evaluation/artifacts/S3-current
          git ls-files --others --exclude-standard -- \
            learning/evidence/evaluation-failures \
            learning/aggregates \
            learning/triggers \
            learning/analysis \
            learning/candidates \
            learning/orchestration \
            | while IFS= read -r FILE; do
                mkdir -p "evaluation/artifacts/S3-current/$(dirname "$FILE")"
                cp "$FILE" "evaluation/artifacts/S3-current/$FILE"
              done
      - name: Preserve S2/S3 evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-corpus-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evaluation/results/
            evaluation/artifacts/S3-current/
          if-no-files-found: warn
      - name: Prove P0 action reachability repair
        run: node factory/src/verify/test-action-reachability.mjs
      - name: Prove independent terminal proof scenarios
        run: node factory/src/verify/test-proof-scenarios.mjs
      - name: Prove independent HUD geometry verifier
        run: node factory/src/verify/test-layout-geometry.mjs
      - name: Prove verifier causality and visual activity controls
        run: node factory/src/verify/test-causality-visual.mjs
      - name: Prove verifier accepts good and rejects bad products
        run: npm run test:verifier
      - name: Prove publishing gates and gallery escaping
        run: |
          TEST_ROOT=$(mktemp -d)
          cp -R factory "$TEST_ROOT/factory"
          mkdir -p "$TEST_ROOT/drafts/sha-fixture" "$TEST_ROOT/drafts/tampered-fixture" "$TEST_ROOT/products/xss-fixture" "$TEST_ROOT/memory"
          printf '%s' '<!doctype html><title>verified</title>' > "$TEST_ROOT/drafts/sha-fixture/index.html"
          GOOD_SHA=$(sha256sum "$TEST_ROOT/drafts/sha-fixture/index.html" | cut -d' ' -f1)
          printf '{"slug":"sha-fixture","title":"SHA Fixture","status":"awaiting-review","candidateSha":"%s","overall":7,"date":"2026-08-26"}\n' "$GOOD_SHA" > "$TEST_ROOT/drafts/sha-fixture/meta.json"
          cp "$TEST_ROOT/drafts/sha-fixture/index.html" "$TEST_ROOT/drafts/tampered-fixture/index.html"
          printf '{"slug":"tampered-fixture","title":"Tampered Fixture","status":"awaiting-review","candidateSha":"%s","overall":7,"date":"2026-08-26"}\n' "$GOOD_SHA" > "$TEST_ROOT/drafts/tampered-fixture/meta.json"
          printf '%s' '<!-- changed after review -->' >> "$TEST_ROOT/drafts/tampered-fixture/index.html"
          printf '{"products":[],"lessons":[],"stats":{}}\n' > "$TEST_ROOT/memory/memory.json"
          (
            cd "$TEST_ROOT"
            node factory/src/publish/finalize.mjs --slug sha-fixture --action approve
            test -s products/sha-fixture/index.html
            if node factory/src/publish/finalize.mjs --slug tampered-fixture --action approve; then
              echo 'Tampered candidate was incorrectly published' >&2
              exit 1
            fi
          )
          printf '%s' '<!doctype html><title>xss</title>' > "$TEST_ROOT/products/xss-fixture/index.html"
          printf '%s\n' '{"title":"<script>alert(1)</script>","tagline":"<img src=x onerror=alert(1)>","overall":8,"date":"2026-08-26"}' > "$TEST_ROOT/products/xss-fixture/meta.json"
          ( cd "$TEST_ROOT" && node factory/src/publish/site.mjs --out "$TEST_ROOT/site" )
          if grep -F '<script>alert(1)</script>' "$TEST_ROOT/site/index.html"; then echo 'Unescaped gallery content detected' >&2; exit 1; fi
          grep -F '&lt;script&gt;alert(1)&lt;/script&gt;' "$TEST_ROOT/site/index.html"
