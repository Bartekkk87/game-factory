name: Deploy Site

on:
  push:
    branches: [main]
    paths:
      - 'drafts/**'
      - 'products/**'
      - 'archive/**'
      - 'factory/src/publish/site.mjs'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: ['Produce Game']
    types: [completed]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build gallery site
        run: node factory/src/publish/site.mjs --out _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
