name: Deploy Site

on:
  push:
    branches: [main, runtime-state]
    paths:
      - 'drafts/**'
      - 'products/**'
      - 'archive/**'
      - 'factory/src/publish/site.mjs'
      - 'factory/src/control/staged-commit-policy.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Load isolated runtime state
        run: |
          git config user.name "game-factory-pages"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main runtime-state
          node factory/src/control/staged-commit-policy.mjs \
            --mode review \
            --check-state-history \
            --base-ref origin/main \
            --state-ref origin/runtime-state
          git merge --no-edit origin/runtime-state
          node factory/src/control/staged-commit-policy.mjs \
            --mode review \
            --check-state-tree \
            --base-ref origin/main \
            --state-ref HEAD

      - name: Build gallery site
        run: node factory/src/publish/site.mjs --out _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
