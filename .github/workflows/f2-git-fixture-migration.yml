name: F2 Git Fixture Migration

on:
  push:
    branches: [codex/project-game-p1-closure-final]
    paths: ['.github/workflows/f2-git-fixture-migration.yml']

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/project-game-p1-closure-final
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch deterministic fixtures
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          function patch(file, transform) {
            const before = fs.readFileSync(file, 'utf8');
            const after = transform(before);
            if (after === before) throw new Error(`fixture migration made no change: ${file}`);
            fs.writeFileSync(file, after);
          }

          const gitInit = (prefix) => `${prefix}const gitInit = spawnSync('git', ['init'], { cwd: temp, encoding: 'utf8' });\nassert.equal(gitInit.status, 0, \`git init failed: \${gitInit.stderr || gitInit.stdout}\`);\n`;

          patch('factory/src/project/test-foundation.mjs', (source) => {
            source = source.replace("import path from 'node:path';\n", "import path from 'node:path';\nimport { spawnSync } from 'node:child_process';\n");
            source = source.replace(
              "const temp = fs.mkdtempSync(path.join(os.tmpdir(), 'gf-project-foundation-'));\n",
              gitInit("const temp = fs.mkdtempSync(path.join(os.tmpdir(), 'gf-project-foundation-'));\n")
            );
            return source;
          });

          patch('factory/src/project/test-remediation.mjs', (source) => {
            source = source.replace("import path from 'node:path';\n", "import path from 'node:path';\nimport { spawnSync } from 'node:child_process';\n");
            source = source.replace(
              "const temp = fs.mkdtempSync(path.join(os.tmpdir(), 'gf-project-remediation-'));\n",
              gitInit("const temp = fs.mkdtempSync(path.join(os.tmpdir(), 'gf-project-remediation-'));\n")
            );
            return source;
          });

          patch('factory/src/project/test-p1-closure.mjs', (source) => {
            source = source.replace("import path from 'node:path';\n", "import path from 'node:path';\nimport { spawnSync } from 'node:child_process';\n");
            source = source.replace(
              "  const root = fs.mkdtempSync(path.join(os.tmpdir(), 'gf-p1-f2-'));\n  const projectRoot = initializeFixture(root, 'expected-project');",
              "  const root = fs.mkdtempSync(path.join(os.tmpdir(), 'gf-p1-f2-'));\n  const gitInit = spawnSync('git', ['init'], { cwd: root, encoding: 'utf8' });\n  assert.equal(gitInit.status, 0, `git init failed: ${gitInit.stderr || gitInit.stdout}`);\n  const projectRoot = initializeFixture(root, 'expected-project');"
            );
            source = source.replaceAll('repoRoot\\/projects|inside repoRoot\\/projects', 'exactly repoRoot\\/projects\\/expected-project');
            const anchor = "    assert.equal(fs.readFileSync(path.join(otherRoot, 'src', 'value.mjs'), 'utf8'), ORIGINAL_VALUE);\n\n    assert.throws(\n      () => applyPatchToStaging({";
            const attack = "    assert.equal(fs.readFileSync(path.join(otherRoot, 'src', 'value.mjs'), 'utf8'), ORIGINAL_VALUE);\n\n    const fakeRepoShape = fs.mkdtempSync(path.join(os.tmpdir(), 'gf-p1-f2-fake-repo-'));\n    try {\n      const fakeProjectRoot = initializeFixture(fakeRepoShape, 'expected-project');\n      assert.throws(\n        () => prepareTaskTransaction({ projectRoot: fakeProjectRoot, task, operations: [modifyOperation()] }),\n        /inside a Git repository/\n      );\n    } finally {\n      fs.rmSync(fakeRepoShape, { recursive: true, force: true });\n    }\n\n    assert.throws(\n      () => applyPatchToStaging({";
            if (!source.includes(anchor)) throw new Error('F2 attack insertion anchor missing');
            return source.replace(anchor, attack);
          });
          NODE
      - name: Remove migration workflow
        run: git rm .github/workflows/f2-git-fixture-migration.yml
      - name: Commit fixture migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add factory/src/project/test-foundation.mjs factory/src/project/test-remediation.mjs factory/src/project/test-p1-closure.mjs
          git commit -m "test(project): require Git-backed F2 fixtures"
          git push origin HEAD:codex/project-game-p1-closure-final
