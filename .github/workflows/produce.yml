name: Produce Game

on:
  workflow_dispatch:
    inputs:
      idea:
        description: 'Spielidee (leer lassen = Director waehlt frei)'
        required: false
        default: ''
      budget_usd:
        description: 'Maximale API-Kosten in USD fuer diesen Lauf'
        required: false
        default: '10'
  push:
    paths:
      - 'ideas/**'
    branches: [main]

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Prepare idea
        id: prep
        env:
          MANUAL_IDEA: ${{ github.event.inputs.idea }}
        run: |
          if [ -n "$MANUAL_IDEA" ]; then
            printf '%s\n' "$MANUAL_IDEA" > /tmp/idea.txt
            echo "Using manual trigger idea"
          else
            LATEST=$(ls -t ideas/*.md 2>/dev/null | head -n1)
            if [ -z "$LATEST" ]; then
              echo "No idea file found in ideas/" >&2
              exit 1
            fi
            cp "$LATEST" /tmp/idea.txt
            echo "Using latest idea: $LATEST"
          fi
          B64=$(base64 -w0 /tmp/idea.txt)
          {
            echo 'IDEA_B64<<GF_EOF'
            echo "$B64"
            echo 'GF_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run production pipeline
        env:
          GF_LLM_API_KEY: ${{ secrets.GF_LLM_API_KEY }}
          GF_LLM_BASE_URL: ${{ vars.GF_LLM_BASE_URL }}
          GF_MODEL: ${{ vars.GF_MODEL }}
          IDEA_B64: ${{ steps.prep.outputs.IDEA_B64 }}
          BUDGET: ${{ github.event.inputs.budget_usd || '10' }}
        run: |
          printf '%s' "$IDEA_B64" | base64 -d > /tmp/idea-decoded.txt
          node factory/src/index.mjs --idea-file /tmp/idea-decoded.txt --budget "$BUDGET"

      - name: Identify latest draft
        id: meta
        if: success()
        run: |
          SLUG=$(ls -t drafts | head -n 1)
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "title=$(jq -r .title "drafts/$SLUG/meta.json")" >> "$GITHUB_OUTPUT"

      - name: Commit results & evidence
        if: always()
        run: |
          git config user.name "game-factory-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "factory: run ${{ github.run_id }} (${{ job.status }})"
          git push

      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-evidence-${{ github.run_id }}
          path: |
            runs/
            drafts/
          if-no-files-found: ignore

      - name: Open review issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "[Review] ${{ steps.meta.outputs.title }}" --body-file "drafts/${{ steps.meta.outputs.slug }}/REVIEW.md"
