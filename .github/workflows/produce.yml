name: Produce Game

on:
  workflow_dispatch:
    inputs:
      idea:
        description: 'Game idea (plain text)'
        required: true
        type: string
      budget_usd:
        description: 'Max USD budget'
        required: false
        default: '10'
        type: string
      provider:
        description: 'LLM provider'
        required: false
        default: 'openai'
        type: choice
        options:
          - openai
          - openrouter
  push:
    branches:
      - main
    paths:
      - 'ideas/**'

permissions:
  contents: write
  issues: write

env:
  CI: true

concurrency:
  group: game-factory-production
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check API configuration
        env:
          OPENAI_PRODUCTION: ${{ secrets.OPENAI_PRODUCTION }}
          OPENROUTER_PRODUCTION: ${{ secrets.OPENROUTER_PRODUCTION }}
          PROVIDER: ${{ github.event.inputs.provider || 'openai' }}
        run: |
          if [ "$PROVIDER" = "openrouter" ]; then
            test -n "$OPENROUTER_PRODUCTION" || (echo 'OPENROUTER_PRODUCTION missing' >&2; exit 1)
          else
            test -n "$OPENAI_PRODUCTION" || (echo 'OPENAI_PRODUCTION missing' >&2; exit 1)
          fi
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Prepare idea
        id: prep
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_IDEA: ${{ github.event.inputs.idea }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            printf '%s' "$INPUT_IDEA" > /tmp/idea.txt
          else
            LATEST=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- 'ideas/*.md' | head -n1)
            if [ -z "$LATEST" ]; then
              LATEST=$(git log -1 --format= --name-only -- 'ideas/*.md' | head -n1)
            fi
            if [ -z "$LATEST" ]; then echo "No idea file found in ideas/" >&2; exit 1; fi
            cp "$LATEST" /tmp/idea.txt
            echo "Using most recently committed idea: $LATEST"
          fi
          B64=$(base64 -w0 /tmp/idea.txt)
          { echo 'IDEA_B64<<GF_EOF'; echo "$B64"; echo 'GF_EOF'; } >> "$GITHUB_OUTPUT"

      - name: Run production pipeline
        env:
          OPENAI_PRODUCTION: ${{ secrets.OPENAI_PRODUCTION }}
          OPENROUTER_PRODUCTION: ${{ secrets.OPENROUTER_PRODUCTION }}
          GF_LLM_PROVIDER: ${{ github.event.inputs.provider || 'openai' }}
          GF_LLM_LANE: production
          GF_MODEL: ${{ vars.GF_MODEL }}
          GF_MODEL_DIRECTOR: ${{ vars.GF_MODEL_DIRECTOR }}
          GF_MODEL_ENGINEER: ${{ vars.GF_MODEL_ENGINEER }}
          GF_MODEL_PLAYTESTER: ${{ vars.GF_MODEL_PLAYTESTER }}
          GF_MODEL_AUDITOR: ${{ vars.GF_MODEL_AUDITOR }}
          GF_MAX_POLISH_ROUNDS: '3'
          GF_MIN_SCORE: '6.5'
          IDEA_B64: ${{ steps.prep.outputs.IDEA_B64 }}
          BUDGET: ${{ github.event.inputs.budget_usd || '10' }}
        run: |
          printf '%s' "$IDEA_B64" | base64 -d > /tmp/idea-decoded.txt
          node factory/src/index.mjs --idea-file /tmp/idea-decoded.txt --budget "$BUDGET"

      - name: Identify latest draft
        id: meta
        if: success()
        run: |
          SLUG=$(ls -t drafts | head -n1)
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "title=$(jq -r .title "drafts/$SLUG/meta.json")" >> "$GITHUB_OUTPUT"

      - name: Commit results and evidence
        if: always()
        run: |
          git config user.name "game-factory-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "factory: run ${{ github.run_id }} (${{ job.status }})"
          git push

      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-evidence-${{ github.run_id }}
          path: |
            runs/
            drafts/
            learning/aggregates/
            learning/triggers/
            learning/analysis/
            learning/root-causes/
            learning/candidates/
            learning/orchestration/
          if-no-files-found: ignore

      - name: Open review issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "[Review] ${{ steps.meta.outputs.title }}" --body-file "drafts/${{ steps.meta.outputs.slug }}/REVIEW.md"
