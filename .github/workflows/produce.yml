name: Produce Game

on:
  workflow_dispatch:
    inputs:
      idea:
        description: 'Spielidee (leer lassen = Director waehlt frei)'
        required: false
        default: ''
      budget_usd:
        description: 'Maximale API-Kosten in USD fuer diesen Lauf'
        required: false
        default: '10'
      provider:
        description: 'LLM Provider'
        required: false
        default: 'openai'
        type: choice
        options: [openai, openrouter, googleai, huggingface]
  push:
    paths: ['ideas/**']
    branches: [main]

concurrency:
  group: game-factory-production
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }

      - name: Check API configuration
        env:
          GF_LLM_API_KEY: ${{ secrets.GF_LLM_API_KEY }}
          OPENROUTER_PRODUCTION: ${{ secrets.OPENROUTER_PRODUCTION }}
          GF_LLM_PROVIDER: ${{ github.event.inputs.provider || 'openai' }}
        run: |
          if [ "$GF_LLM_PROVIDER" = "openrouter" ]; then
            test -n "$OPENROUTER_PRODUCTION" || { echo "OPENROUTER_PRODUCTION is missing in repository secrets" >&2; exit 1; }
          else
            test -n "$GF_LLM_API_KEY" || { echo "GF_LLM_API_KEY is missing in repository secrets" >&2; exit 1; }
          fi
          echo "Using provider: $GF_LLM_PROVIDER (production credential lane)"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Prepare idea
        id: prep
        env:
          MANUAL_IDEA: ${{ github.event.inputs.idea }}
        run: |
          if [ -n "$MANUAL_IDEA" ]; then
            printf '%s\n' "$MANUAL_IDEA" > /tmp/idea.txt
            echo "Using manual trigger idea"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            IDEA_FILE=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- 'ideas/*.md' | head -n1)
            if [ -z "$IDEA_FILE" ]; then echo "Push trigger did not contain an idea file" >&2; exit 1; fi
            cp "$IDEA_FILE" /tmp/idea.txt
            echo "Using pushed idea: $IDEA_FILE"
          else
            LATEST=$(git log -1 --format= --name-only -- 'ideas/*.md' | head -n1)
            if [ -z "$LATEST" ]; then echo "No idea file found in ideas/" >&2; exit 1; fi
            cp "$LATEST" /tmp/idea.txt
            echo "Using most recently committed idea: $LATEST"
          fi
          B64=$(base64 -w0 /tmp/idea.txt)
          { echo 'IDEA_B64<<GF_EOF'; echo "$B64"; echo 'GF_EOF'; } >> "$GITHUB_OUTPUT"

      - name: Run production pipeline
        env:
          GF_LLM_API_KEY: ${{ secrets.GF_LLM_API_KEY }}
          OPENROUTER_PRODUCTION: ${{ secrets.OPENROUTER_PRODUCTION }}
          GF_LLM_PROVIDER: ${{ github.event.inputs.provider || 'openai' }}
          GF_LLM_LANE: production
          GF_MODEL: ${{ vars.GF_MODEL }}
          GF_MODEL_DIRECTOR: ${{ vars.GF_MODEL_DIRECTOR }}
          GF_MODEL_ENGINEER: ${{ vars.GF_MODEL_ENGINEER }}
          GF_MODEL_PLAYTESTER: ${{ vars.GF_MODEL_PLAYTESTER }}
          GF_MODEL_AUDITOR: ${{ vars.GF_MODEL_AUDITOR }}
          GF_MAX_POLISH_ROUNDS: '3'
          GF_MIN_SCORE: '6.5'
          IDEA_B64: ${{ steps.prep.outputs.IDEA_B64 }}
          BUDGET: ${{ github.event.inputs.budget_usd || '10' }}
        run: |
          printf '%s' "$IDEA_B64" | base64 -d > /tmp/idea-decoded.txt
          node factory/src/index.mjs --idea-file /tmp/idea-decoded.txt --budget "$BUDGET"

      - name: Identify latest draft
        id: meta
        if: success()
        run: |
          SLUG=$(ls -t drafts | head -n1)
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "title=$(jq -r .title "drafts/$SLUG/meta.json")" >> "$GITHUB_OUTPUT"

      - name: Commit results and evidence
        if: always()
        run: |
          git config user.name "game-factory-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "factory: run ${{ github.run_id }} (${{ job.status }})"
          git push

      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-evidence-${{ github.run_id }}
          path: |
            runs/
            drafts/
          if-no-files-found: ignore

      - name: Open review issue
        if: success()
        env: { GH_TOKEN: ${{ github.token }} }
        run: gh issue create --title "[Review] ${{ steps.meta.outputs.title }}" --body-file "drafts/${{ steps.meta.outputs.slug }}/REVIEW.md"
