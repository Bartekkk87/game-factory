name: Produce Game

on:
  workflow_dispatch:
    inputs:
      idea:
        description: 'Spielidee (leer lassen = Director waehlt frei)'
        required: false
        default: ''
      budget_usd:
        description: 'Maximale API-Kosten in USD fuer diesen Lauf'
        required: false
        default: '10'
      provider:
        description: 'Globaler LLM Provider'
        required: false
        default: 'openai'
        type: choice
        options: [openai, openrouter]
      model:
        description: 'Optionaler globaler Modell-Slug'
        required: false
        default: ''
      director_provider:
        description: 'Optionaler Director Provider Override'
        required: false
        default: ''
      director_model:
        description: 'Optionaler Director Modell Override'
        required: false
        default: ''
      engineer_provider:
        description: 'Optionaler Engineer Provider Override'
        required: false
        default: ''
      engineer_model:
        description: 'Optionaler Engineer Modell Override'
        required: false
        default: ''
      playtester_provider:
        description: 'Optionaler Playtester Provider Override'
        required: false
        default: ''
      playtester_model:
        description: 'Optionaler Playtester Modell Override'
        required: false
        default: ''
      auditor_provider:
        description: 'Optionaler Auditor Provider Override'
        required: false
        default: ''
      auditor_model:
        description: 'Optionaler Auditor Modell Override'
        required: false
        default: ''
      director_max_tokens:
        description: 'Maximale Output-Tokens fuer Director/Director-Repair'
        required: false
        default: '32768'
      engineer_max_tokens:
        description: 'Maximale Output-Tokens fuer Engineer Build/Repair/Rebuild/Polish'
        required: false
        default: '65536'
      playtester_max_tokens:
        description: 'Maximale Output-Tokens fuer Playtester'
        required: false
        default: '32768'
      auditor_max_tokens:
        description: 'Maximale Output-Tokens fuer Auditor'
        required: false
        default: '16384'
  push:
    paths: ['ideas/**']
    branches: [main]

concurrency:
  group: game-factory-runtime-state
  cancel-in-progress: false

jobs:
  produce:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: '24' }

      - name: Load isolated runtime state
        run: |
          git config user.name "game-factory-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main runtime-state
          node factory/src/control/staged-commit-policy.mjs \
            --mode produce --check-state-history --base-ref origin/main --state-ref origin/runtime-state
          git merge --no-edit origin/runtime-state
          node factory/src/control/staged-commit-policy.mjs \
            --mode produce --check-state-tree --base-ref origin/main --state-ref HEAD

      - name: Check API configuration
        env:
          OPENAI_PRODUCTION: ${{ secrets.OPENAI_PRODUCTION }}
          OPENROUTER_PRODUCTION: ${{ secrets.OPENROUTER_PRODUCTION }}
          GF_LLM_PROVIDER: ${{ github.event.inputs.provider || 'openai' }}
          GF_LLM_PROVIDER_DIRECTOR: ${{ github.event.inputs.director_provider || vars.GF_LLM_PROVIDER_DIRECTOR }}
          GF_LLM_PROVIDER_ENGINEER: ${{ github.event.inputs.engineer_provider || vars.GF_LLM_PROVIDER_ENGINEER }}
          GF_LLM_PROVIDER_PLAYTESTER: ${{ github.event.inputs.playtester_provider || vars.GF_LLM_PROVIDER_PLAYTESTER }}
          GF_LLM_PROVIDER_AUDITOR: ${{ github.event.inputs.auditor_provider || vars.GF_LLM_PROVIDER_AUDITOR }}
        run: |
          PROVIDERS=$(printf '%s\n' \
            "$GF_LLM_PROVIDER" \
            "$GF_LLM_PROVIDER_DIRECTOR" \
            "$GF_LLM_PROVIDER_ENGINEER" \
            "$GF_LLM_PROVIDER_PLAYTESTER" \
            "$GF_LLM_PROVIDER_AUDITOR" | sed '/^$/d' | sort -u)
          while IFS= read -r provider; do
            case "$provider" in
              openai) test -n "$OPENAI_PRODUCTION" || { echo "OPENAI_PRODUCTION is missing in repository secrets" >&2; exit 1; } ;;
              openrouter) test -n "$OPENROUTER_PRODUCTION" || { echo "OPENROUTER_PRODUCTION is missing in repository secrets" >&2; exit 1; } ;;
              *) echo "Provider $provider has no approved Production credential lane" >&2; exit 1 ;;
            esac
            echo "Using provider: $provider (isolated production credential lane)"
          done <<< "$PROVIDERS"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Prepare idea
        id: prep
        env:
          MANUAL_IDEA: ${{ github.event.inputs.idea }}
        run: |
          if [ -n "$MANUAL_IDEA" ]; then
            printf '%s\n' "$MANUAL_IDEA" > /tmp/idea.txt
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            IDEA_FILE=$(git diff --name-only "$GITHUB_SHA^1" "$GITHUB_SHA" -- 'ideas/*.md' | head -n1)
            test -n "$IDEA_FILE" || { echo "Push trigger did not contain an idea file" >&2; exit 1; }
            cp "$IDEA_FILE" /tmp/idea.txt
          else
            LATEST=$(git log origin/main -1 --format= --name-only -- 'ideas/*.md' | head -n1)
            test -n "$LATEST" || { echo "No idea file found in ideas/" >&2; exit 1; }
            cp "$LATEST" /tmp/idea.txt
          fi
          B64=$(base64 -w0 /tmp/idea.txt)
          { echo 'IDEA_B64<<GF_EOF'; echo "$B64"; echo 'GF_EOF'; } >> "$GITHUB_OUTPUT"

      - name: Run production pipeline
        env:
          OPENAI_PRODUCTION: ${{ secrets.OPENAI_PRODUCTION }}
          OPENROUTER_PRODUCTION: ${{ secrets.OPENROUTER_PRODUCTION }}
          GF_LLM_PROVIDER: ${{ github.event.inputs.provider || 'openai' }}
          GF_LLM_LANE: production
          GF_MODEL: ${{ github.event.inputs.model || vars.GF_MODEL }}
          GF_LLM_PROVIDER_DIRECTOR: ${{ github.event.inputs.director_provider || vars.GF_LLM_PROVIDER_DIRECTOR }}
          GF_LLM_PROVIDER_ENGINEER: ${{ github.event.inputs.engineer_provider || vars.GF_LLM_PROVIDER_ENGINEER }}
          GF_LLM_PROVIDER_PLAYTESTER: ${{ github.event.inputs.playtester_provider || vars.GF_LLM_PROVIDER_PLAYTESTER }}
          GF_LLM_PROVIDER_AUDITOR: ${{ github.event.inputs.auditor_provider || vars.GF_LLM_PROVIDER_AUDITOR }}
          GF_MODEL_DIRECTOR: ${{ github.event.inputs.director_model || vars.GF_MODEL_DIRECTOR }}
          GF_MODEL_ENGINEER: ${{ github.event.inputs.engineer_model || vars.GF_MODEL_ENGINEER }}
          GF_MODEL_PLAYTESTER: ${{ github.event.inputs.playtester_model || vars.GF_MODEL_PLAYTESTER }}
          GF_MODEL_AUDITOR: ${{ github.event.inputs.auditor_model || vars.GF_MODEL_AUDITOR }}
          GF_DIRECTOR_MAX_TOKENS: ${{ github.event.inputs.director_max_tokens || '32768' }}
          GF_ENGINEER_MAX_TOKENS: ${{ github.event.inputs.engineer_max_tokens || '65536' }}
          GF_PLAYTESTER_MAX_TOKENS: ${{ github.event.inputs.playtester_max_tokens || '32768' }}
          GF_AUDITOR_MAX_TOKENS: ${{ github.event.inputs.auditor_max_tokens || '16384' }}
          GF_MAX_POLISH_ROUNDS: '3'
          GF_MIN_SCORE: '6.5'
          IDEA_B64: ${{ steps.prep.outputs.IDEA_B64 }}
          BUDGET: ${{ github.event.inputs.budget_usd || '10' }}
        run: |
          printf '%s' "$IDEA_B64" | base64 -d > /tmp/idea-decoded.txt
          node factory/src/index.mjs --idea-file /tmp/idea-decoded.txt --budget "$BUDGET"

      - name: Prepare opaque-origin Owner preview
        if: success()
        run: node factory/src/publish/prepare-sandbox-preview.mjs

      - name: Identify latest draft
        id: meta
        if: success()
        run: |
          SLUG=$(ls -t drafts | head -n1)
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "title=$(jq -r .title "drafts/$SLUG/meta.json")" >> "$GITHUB_OUTPUT"

      - name: Verify protected paths were not changed at runtime
        if: always()
        run: node factory/src/control/staged-commit-policy.mjs --mode produce --check-runtime

      - name: Prepare bounded binary-evidence manifest
        if: always()
        run: |
          node factory/src/control/binary-evidence.mjs \
            --mode prepare --roots runs,drafts \
            --out "evaluation/results/BINARY-EVIDENCE-${{ github.run_id }}.json" \
            --artifact-name "run-binary-evidence-${{ github.run_id }}" \
            --workflow-run-id "${{ github.run_id }}" \
            --retention-days 30

      - name: Upload binary evidence outside Git history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-binary-evidence-${{ github.run_id }}
          path: |
            runs/**/*.png
            runs/**/*.jpg
            runs/**/*.jpeg
            runs/**/*.webp
            runs/**/*.gif
            runs/**/*.mp4
            runs/**/*.webm
            drafts/**/*.png
            drafts/**/*.jpg
            drafts/**/*.jpeg
            drafts/**/*.webp
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove binary evidence before durable Git state
        if: always()
        run: node factory/src/control/binary-evidence.mjs --mode purge --roots runs,drafts

      - name: Commit results and evidence to runtime-state
        if: always()
        run: |
          git add -A -- runs drafts memory learning evaluation/results
          node factory/src/control/staged-commit-policy.mjs --mode produce --check-staged
          git diff --cached --quiet || git commit -m "factory: run ${{ github.run_id }} (${{ job.status }})"
          node factory/src/control/staged-commit-policy.mjs \
            --mode produce --check-state-tree --base-ref origin/main --state-ref HEAD
          git push origin HEAD:runtime-state

      - name: Upload structured evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-evidence-${{ github.run_id }}
          path: |
            runs/
            drafts/
            learning/aggregates/
            learning/triggers/
            learning/analysis/
            learning/root-causes/
            learning/candidates/
            learning/orchestration/
          if-no-files-found: ignore
          retention-days: 30

      - name: Open review issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "[Review] ${{ steps.meta.outputs.title }}" --body-file "drafts/${{ steps.meta.outputs.slug }}/REVIEW.md"
