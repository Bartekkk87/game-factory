name: Project PR Provenance Dispatch Migration

on:
  push:
    branches:
      - codex/project-pr-provenance-dispatch
    paths:
      - '.github/workflows/project-pr-provenance-dispatch-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/project-pr-provenance-dispatch
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Patch runtime and tests
        run: node factory/src/project/_dispatch-migration.cjs

      - name: Remove one-time migration files
        run: |
          rm factory/src/project/_dispatch-migration.cjs
          rm .github/workflows/project-pr-provenance-dispatch-migration.yml

      - name: Verify focused Project tests
        run: |
          node --check factory/src/project/runner.mjs
          node --check factory/src/project/trusted-pr-dispatch.mjs
          node factory/src/project/test-pg-a0.mjs
          node factory/src/project/test-trusted-pr-provenance.mjs

      - name: Commit migration result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(project): dispatch trusted provenance after task PR"
          git push origin HEAD:codex/project-pr-provenance-dispatch
