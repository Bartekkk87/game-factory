<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harbor Courier</title>
<style>
html,body{margin:0;height:100%;background:#000;display:grid;place-items:center;overflow:hidden}
canvas{image-rendering:auto}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1679A8}body{display:grid;place-items:center}canvas{display:block;image-rendering:auto;box-shadow:0 18px 55px rgba(7,54,74,.38);border-radius:10px;touch-action:none}
</style>
</head>
<body>

<script>
(function () {
  'use strict';
  const VERSION = '1.0.0';
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  const pick = (arr) => arr[(Math.random() * arr.length) | 0];
  const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
  const TAU = Math.PI * 2;
  function makeRng(seed) {
    let s = seed >>> 0 || 1;
    return function () {
      s ^= s << 13;
      s ^= s >>> 17;
      s ^= s << 5;
      s >>>= 0;
      return s / 4294967296;
    };
  }
  const Eases = {
    linear: (t) => t,
    outCubic: (t) => 1 - Math.pow(1 - t, 3),
    inCubic: (t) => t * t * t,
    outQuad: (t) => 1 - (1 - t) * (1 - t),
    outBack: (t) => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
    outElastic: (t) =>
      t === 0 || t === 1 ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * ((2 * Math.PI) / 3)) + 1
  };

  const Sfx = {
    ctx: null,
    master: null,
    muted: false,
    ensure() {
      if (this.ctx || this.muted) return;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.5;
        this.master.connect(this.ctx.destination);
      } catch (e) {}
    },
    resume() {
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    beep({ freq = 440, to = null, dur = 0.15, type = 'square', vol = 0.4, delay = 0 } = {}) {
      if (!this.ctx || this.muted) return;
      const t = this.ctx.currentTime + delay;
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(this.master);
      o.start(t);
      o.stop(t + dur + 0.02);
    },
    noise({ dur = 0.2, vol = 0.3, freq = 1200, delay = 0 } = {}) {
      if (!this.ctx || this.muted) return;
      const t = this.ctx.currentTime + delay;
      const len = Math.max(1, (dur * this.ctx.sampleRate) | 0);
      const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = this.ctx.createBufferSource();
      src.buffer = buf;
      const f = this.ctx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = freq;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f).connect(g).connect(this.master);
      src.start(t);
    },
    melody(notes, { type = 'square', vol = 0.35 } = {}) {
      let delay = 0;
      for (const [freq, dur] of notes) {
        this.beep({ freq, dur: dur * 0.95, type, vol, delay });
        delay += dur;
      }
    }
  };

  class Input {
    constructor(canvas) {
      this.keys = Object.create(null);
      this._edge = Object.create(null);
      this.pointer = { x: 0, y: 0, down: false, clicked: false };
      this._anyAction = [];
      const kd = (e) => {
        if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
        if (!this.keys[e.code]) this._edge[e.code] = true;
        this.keys[e.code] = true;
        Sfx.ensure();
        Sfx.resume();
        for (const fn of this._anyAction) fn(e.code);
      };
      const ku = (e) => {
        this.keys[e.code] = false;
      };
      window.addEventListener('keydown', kd);
      window.addEventListener('keyup', ku);
      const toLocal = (e) => {
        const r = canvas.getBoundingClientRect();
        return {
          x: ((e.clientX - r.left) / r.width) * canvas._lw,
          y: ((e.clientY - r.top) / r.height) * canvas._lh
        };
      };
      canvas.addEventListener('pointermove', (e) => {
        Object.assign(this.pointer, toLocal(e));
      });
      canvas.addEventListener('pointerdown', (e) => {
        Sfx.ensure();
        Sfx.resume();
        Object.assign(this.pointer, toLocal(e));
        this.pointer.down = true;
        this.pointer.clicked = true;
        for (const fn of this._anyAction) fn('PointerDown');
      });
      window.addEventListener('pointerup', () => {
        this.pointer.down = false;
      });
    }
    pressed(code) {
      return !!this._edge[code];
    }
    onAnyInput(fn) {
      this._anyAction.push(fn);
    }
    _endFrame() {
      this._edge = Object.create(null);
      this.pointer.clicked = false;
    }
  }

  class Particles {
    constructor(cap = 700) {
      this.pool = Array.from({ length: cap }, () => ({ active: false }));
    }
    emit(x, y, { count = 10, speed = 120, size = 4, life = 0.6, colors = ['#fff'], gravity = 200, spread = TAU, dir = 0 } = {}) {
      let made = 0;
      for (const p of this.pool) {
        if (p.active) continue;
        const a = dir + (spread === TAU ? rand(TAU) : rand(-spread / 2, spread / 2));
        const v = speed * rand(0.4, 1);
        p.active = true;
        p.x = x;
        p.y = y;
        p.vx = Math.cos(a) * v;
        p.vy = Math.sin(a) * v;
        p.life = p.maxLife = life * rand(0.6, 1.2);
        p.size = size * rand(0.6, 1.4);
        p.color = pick(colors);
        p.gravity = gravity;
        if (++made >= count) break;
      }
    }
    update(dt) {
      for (const p of this.pool) {
        if (!p.active) continue;
        p.life -= dt;
        if (p.life <= 0) {
          p.active = false;
          continue;
        }
        p.vy += p.gravity * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
      }
    }
    draw(ctx) {
      for (const p of this.pool) {
        if (!p.active) continue;
        ctx.globalAlpha = clamp(p.life / p.maxLife, 0, 1);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, TAU);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }

  class Tweens {
    constructor() {
      this.list = [];
    }
    add(obj, props, dur, ease = 'outCubic', onDone = null) {
      const from = {};
      for (const k of Object.keys(props)) from[k] = obj[k];
      this.list.push({ obj, props, from, t: 0, dur, ease: Eases[ease] || Eases.outCubic, onDone });
    }
    update(dt) {
      for (let i = this.list.length - 1; i >= 0; i--) {
        const tw = this.list[i];
        tw.t += dt;
        const k = clamp(tw.t / tw.dur, 0, 1);
        const e = tw.ease(k);
        for (const key of Object.keys(tw.props)) {
          tw.obj[key] = lerp(tw.from[key], tw.props[key], e);
        }
        if (k >= 1) {
          this.list.splice(i, 1);
          if (tw.onDone) tw.onDone();
        }
      }
    }
  };

  const Draw = {
    text(ctx, str, x, y, { size = 24, color = '#fff', align = 'center', baseline = 'middle', weight = '800', font = 'system-ui, sans-serif' } = {}) {
      ctx.fillStyle = color;
      ctx.textAlign = align;
      ctx.textBaseline = baseline;
      ctx.font = `${weight} ${size}px ${font}`;
      ctx.fillText(str, x, y);
    },
    roundRect(ctx, x, y, w, h, r, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h);
      ctx.fill();
    },
    vignette(ctx, w, h, strength = 0.35) {
      const g = ctx.createRadialGradient(w / 2, h / 2, h * 0.4, w / 2, h / 2, h * 0.85);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, `rgba(0,0,0,${strength})`);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
    }
  };

  class Game {
    constructor({ id = 'gf-game', title = 'Untitled', width = 960, height = 540, palette = ['#7c5cff', '#00e0ff', '#ff5c8a', '#ffd166'], background = '#0b0e1a', seed = (Number.isInteger(window.__GF_VERIFIER_SEED__) ? window.__GF_VERIFIER_SEED__ : Date.now() % 100000) } = {}) {
      this.id = id;
      this.title = title;
      this.W = width;
      this.H = height;
      this.palette = palette;
      this.background = background;
      this.seed = seed >>> 0;
      this.rng = makeRng(this.seed);
      this.scenes = {};
      this.sceneName = null;
      this.state = 'boot';
      this.score = 0;
      this.best = Number(localStorage.getItem('gf-best-' + id) || 0);
      this.time = 0;
      this.shakeMag = 0;
      this.shakeDur = 0;
      this.flashAlpha = 0;
      this.flashColor = '#ffffff';
      this._hitStopRemaining = 0;
      this._fpsFrames = 0;
      this._fpsTime = 0;
      this.fps = 60;
      this.particles = new Particles();
      this.tweens = new Tweens();
      this.probeErrors = [];

      const canvas = document.createElement('canvas');
      canvas.id = 'game';
      document.body.appendChild(canvas);
      this.canvas = canvas;
      canvas._lw = this.W;
      canvas._lh = this.H;
      const fit = () => {
        const s = Math.min(window.innerWidth / this.W, window.innerHeight / this.H);
        canvas.style.width = Math.floor(this.W * s) + 'px';
        canvas.style.height = Math.floor(this.H * s) + 'px';
      };
      window.addEventListener('resize', fit);
      fit();

      const ctx = canvas.getContext('2d');
      this.ctx = ctx;

      this.input = new Input(canvas);
      this.input.onAnyInput(() => {
        if (this.state === 'title' && this._titleStart) this._startFromTitle();
        else if ((this.state === 'gameover' || this.state === 'won') && this.time > 0.8) this.restart();
      });

      window.addEventListener('error', (e) => this._err(e.message));
      window.addEventListener('unhandledrejection', (e) => this._err(String(e.reason)));

      window.__GF__ = {
        version: VERSION,
        info: { title, id, engine: VERSION, seed: this.seed },
        errors: this.probeErrors,
        getState: () => this.state,
        getScore: () => this.score,
        getBest: () => this.best,
        getFps: () => this.fps,
        getTime: () => this.time,
        getSeed: () => this.seed,
        flags: {},
        restart: () => this.restart()
      };

      let last = performance.now();
      const frame = (now) => {
        requestAnimationFrame(frame);
        let dt = (now - last) / 1000;
        last = now;
        dt = Math.min(dt, 0.1);
        this._fpsFrames++;
        this._fpsTime += dt;
        if (this._fpsTime >= 0.5) {
          this.fps = Math.round(this._fpsFrames / this._fpsTime);
          this._fpsFrames = 0;
          this._fpsTime = 0;
        }
        this._update(dt);
        this._draw(ctx);
        this.input._endFrame();
      };
      requestAnimationFrame(frame);
    }

    get currentScene() {
      return this.sceneName ? this.scenes[this.sceneName] || null : null;
    }

    _err(msg) {
      if (this.probeErrors.length < 25 && !this.probeErrors.includes(msg)) this.probeErrors.push(String(msg));
    }

    add(name, scene) {
      scene.name = name;
      scene.game = this;
      this.scenes[name] = scene;
      return scene;
    }
    go(name) {
      const next = this.scenes[name];
      if (!next) return this._err('unknown scene: ' + name);
      this.sceneName = name;
      this.state = name === 'title' ? 'title' : 'playing';
      if (next.init) next.init();
      if (next.reset) next.reset();
      this.time = 0;
    }
    titleScreen({ subtitle = 'Press any key', onStart = null } = {}) {
      this._titleStart = onStart || (() => this.go(this._firstPlayScene()));
      this.state = 'title';
      this._subtitle = subtitle;
    }
    _firstPlayScene() {
      const names = Object.keys(this.scenes);
      return names.find((n) => n !== 'title') || names[0];
    }
    _startFromTitle() {
      Sfx.ensure();
      Sfx.resume();
      Sfx.beep({ freq: 520, to: 780, dur: 0.12, type: 'triangle', vol: 0.35 });
      this._titleStart();
    }
    addScore(n = 1) {
      if (this.state !== 'playing') return;
      this.score += n;
      if (this.score > this.best) {
        this.best = this.score;
        localStorage.setItem('gf-best-' + this.id, String(this.best));
      }
    }
    shake(mag = 6, dur = 0.3) {
      this.shakeMag = mag;
      this.shakeDur = dur;
    }
    flash(color = '#ffffff', alpha = 0.5) {
      this.flashColor = color;
      this.flashAlpha = alpha;
    }
    burst(x, y, opts) {
      this.particles.emit(x, y, opts);
    }
    hitStop(dur = 0.06) {
      this._hitStopRemaining = Math.max(this._hitStopRemaining, dur);
    }
    gameOver({ message = 'GAME OVER' } = {}) {
      if (this.state !== 'playing') return;
      this.state = 'gameover';
      this._endMessage = message;
      this.shake(9, 0.45);
      Sfx.melody([[392, 0.12], [330, 0.12], [262, 0.2]]);
    }
    win({ message = 'YOU WIN!' } = {}) {
      if (this.state !== 'playing') return;
      this.state = 'won';
      this._endMessage = message;
      Sfx.melody([[523, 0.1], [659, 0.1], [784, 0.18]], { type: 'triangle' });
    }
    restart() {
      this.score = 0;
      this.time = 0;
      this.particles = new Particles();
      this.tweens = new Tweens();
      const sc = this.scenes[this.sceneName];
      this.state = 'playing';
      if (sc && sc.reset) sc.reset();
      else if (sc && sc.init) sc.init();
      Sfx.beep({ freq: 660, dur: 0.08, vol: 0.3 });
    }

    _update(dtRaw) {
      this.tweens.update(dtRaw);
      if (this.shakeDur > 0) this.shakeDur -= dtRaw;
      if (this.flashAlpha > 0) this.flashAlpha = Math.max(0, this.flashAlpha - dtRaw * 2.5);
      if (this.state !== 'playing') return;
      if (this._hitStopRemaining > 0) {
        this._hitStopRemaining -= dtRaw;
        return;
      }
      const dt = Math.min(dtRaw, 1 / 20);
      this.time += dt;
      const sc = this.scenes[this.sceneName];
      if (sc && sc.update) sc.update(dt);
      this.particles.update(dt);
    }

    _draw(ctx) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = this.background;
      ctx.fillRect(0, 0, this.W, this.H);
      let sx = 0;
      let sy = 0;
      if (this.shakeDur > 0) {
        sx = rand(-this.shakeMag, this.shakeMag);
        sy = rand(-this.shakeMag, this.shakeMag);
      }
      ctx.translate(sx, sy);
      const sc = this.scenes[this.sceneName];
      if (sc && sc.draw) sc.draw(ctx);
      this.particles.draw(ctx);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      if (this.state === 'title') {
        ctx.fillStyle = 'rgba(5,8,16,0.55)';
        ctx.fillRect(0, 0, this.W, this.H);
        Draw.text(ctx, this.title, this.W / 2, this.H / 2 - 40, { size: 56, color: this.palette[0] });
        Draw.text(ctx, this._subtitle || '', this.W / 2, this.H / 2 + 24, { size: 22, color: '#dfe6ff', weight: '600' });
        Draw.text(ctx, 'BEST ' + this.best, this.W / 2, this.H - 40, { size: 18, color: '#8fa3d9', weight: '600' });
      } else if (this.state === 'gameover' || this.state === 'won') {
        ctx.fillStyle = this.state === 'won' ? 'rgba(10,30,20,0.55)' : 'rgba(30,5,15,0.55)';
        ctx.fillRect(0, 0, this.W, this.H);
        Draw.text(ctx, this._endMessage || (this.state === 'won' ? 'YOU WIN!' : 'GAME OVER'), this.W / 2, this.H / 2 - 50, { size: 52, color: this.state === 'won' ? '#7dffb2' : '#ff7d9c' });
        Draw.text(ctx, 'SCORE ' + this.score, this.W / 2, this.H / 2 + 12, { size: 30, color: '#fff' });
        Draw.text(ctx, 'BEST ' + this.best, this.W / 2, this.H / 2 + 52, { size: 20, color: '#cdd6f4' });
        Draw.text(ctx, 'Click / press R to retry', this.W / 2, this.H / 2 + 96, { size: 17, color: '#9fb0d8', weight: '600' });
      } else {
        Draw.text(ctx, String(this.score), this.W / 2, 44, { size: 34, color: 'rgba(255,255,255,0.92)' });
        Draw.text(ctx, 'BEST ' + this.best, this.W - 20, 30, { size: 15, color: 'rgba(255,255,255,0.55)', align: 'right', weight: '700' });
      }
      if (this.flashAlpha > 0) {
        ctx.globalAlpha = this.flashAlpha;
        ctx.fillStyle = this.flashColor;
        ctx.fillRect(0, 0, this.W, this.H);
        ctx.globalAlpha = 1;
      }
    }
  }

  window.GF = { VERSION, Game, Input, Particles, Tweens, Draw, Sfx, math: { clamp, lerp, rand, randInt, pick, dist, TAU, makeRng }, Eases };
})();


(function () {
  if (!window.GF || !window.GF.Game || window.GF.__probeExtended) return;
  const BaseGame = window.GF.Game;
  class EvidencedGame extends BaseGame {
    constructor(options) {
      super(options);
      if (this.canvas) {
        this.canvas.width = this.W;
        this.canvas.height = this.H;
      }
      this._probeEvents = [];
      this._probeSeq = 0;
      window.__GF__.events = this._probeEvents;
      window.__GF__.getEvents = () => this._probeEvents.map((event) => ({ ...event, data: { ...(event.data || {}) } }));
      window.__GF__.emit = (type, data) => this.event(type, data);
    }
    event(type, data = {}) {
      let safeData = {};
      try {
        const serialized = JSON.stringify(data ?? {});
        safeData = serialized.length <= 2048
          ? JSON.parse(serialized)
          : { truncated: true, preview: serialized.slice(0, 1900) };
      } catch (_) {
        safeData = { value: String(data).slice(0, 1900) };
      }
      const event = {
        seq: ++this._probeSeq,
        type: String(type || 'event').slice(0, 80),
        time: Math.round((this.time || 0) * 1000) / 1000,
        state: this.state,
        score: this.score,
        data: safeData
      };
      if (this._probeEvents.length >= 128) this._probeEvents.shift();
      this._probeEvents.push(event);
      return event;
    }
    addScore(n = 1) {
      const before = this.score;
      super.addScore(n);
      if (this.score !== before) this.event('score_changed', { before, after: this.score, delta: this.score - before });
    }
    go(name) {
      const before = this.state;
      super.go(name);
      this.event('state_changed', { from: before, to: this.state, scene: name });
    }
    gameOver(options) {
      const before = this.state;
      super.gameOver(options);
      if (this.state !== before) this.event('game_over', { from: before, to: this.state });
    }
    win(options) {
      const before = this.state;
      super.win(options);
      if (this.state !== before) this.event('game_won', { from: before, to: this.state });
    }
  }
  window.GF.Game = EvidencedGame;
  window.GF.__probeExtended = true;
})();

</script>
<script>
const game=new GF.Game({id:'harbor-courier',title:'Harbor Courier',width:960,height:540,palette:['#1679A8','#F8D66D','#F47B62','#F5F1DF','#247B5A'],background:'#1679A8',seed:314159});
const C={water:'#1679A8',foam:'#8ed9df',sand:'#F8D66D',road:'#f5f1df',line:'#d5cdb7',coral:'#F47B62',green:'#247B5A',ink:'#17445a',cream:'#fff9e8'};
const emit=(type,data)=>{if(typeof game.event==='function')game.event(type,data);else{const g=window.__GF__;if(g){g.events=g.events||[];if(g.events.length<80)g.events.push({type,data});}window.dispatchEvent(new CustomEvent('gf-event',{detail:{type,data}}));}};
const scene={
 init(){this.buildings=[{x:275,y:132,w:170,h:105,c:'#F47B62',n:'Coral apartments'},{x:510,y:185,w:155,h:135,c:'#F8D66D',n:'Sunny hotel'},{x:705,y:245,w:115,h:105,c:'#247B5A',n:'Harbor hall'},{x:290,y:368,w:175,h:75,c:'#f09b76',n:'Bakery'},{x:55,y:70,w:130,h:105,c:'#f2c768',n:'Post office'}];this.planters=[{x:185,y:242,w:82,h:32},{x:455,y:334,w:112,h:32},{x:676,y:80,w:84,h:30},{x:810,y:130,w:33,h:82}];this.orders=[{depot:[162,286],dest:[372,286],name:'Lighthouse Café',color:'#F8D66D'},{depot:[434,105],dest:[720,112],name:'Coral House',color:'#F47B62'},{depot:[648,420],dest:[850,397],name:'Marina Market',color:'#247B5A'}];},
 reset(){this.x=145;this.y=286;this.vx=0;this.vy=0;this.order=0;this.carry=false;this.timer=90;this.moved=0;this.driveSent=false;this.bump=0;this.warn=false;this.rings=[];this.dust=0;this.runCount=(this.runCount||0)+1;if(this.runCount>1)emit('fresh_run_started',{run:this.runCount});},
 solid(x,y){if(x<28||x>932||y<70||y>510)return 'water edge';for(const b of this.buildings)if(x>b.x-11&&x<b.x+b.w+11&&y>b.y-11&&y<b.y+b.h+11)return 'building';for(const p of this.planters)if(x>p.x-10&&x<p.x+p.w+10&&y>p.y-10&&y<p.y+p.h+10)return 'planter';return '';},
 bumpInto(kind){if(this.bump<=0){this.bump=.2;game.shake(3,.18);GF.Sfx.noise({dur:.055,vol:.13,freq:700});emit('obstacle_collision_blocked',{kind});}},
 pickup(){this.carry=true;const o=this.orders[this.order];game.burst(this.x,this.y,{count:14,speed:95,size:3,life:.55,colors:[C.cream,C.sand,'#F47B62'],gravity:100});GF.Sfx.beep({freq:540,to:760,dur:.12,type:'triangle',vol:.24});},
 deliver(){const o=this.orders[this.order],before=game.score,bonus=Math.max(0,Math.floor(this.timer));const gained=100+bonus;game.addScore(gained);emit('score_change',{before,after:game.score,delivery:o.name});this.timer=Math.min(99,this.timer+3);this.carry=false;this.order++;game.hitStop(.08);game.shake(4,.18);game.flash('#fff2c4',.35);game.burst(this.x,this.y,{count:32,speed:180,size:4,life:.9,colors:[o.color,C.sand,C.cream,'#F47B62'],gravity:180});this.rings.push({x:this.x,y:this.y,r:12,life:1,color:o.color});GF.Sfx.melody([[784,.08],[988,.09],[1175,.16]],{type:'triangle',vol:.25});if(!this.driveSent&&this.moved>18){this.driveSent=true;emit('courier_drive_confirmed',{distance:Math.round(this.moved),score:game.score});}if(this.order>=3){emit('delivery_sequence_completed',{destinations:['Lighthouse Café','Coral House','Marina Market'],delivered:3});game.win({message:'ALL DOORSTEPS RUNG!'});}},
 update(dt){if(game.input.keys.Escape){game.state='title';return;}this.timer-=dt;this.bump=Math.max(0,this.bump-dt);if(this.timer<=10&&!this.warn){this.warn=true;game.flash('#F47B62',.22);GF.Sfx.beep({freq:660,dur:.08,type:'square',vol:.18});}if(this.timer<=0){this.timer=0;game.gameOver({message:'SHIFT TIME RAN OUT'});return;}let ix=(game.input.keys.ArrowRight||game.input.keys.KeyD?1:0)-(game.input.keys.ArrowLeft||game.input.keys.KeyA?1:0),iy=(game.input.keys.ArrowDown||game.input.keys.KeyS?1:0)-(game.input.keys.ArrowUp||game.input.keys.KeyW?1:0);let active=this.orders[Math.min(this.order,2)];let pt=this.carry?active.dest:active.depot;let dx=pt[0]-this.x,dy=pt[1]-this.y,dl=Math.hypot(dx,dy)||1;if(ix||iy){let il=Math.hypot(ix,iy)||1;ix/=il;iy/=il;ix=ix*.55+dx/dl*.45;iy=iy*.55+dy/dl*.45;}let mag=Math.hypot(ix,iy);if(mag>0){ix/=mag;iy/=mag;this.vx+=ix*430*dt;this.vy+=iy*430*dt;}else{this.vx*=Math.max(0,1-5*dt);this.vy*=Math.max(0,1-5*dt);}let sp=Math.hypot(this.vx,this.vy),max=190;if(sp>max){this.vx=this.vx/sp*max;this.vy=this.vy/sp*max;}let nx=this.x+this.vx*dt,ny=this.y+this.vy*dt;let k=this.solid(nx,this.y);if(k){this.vx=0;this.bumpInto(k);}else this.x=nx;k=this.solid(this.x,ny);if(k){this.vy=0;this.bumpInto(k);}else this.y=ny;if(mag>0){this.moved+=sp*dt;this.dust-=dt;if(this.dust<=0){this.dust=.16;game.burst(this.x-8,this.y+8,{count:1,speed:20,size:2,life:.4,colors:['#d8cba8'],gravity:0});}}let near=Math.hypot(this.x-pt[0],this.y-pt[1]);if(near<37){if(this.carry)this.deliver();else this.pickup();}for(let i=this.rings.length-1;i>=0;i--){let r=this.rings[i];r.life-=dt;r.r+=70*dt;if(r.life<=0)this.rings.splice(i,1);}},
 marker(ctx,p,color,label,parcel){let pulse=1+Math.sin(game.time*5)*.08;ctx.save();ctx.globalAlpha=.19;ctx.fillStyle=color;ctx.beginPath();ctx.arc(p[0],p[1],37*pulse,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle=color;ctx.lineWidth=3;ctx.beginPath();ctx.arc(p[0],p[1],25,0,Math.PI*2);ctx.stroke();ctx.fillStyle=C.cream;ctx.beginPath();ctx.arc(p[0],p[1],16,0,Math.PI*2);ctx.fill();if(parcel){ctx.fillStyle=color;ctx.fillRect(p[0]-8,p[1]-6,16,12);ctx.strokeStyle=C.ink;ctx.lineWidth=1;ctx.strokeRect(p[0]-8,p[1]-6,16,12);ctx.beginPath();ctx.moveTo(p[0],p[1]-6);ctx.lineTo(p[0],p[1]+6);ctx.stroke();}else GF.Draw.text(ctx,'⌂',p[0],p[1]+1,{size:20,color,weight:'900'});GF.Draw.text(ctx,label,p[0],p[1]-45,{size:14,color:C.ink,weight:'900'});ctx.restore();},
 draw(ctx){let g=ctx.createLinearGradient(0,0,960,540);g.addColorStop(0,'#46b8c5');g.addColorStop(1,C.water);ctx.fillStyle=g;ctx.fillRect(0,0,960,540);ctx.strokeStyle='rgba(245,241,223,.48)';ctx.lineWidth=2;for(let y=82;y<535;y+=31)for(let x=(y%62);x<960;x+=86){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+19,y);ctx.stroke();}ctx.fillStyle=C.sand;ctx.fillRect(25,57,910,455);ctx.fillStyle=C.road;ctx.fillRect(35,190,890,110);ctx.fillRect(205,70,78,430);ctx.fillRect(430,70,78,430);ctx.fillRect(650,70,70,430);ctx.fillRect(810,70,82,430);ctx.strokeStyle=C.line;ctx.lineWidth=3;ctx.setLineDash([12,12]);for(let x=60;x<910;x+=1){ctx.beginPath();ctx.moveTo(x,245);ctx.lineTo(x+1,245);ctx.stroke();}ctx.setLineDash([]);for(const b of this.buildings){GF.Draw.roundRect(ctx,b.x+5,b.y+7,b.w,b.h,13,'rgba(23,68,90,.18)');GF.Draw.roundRect(ctx,b.x,b.y,b.w,b.h,13,b.c);ctx.fillStyle='rgba(255,249,232,.7)';for(let wx=b.x+17;wx<b.x+b.w-12;wx+=30)ctx.fillRect(wx,b.y+22,13,18);GF.Draw.text(ctx,b.n,b.x+b.w/2,b.y+b.h-13,{size:11,color:C.ink,weight:'800'});}for(const p of this.planters){GF.Draw.roundRect(ctx,p.x,p.y,p.w,p.h,12,'#d98b57');GF.Draw.roundRect(ctx,p.x+5,p.y+5,p.w-10,p.h-10,10,C.green);}ctx.strokeStyle='#835f47';ctx.lineWidth=5;for(let x=736;x<920;x+=18){ctx.beginPath();ctx.moveTo(x,458);ctx.lineTo(x,492);ctx.stroke();}ctx.strokeStyle='#f5f1df';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(730,458);ctx.lineTo(928,458);ctx.stroke();let o=this.orders[Math.min(this.order,2)],pt=this.carry?o.dest:o.depot;ctx.save();ctx.strokeStyle=this.carry?o.color:'#247B5A';ctx.lineWidth=3;ctx.globalAlpha=.48;ctx.setLineDash([8,9]);ctx.lineDashOffset=-game.time*35;ctx.beginPath();ctx.moveTo(this.x,this.y);ctx.lineTo(pt[0],pt[1]);ctx.stroke();ctx.restore();this.marker(ctx,pt,o.color,this.carry?o.name:'PARCEL DEPOT',!this.carry);for(const r of this.rings){ctx.globalAlpha=r.life;ctx.strokeStyle=r.color;ctx.lineWidth=3;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;}ctx.save();ctx.translate(this.x,this.y);let ang=Math.atan2(this.vy,this.vx);if(Math.hypot(this.vx,this.vy)<5)ang=0;ctx.rotate(ang);ctx.fillStyle='rgba(20,50,60,.22)';ctx.beginPath();ctx.ellipse(2,10,23,9,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.fillStyle=C.coral;GF.Draw.roundRect(ctx,-18,-10,35,19,9,C.coral);ctx.strokeRect(-16,-8,31,15);ctx.fillStyle=C.ink;ctx.beginPath();ctx.arc(-12,12,6,0,Math.PI*2);ctx.arc(12,12,6,0,Math.PI*2);ctx.fill();ctx.fillStyle=C.cream;ctx.fillRect(5,-6,13,8);if(this.carry){ctx.fillStyle=o.color;ctx.fillRect(-3,-23,15,13);ctx.strokeStyle=C.ink;ctx.lineWidth=2;ctx.strokeRect(-3,-23,15,13);}ctx.restore();GF.Draw.roundRect(ctx,16,14,172,48,12,'rgba(23,68,90,.91)');GF.Draw.text(ctx,'TIME  '+Math.ceil(this.timer)+'s',28,38,{size:23,color:this.timer<=10?C.coral:C.cream,align:'left'});GF.Draw.roundRect(ctx,205,70,310,43,11,'rgba(255,249,232,.94)');GF.Draw.text(ctx,this.carry?'DELIVER TO: '+o.name:'PICK UP: Parcel Depot',220,92,{size:17,color:C.ink,align:'left'});GF.Draw.roundRect(ctx,625,14,145,48,12,'rgba(23,68,90,.91)');GF.Draw.text(ctx,'DELIVERED',697,29,{size:12,color:'#bde6df'});GF.Draw.text(ctx,this.order+' / 3',697,48,{size:20,color:C.cream});GF.Draw.roundRect(ctx,786,14,158,48,12,'rgba(23,68,90,.91)');GF.Draw.text(ctx,'SCORE',800,29,{size:12,color:'#bde6df',align:'left'});GF.Draw.text(ctx,String(game.score),800,49,{size:21,color:C.sand,align:'left'});GF.Draw.text(ctx,'WASD / ARROWS • Follow the ribbon',480,522,{size:14,color:C.ink,weight:'800'});GF.Draw.vignette(ctx,960,540,.14);}
};
game.add('play',scene);game.titleScreen({subtitle:'Thread seaside streets • Deliver 3 parcels • Press Enter to ride',onStart:()=>game.go('play')});
