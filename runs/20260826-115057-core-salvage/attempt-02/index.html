<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Core Salvage</title>
<style>
html,body{margin:0;height:100%;background:#000;display:grid;place-items:center;overflow:hidden}
canvas{image-rendering:auto}
body { margin: 0; overflow: hidden; background: #0A0A0A; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: 'Press Start 2P', cursive; } #game { background: #0A0A0A; }
</style>
</head>
<body>

<script>
(function () {
  'use strict';
  const VERSION = '1.0.0';
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  const pick = (arr) => arr[(Math.random() * arr.length) | 0];
  const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
  const TAU = Math.PI * 2;
  function makeRng(seed) {
    let s = seed >>> 0 || 1;
    return function () {
      s ^= s << 13;
      s ^= s >>> 17;
      s ^= s << 5;
      s >>>= 0;
      return s / 4294967296;
    };
  }
  const Eases = {
    linear: (t) => t,
    outCubic: (t) => 1 - Math.pow(1 - t, 3),
    inCubic: (t) => t * t * t,
    outQuad: (t) => 1 - (1 - t) * (1 - t),
    outBack: (t) => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
    outElastic: (t) =>
      t === 0 || t === 1 ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * ((2 * Math.PI) / 3)) + 1
  };

  const Sfx = {
    ctx: null,
    master: null,
    muted: false,
    ensure() {
      if (this.ctx || this.muted) return;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.5;
        this.master.connect(this.ctx.destination);
      } catch (e) {}
    },
    resume() {
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    beep({ freq = 440, to = null, dur = 0.15, type = 'square', vol = 0.4, delay = 0 } = {}) {
      if (!this.ctx || this.muted) return;
      const t = this.ctx.currentTime + delay;
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(this.master);
      o.start(t);
      o.stop(t + dur + 0.02);
    },
    noise({ dur = 0.2, vol = 0.3, freq = 1200, delay = 0 } = {}) {
      if (!this.ctx || this.muted) return;
      const t = this.ctx.currentTime + delay;
      const len = Math.max(1, (dur * this.ctx.sampleRate) | 0);
      const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = this.ctx.createBufferSource();
      src.buffer = buf;
      const f = this.ctx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = freq;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f).connect(g).connect(this.master);
      src.start(t);
    },
    melody(notes, { type = 'square', vol = 0.35 } = {}) {
      let delay = 0;
      for (const [freq, dur] of notes) {
        this.beep({ freq, dur: dur * 0.95, type, vol, delay });
        delay += dur;
      }
    }
  };

  class Input {
    constructor(canvas) {
      this.keys = Object.create(null);
      this._edge = Object.create(null);
      this.pointer = { x: 0, y: 0, down: false, clicked: false };
      this._anyAction = [];
      const kd = (e) => {
        if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
        if (!this.keys[e.code]) this._edge[e.code] = true;
        this.keys[e.code] = true;
        Sfx.ensure();
        Sfx.resume();
        for (const fn of this._anyAction) fn(e.code);
      };
      const ku = (e) => {
        this.keys[e.code] = false;
      };
      window.addEventListener('keydown', kd);
      window.addEventListener('keyup', ku);
      const toLocal = (e) => {
        const r = canvas.getBoundingClientRect();
        return {
          x: ((e.clientX - r.left) / r.width) * canvas._lw,
          y: ((e.clientY - r.top) / r.height) * canvas._lh
        };
      };
      canvas.addEventListener('pointermove', (e) => {
        Object.assign(this.pointer, toLocal(e));
      });
      canvas.addEventListener('pointerdown', (e) => {
        Sfx.ensure();
        Sfx.resume();
        Object.assign(this.pointer, toLocal(e));
        this.pointer.down = true;
        this.pointer.clicked = true;
        for (const fn of this._anyAction) fn('PointerDown');
      });
      window.addEventListener('pointerup', () => {
        this.pointer.down = false;
      });
    }
    pressed(code) {
      return !!this._edge[code];
    }
    onAnyInput(fn) {
      this._anyAction.push(fn);
    }
    _endFrame() {
      this._edge = Object.create(null);
      this.pointer.clicked = false;
    }
  }

  class Particles {
    constructor(cap = 700) {
      this.pool = Array.from({ length: cap }, () => ({ active: false }));
    }
    emit(x, y, { count = 10, speed = 120, size = 4, life = 0.6, colors = ['#fff'], gravity = 200, spread = TAU, dir = 0 } = {}) {
      let made = 0;
      for (const p of this.pool) {
        if (p.active) continue;
        const a = dir + (spread === TAU ? rand(TAU) : rand(-spread / 2, spread / 2));
        const v = speed * rand(0.4, 1);
        p.active = true;
        p.x = x;
        p.y = y;
        p.vx = Math.cos(a) * v;
        p.vy = Math.sin(a) * v;
        p.life = p.maxLife = life * rand(0.6, 1.2);
        p.size = size * rand(0.6, 1.4);
        p.color = pick(colors);
        p.gravity = gravity;
        if (++made >= count) break;
      }
    }
    update(dt) {
      for (const p of this.pool) {
        if (!p.active) continue;
        p.life -= dt;
        if (p.life <= 0) {
          p.active = false;
          continue;
        }
        p.vy += p.gravity * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
      }
    }
    draw(ctx) {
      for (const p of this.pool) {
        if (!p.active) continue;
        ctx.globalAlpha = clamp(p.life / p.maxLife, 0, 1);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, TAU);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }

  class Tweens {
    constructor() {
      this.list = [];
    }
    add(obj, props, dur, ease = 'outCubic', onDone = null) {
      const from = {};
      for (const k of Object.keys(props)) from[k] = obj[k];
      this.list.push({ obj, props, from, t: 0, dur, ease: Eases[ease] || Eases.outCubic, onDone });
    }
    update(dt) {
      for (let i = this.list.length - 1; i >= 0; i--) {
        const tw = this.list[i];
        tw.t += dt;
        const k = clamp(tw.t / tw.dur, 0, 1);
        const e = tw.ease(k);
        for (const key of Object.keys(tw.props)) {
          tw.obj[key] = lerp(tw.from[key], tw.props[key], e);
        }
        if (k >= 1) {
          this.list.splice(i, 1);
          if (tw.onDone) tw.onDone();
        }
      }
    }
  }

  const Draw = {
    text(ctx, str, x, y, { size = 24, color = '#fff', align = 'center', baseline = 'middle', weight = '800', font = 'system-ui, sans-serif' } = {}) {
      ctx.fillStyle = color;
      ctx.textAlign = align;
      ctx.textBaseline = baseline;
      ctx.font = `${weight} ${size}px ${font}`;
      ctx.fillText(str, x, y);
    },
    roundRect(ctx, x, y, w, h, r, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h);
      ctx.fill();
    },
    vignette(ctx, w, h, strength = 0.35) {
      const g = ctx.createRadialGradient(w / 2, h / 2, h * 0.4, w / 2, h / 2, h * 0.85);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, `rgba(0,0,0,${strength})`);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
    }
  };

  class Game {
    constructor({ id = 'gf-game', title = 'Untitled', width = 960, height = 540, palette = ['#7c5cff', '#00e0ff', '#ff5c8a', '#ffd166'], background = '#0b0e1a', seed = Date.now() % 100000 } = {}) {
      this.id = id;
      this.title = title;
      this.W = width;
      this.H = height;
      this.palette = palette;
      this.background = background;
      this.rng = makeRng(seed);
      this.scenes = {};
      this.sceneName = null;
      this.state = 'boot';
      this.score = 0;
      this.best = Number(localStorage.getItem('gf-best-' + id) || 0);
      this.time = 0;
      this.shakeMag = 0;
      this.shakeDur = 0;
      this.flashAlpha = 0;
      this.flashColor = '#ffffff';
      this.hitStop = 0;
      this._fpsFrames = 0;
      this._fpsTime = 0;
      this.fps = 60;
      this.particles = new Particles();
      this.tweens = new Tweens();
      this.probeErrors = [];

      const canvas = document.createElement('canvas');
      canvas.id = 'game';
      document.body.appendChild(canvas);
      this.canvas = canvas;
      canvas._lw = this.W;
      canvas._lh = this.H;
      const fit = () => {
        const s = Math.min(window.innerWidth / this.W, window.innerHeight / this.H);
        canvas.style.width = Math.floor(this.W * s) + 'px';
        canvas.style.height = Math.floor(this.H * s) + 'px';
      };
      window.addEventListener('resize', fit);
      fit();

      const ctx = canvas.getContext('2d');
      this.ctx = ctx;

      this.input = new Input(canvas);
      this.input.onAnyInput(() => {
        if (this.state === 'title' && this._titleStart) this._startFromTitle();
        else if ((this.state === 'gameover' || this.state === 'won') && this.time > 0.8) this.restart();
      });

      window.addEventListener('error', (e) => this._err(e.message));
      window.addEventListener('unhandledrejection', (e) => this._err(String(e.reason)));

      window.__GF__ = {
        version: VERSION,
        info: { title, id, engine: VERSION },
        errors: this.probeErrors,
        getState: () => this.state,
        getScore: () => this.score,
        getBest: () => this.best,
        getFps: () => this.fps,
        getTime: () => this.time,
        flags: {},
        restart: () => this.restart()
      };

      let last = performance.now();
      const frame = (now) => {
        requestAnimationFrame(frame);
        let dt = (now - last) / 1000;
        last = now;
        dt = Math.min(dt, 0.1);
        this._fpsFrames++;
        this._fpsTime += dt;
        if (this._fpsTime >= 0.5) {
          this.fps = Math.round(this._fpsFrames / this._fpsTime);
          this._fpsFrames = 0;
          this._fpsTime = 0;
        }
        this._update(dt);
        this._draw(ctx);
        this.input._endFrame();
      };
      requestAnimationFrame(frame);
    }

    _err(msg) {
      if (this.probeErrors.length < 25 && !this.probeErrors.includes(msg)) this.probeErrors.push(String(msg));
    }

    add(name, scene) {
      scene.name = name;
      scene.game = this;
      this.scenes[name] = scene;
      return scene;
    }
    go(name) {
      const next = this.scenes[name];
      if (!next) return this._err('unknown scene: ' + name);
      this.sceneName = name;
      this.state = name === 'title' ? 'title' : 'playing';
      if (next.init) next.init();
      if (next.reset) next.reset();
      this.time = 0;
    }
    titleScreen({ subtitle = 'Press any key', onStart = null } = {}) {
      this._titleStart = onStart || (() => this.go(this._firstPlayScene()));
      this.state = 'title';
      this._subtitle = subtitle;
    }
    _firstPlayScene() {
      const names = Object.keys(this.scenes);
      return names.find((n) => n !== 'title') || names[0];
    }
    _startFromTitle() {
      Sfx.ensure();
      Sfx.resume();
      Sfx.beep({ freq: 520, to: 780, dur: 0.12, type: 'triangle', vol: 0.35 });
      this._titleStart();
    }
    addScore(n = 1) {
      if (this.state !== 'playing') return;
      this.score += n;
      if (this.score > this.best) {
        this.best = this.score;
        localStorage.setItem('gf-best-' + this.id, String(this.best));
      }
    }
    shake(mag = 6, dur = 0.3) {
      this.shakeMag = mag;
      this.shakeDur = dur;
    }
    flash(color = '#ffffff', alpha = 0.5) {
      this.flashColor = color;
      this.flashAlpha = alpha;
    }
    burst(x, y, opts) {
      this.particles.emit(x, y, opts);
    }
    hitStop(dur = 0.06) {
      this.hitStop = Math.max(this.hitStop, dur);
    }
    gameOver({ message = 'GAME OVER' } = {}) {
      if (this.state !== 'playing') return;
      this.state = 'gameover';
      this._endMessage = message;
      this.shake(9, 0.45);
      Sfx.melody([[392, 0.12], [330, 0.12], [262, 0.2]]);
    }
    win({ message = 'YOU WIN!' } = {}) {
      if (this.state !== 'playing') return;
      this.state = 'won';
      this._endMessage = message;
      Sfx.melody([[523, 0.1], [659, 0.1], [784, 0.18]], { type: 'triangle' });
    }
    restart() {
      this.score = 0;
      this.time = 0;
      this.particles = new Particles();
      this.tweens = new Tweens();
      const sc = this.scenes[this.sceneName];
      this.state = 'playing';
      if (sc && sc.reset) sc.reset();
      else if (sc && sc.init) sc.init();
      Sfx.beep({ freq: 660, dur: 0.08, vol: 0.3 });
    }

    _update(dtRaw) {
      this.tweens.update(dtRaw);
      if (this.shakeDur > 0) this.shakeDur -= dtRaw;
      if (this.flashAlpha > 0) this.flashAlpha = Math.max(0, this.flashAlpha - dtRaw * 2.5);
      if (this.state !== 'playing') return;
      if (this.hitStop > 0) {
        this.hitStop -= dtRaw;
        return;
      }
      const dt = Math.min(dtRaw, 1 / 20);
      this.time += dt;
      const sc = this.scenes[this.sceneName];
      if (sc && sc.update) sc.update(dt);
      this.particles.update(dt);
    }

    _draw(ctx) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = this.background;
      ctx.fillRect(0, 0, this.W, this.H);
      let sx = 0;
      let sy = 0;
      if (this.shakeDur > 0) {
        sx = rand(-this.shakeMag, this.shakeMag);
        sy = rand(-this.shakeMag, this.shakeMag);
      }
      ctx.translate(sx, sy);
      const sc = this.scenes[this.sceneName];
      if (sc && sc.draw) sc.draw(ctx);
      this.particles.draw(ctx);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      if (this.state === 'title') {
        ctx.fillStyle = 'rgba(5,8,16,0.55)';
        ctx.fillRect(0, 0, this.W, this.H);
        Draw.text(ctx, this.title, this.W / 2, this.H / 2 - 40, { size: 56, color: this.palette[0] });
        Draw.text(ctx, this._subtitle || '', this.W / 2, this.H / 2 + 24, { size: 22, color: '#dfe6ff', weight: '600' });
        Draw.text(ctx, 'BEST ' + this.best, this.W / 2, this.H - 40, { size: 18, color: '#8fa3d9', weight: '600' });
      } else if (this.state === 'gameover' || this.state === 'won') {
        ctx.fillStyle = this.state === 'won' ? 'rgba(10,30,20,0.55)' : 'rgba(30,5,15,0.55)';
        ctx.fillRect(0, 0, this.W, this.H);
        Draw.text(ctx, this._endMessage || (this.state === 'won' ? 'YOU WIN!' : 'GAME OVER'), this.W / 2, this.H / 2 - 50, { size: 52, color: this.state === 'won' ? '#7dffb2' : '#ff7d9c' });
        Draw.text(ctx, 'SCORE ' + this.score, this.W / 2, this.H / 2 + 12, { size: 30, color: '#fff' });
        Draw.text(ctx, 'BEST ' + this.best, this.W / 2, this.H / 2 + 52, { size: 20, color: '#cdd6f4' });
        Draw.text(ctx, 'Click / press R to retry', this.W / 2, this.H / 2 + 96, { size: 17, color: '#9fb0d8', weight: '600' });
      } else {
        Draw.text(ctx, String(this.score), this.W / 2, 44, { size: 34, color: 'rgba(255,255,255,0.92)' });
        Draw.text(ctx, 'BEST ' + this.best, this.W - 20, 30, { size: 15, color: 'rgba(255,255,255,0.55)', align: 'right', weight: '700' });
      }
      if (this.flashAlpha > 0) {
        ctx.globalAlpha = this.flashAlpha;
        ctx.fillStyle = this.flashColor;
        ctx.fillRect(0, 0, this.W, this.H);
        ctx.globalAlpha = 1;
      }
    }
  }

  window.GF = { VERSION, Game, Input, Particles, Tweens, Draw, Sfx, math: { clamp, lerp, rand, randInt, pick, dist, TAU, makeRng }, Eases };
})();

</script>
<script>
const PALETTE = ['#0A0A0A', '#00BFFF', '#FF4500', '#D3D3D3'];
const PLAYER_SPEED = 200;
const PLAYER_HP_MAX = 100;
const ENEMY_HP_MAX = 200;
const ENEMY_WEAPON_DAMAGE = 10;
const PLAYER_WEAPON_DAMAGE = 15;
const SUBSYSTEM_HP = 50;

class Player {
    constructor(game) {
        this.game = game;
        this.x = game.W / 4;
        this.y = game.H / 2;
        this.hp = PLAYER_HP_MAX;
        this.maxHp = PLAYER_HP_MAX;
        this.weaponCooldown = 0;
        this.weaponReady = true;
        this.size = 20;
        this.invulnerableTime = 0;
        this.installedComponents = [];
    }

    update(dt) {
        let dx = 0;
        let dy = 0;
        if (this.game.input.keys['ArrowLeft'] || this.game.input.keys['KeyA']) dx = -1;
        if (this.game.input.keys['ArrowRight'] || this.game.input.keys['KeyD']) dx = 1;
        if (this.game.input.keys['ArrowUp'] || this.game.input.keys['KeyW']) dy = -1;
        if (this.game.input.keys['ArrowDown'] || this.game.input.keys['KeyS']) dy = 1;

        if (dx !== 0 || dy !== 0) {
            const mag = Math.sqrt(dx * dx + dy * dy);
            if (mag > 0) {
                this.x += (dx / mag) * PLAYER_SPEED * dt;
                this.y += (dy / mag) * PLAYER_SPEED * dt;
            }
        }

        this.x = GF.math.clamp(this.x, this.size, this.game.W / 2 - this.size);
        this.y = GF.math.clamp(this.y, this.size, this.game.H - this.size);

        if (this.weaponCooldown > 0) {
            this.weaponCooldown -= dt;
            if (this.weaponCooldown <= 0) {
                this.weaponReady = true;
            }
        }

        if (this.game.input.pointer.down && this.weaponReady) {
            this.game.scenes.play.firePlayerProjectile();
            this.weaponReady = false;
            this.weaponCooldown = 0.2;
            GF.Sfx.beep({ freq: 800, to: 1000, dur: 0.05, type: 'triangle', vol: 0.2 });
        }

        if (this.invulnerableTime > 0) {
            this.invulnerableTime -= dt;
        }
    }

    takeDamage(amount) {
        if (this.invulnerableTime > 0) return;
        this.hp -= amount;
        this.hp = GF.math.clamp(this.hp, 0, this.maxHp);
        this.game.shake(6, 0.2);
        this.game.flash(PALETTE[2], 0.4);
        this.game.hitStop(0.1);
        GF.Sfx.noise({ dur: 0.15, vol: 0.4, freq: 800 });
        this.invulnerableTime = 0.8;
        if (this.hp <= 0) {
            this.game.gameOver({ message: 'MECH DESTROYED' });
        }
    }

    repair(amount) {
        this.hp += amount;
        this.hp = GF.math.clamp(this.hp, 0, this.maxHp);
        GF.Sfx.beep({ freq: 1000, to: 1500, dur: 0.1, type: 'sine', vol: 0.3 });
        this.game.burst(this.x, this.y, { count: 15, speed: 100, size: 5, life: 0.5, colors: [PALETTE[1], '#fff'], gravity: -50 });
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        const angle = Math.atan2(this.game.input.pointer.y - this.y, this.game.input.pointer.x - this.x);
        ctx.rotate(angle);

        GF.Draw.roundRect(ctx, -this.size * 0.8, -this.size * 0.8, this.size * 1.6, this.size * 1.6, 5, PALETTE[1]);
        GF.Draw.roundRect(ctx, this.size * 0.4, -this.size * 0.3, this.size * 0.8, this.size * 0.6, 3, PALETTE[3]);
        ctx.fillStyle = PALETTE[3];
        ctx.fillRect(this.size * 1.0, -this.size * 0.1, this.size * 0.6, this.size * 0.2);
        ctx.restore();

        if (this.invulnerableTime > 0 && Math.floor(this.invulnerableTime * 10) % 2 === 0) {
            ctx.globalAlpha = 0.4;
            ctx.fillStyle = PALETTE[1];
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size * 1.5, 0, GF.math.TAU);
            ctx.fill();
            ctx.globalAlpha = 1;
        }
    }
}

class EnemySubsystem {
    constructor(type, x, y, size, angle) {
        this.type = type;
        this.x = x;
        this.y = y;
        this.size = size;
        this.hp = SUBSYSTEM_HP;
        this.maxHp = SUBSYSTEM_HP;
        this.destroyed = false;
        this.angle = angle;
        this.targetable = true;
    }

    takeDamage(amount) {
        if (this.destroyed) return;
        this.hp -= amount;
        this.hp = GF.math.clamp(this.hp, 0, this.maxHp);
        if (this.hp <= 0) {
            this.destroyed = true;
            return true;
        }
        return false;
    }

    draw(ctx, parentX, parentY) {
        if (this.destroyed) return;
        ctx.save();
        ctx.translate(parentX + this.x, parentY + this.y);
        ctx.rotate(this.angle);

        const fill = this.type === 'weapon' ? PALETTE[2] : (this.type === 'locomotion' ? PALETTE[1] : PALETTE[3]);
        GF.Draw.roundRect(ctx, -this.size / 2, -this.size / 2, this.size, this.size, 3, fill);

        const hpRatio = this.hp / this.maxHp;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(-this.size / 2, this.size / 2 + 2, this.size, 3);
        ctx.fillStyle = PALETTE[1];
        ctx.fillRect(-this.size / 2, this.size / 2 + 2, this.size * hpRatio, 3);

        ctx.restore();
    }
}

class Enemy {
    constructor(game) {
        this.game = game;
        this.x = game.W * 0.75;
        this.y = game.H / 2;
        this.hp = ENEMY_HP_MAX;
        this.maxHp = ENEMY_HP_MAX;
        this.size = 80;
        this.subsystems = [];
        this.initSubsystems();
        this.attackCooldown = 2.0;
        this.attackTelegraphTime = 0;
        this.currentAttack = null;
        this.isAttacking = false;
        this.targetIndex = 0;
        this.isDefeated = false;
        this.difficultyMultiplier = 1.0;
    }

    initSubsystems() {
        this.subsystems.push(new EnemySubsystem('weapon', this.size * 0.8, -this.size * 0.4, 25, 0));
        this.subsystems.push(new EnemySubsystem('locomotion', -this.size * 0.6, this.size * 0.6, 25, Math.PI / 2));
        this.subsystems.push(new EnemySubsystem('core', 0, 0, 35, 0));
    }

    get aliveSubsystems() {
        return this.subsystems.filter(s => !s.destroyed);
    }

    get currentTarget() {
        const targets = this.aliveSubsystems;
        if (targets.length === 0) return null;
        this.targetIndex = this.targetIndex % targets.length;
        return targets[this.targetIndex];
    }

    cycleTarget(direction) {
        const targets = this.aliveSubsystems;
        if (targets.length === 0) return;
        this.targetIndex = (this.targetIndex + direction + targets.length) % targets.length;
        GF.Sfx.beep({ freq: 600, dur: 0.05, type: 'square', vol: 0.15 });
    }

    update(dt) {
        if (this.isDefeated) return;

        if (this.attackTelegraphTime > 0) {
            this.attackTelegraphTime -= dt;
            if (this.attackTelegraphTime <= 0) {
                this.executeAttack();
            }
        } else if (this.attackCooldown > 0) {
            this.attackCooldown -= dt;
            if (this.attackCooldown <= 0) {
                this.startAttackTelegraph();
            }
        }

        this.y = this.game.H / 2 + Math.sin(this.game.time * 0.8) * 10;

        const weaponSub = this.subsystems.find(s => s.type === 'weapon');
        if (weaponSub && weaponSub.destroyed && !this.isAttacking && this.attackCooldown <= 0 && this.attackTelegraphTime <= 0) {
            this.attackCooldown = 3.0; 
        }
    }

    startAttackTelegraph() {
        if (this.subsystems.find(s => s.type === 'weapon' && s.destroyed)) {
            this.attackCooldown = 2.0 / this.difficultyMultiplier;
            return;
        }

        this.currentAttack = GF.math.pick(['projectile', 'area']);
        this.attackTelegraphTime = 1.0 / this.difficultyMultiplier;
        this.isAttacking = true;
        GF.Sfx.beep({ freq: 200, to: 400, dur: 0.5, type: 'sawtooth', vol: 0.2 });
    }

    executeAttack() {
        const player = this.game.scenes.play.player;
        if (!player) return;

        if (this.currentAttack === 'projectile') {
            this.game.scenes.play.fireEnemyProjectile(this.x, this.y);
            GF.Sfx.beep({ freq: 400, to: 200, dur: 0.1, type: 'square', vol: 0.3 });
        } else if (this.currentAttack === 'area') {
            const targetX = player.x + GF.math.rand(-50, 50);
            const targetY = player.y + GF.math.rand(-50, 50);
            this.game.scenes.play.addDamageZone(targetX, targetY, 80, 0.5, ENEMY_WEAPON_DAMAGE * 0.75);
            GF.Sfx.noise({ dur: 0.3, vol: 0.3, freq: 600 });
        }
        this.isAttacking = false;
        this.attackCooldown = 2.0 / this.difficultyMultiplier;
        this.currentAttack = null;
    }

    takeDamage(amount, subsystemHit = null) {
        if (this.isDefeated) return;
        this.hp -= amount;
        this.hp = GF.math.clamp(this.hp, 0, this.maxHp);
        this.game.addScore(amount);
        this.game.burst(this.game.input.pointer.x, this.game.input.pointer.y, { count: 10, speed: 100, size: 3, life: 0.4, colors: [PALETTE[3], '#fff'] });

        if (this.hp <= 0) {
            this.isDefeated = true;
            this.game.addScore(500);
            this.game.shake(10, 0.5);
            this.game.burst(this.x, this.y, { count: 50, speed: 200, size: 8, life: 1, colors: [PALETTE[2], PALETTE[3], '#fff'] });
            GF.Sfx.noise({ dur: 0.5, vol: 0.6, freq: 200 });
            this.game.scenes.play.showComponentDecision();
            return;
        }

        if (subsystemHit) {
            const destroyed = subsystemHit.takeDamage(amount);
            if (destroyed) {
                this.game.addScore(200);
                this.game.shake(8, 0.3);
                this.game.hitStop(0.15);
                this.game.burst(this.x + subsystemHit.x, this.y + subsystemHit.y, { count: 30, speed: 150, size: 6, life: 0.8, colors: [PALETTE[2], '#fff'] });
                GF.Sfx.noise({ dur: 0.3, vol: 0.5, freq: 400 });
                if (subsystemHit.type === 'locomotion') {
                    this.difficultyMultiplier *= 0.8;
                }
                if (this.currentTarget === subsystemHit) {
                    this.cycleTarget(1);
                }
            }
        }
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);

        GF.Draw.roundRect(ctx, -this.size / 2, -this.size / 2, this.size, this.size, 10, PALETTE[3]);
        ctx.fillStyle = PALETTE[0];
        ctx.beginPath();
        ctx.arc(0, 0, this.size * 0.3, 0, GF.math.TAU);
        ctx.fill();

        ctx.fillStyle = PALETTE[1];
        ctx.fillRect(-this.size * 0.4, this.size * 0.4, this.size * 0.2, this.size * 0.3);
        ctx.fillRect(this.size * 0.2, this.size * 0.4, this.size * 0.2, this.size * 0.3);

        for (const sub of this.subsystems) {
            sub.draw(ctx, 0, 0);
        }

        if (this.attackTelegraphTime > 0) {
            ctx.globalAlpha = 0.5 * (1 - this.attackTelegraphTime / (1.0 / this.difficultyMultiplier));
            ctx.fillStyle = PALETTE[2];
            if (this.currentAttack === 'projectile') {
                const player = this.game.scenes.play.player;
                if (player) {
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    const targetX = player.x - this.x;
                    const targetY = player.y - this.y;
                    const length = Math.sqrt(targetX * targetX + targetY * targetY);
                    const extendFactor = 1.5; 
                    ctx.lineTo(targetX * extendFactor, targetY * extendFactor);
                    ctx.lineWidth = 5;
                    ctx.strokeStyle = PALETTE[2];
                    ctx.stroke();
                }
            } else if (this.currentAttack === 'area') {
                ctx.beginPath();
                ctx.arc(0, 0, this.size * 1.5, 0, GF.math.TAU);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        const currentTarget = this.currentTarget;
        if (currentTarget) {
            ctx.globalAlpha = 0.8 + Math.sin(this.game.time * 5) * 0.2;
            ctx.strokeStyle = PALETTE[1];
            ctx.lineWidth = 3;
            ctx.strokeRect(currentTarget.x - currentTarget.size / 2 - 3, currentTarget.y - currentTarget.size / 2 - 3, currentTarget.size + 6, currentTarget.size + 6);
            ctx.globalAlpha = 1;
        }

        const hpRatio = this.hp / this.maxHp;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(-this.size / 2, -this.size / 2 - 15, this.size, 8);
        ctx.fillStyle = PALETTE[2];
        ctx.fillRect(-this.size / 2, -this.size / 2 - 15, this.size * hpRatio, 8);

        ctx.restore();
    }
}

class Projectile {
    constructor(x, y, vx, vy, damage, isPlayer, color) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.damage = damage;
        this.isPlayer = isPlayer;
        this.color = color;
        this.size = 5;
        this.life = 3;
        this.active = true;
    }

    update(dt) {
        if (!this.active) return;
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.life -= dt;
        if (this.life <= 0) this.active = false;
    }

    draw(ctx) {
        if (!this.active) return;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, GF.math.TAU);
        ctx.fill();
    }
}

class DamageZone {
    constructor(x, y, radius, duration, damage) {
        this.x = x;
        this.y = y;
        this.radius = radius;
        this.duration = duration;
        this.life = duration;
        this.damage = damage;
        this.active = true;
        this.hitPlayer = false;
    }

    update(dt) {
        if (!this.active) return;
        this.life -= dt;
        if (this.life <= 0) this.active = false;
    }

    draw(ctx) {
        if (!this.active) return;
        ctx.globalAlpha = 0.3 + 0.4 * (this.life / this.duration);
        ctx.fillStyle = PALETTE[2];
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, GF.math.TAU);
        ctx.fill();
        ctx.globalAlpha = 1;
    }
}

let game = new GF.Game({
    id: 'core-salvage',
    title: 'Core Salvage',
    width: 960,
    height: 540,
    palette: PALETTE,
    background: PALETTE[0]
});

const playScene = game.add('play', {
    player: null,
    enemy: null,
    projectiles: [],
    damageZones: [],
    gameState: 'combat',
    salvagedComponent: null,

    init() {
        this.reset();
    },

    reset() {
        this.player = new Player(game);
        this.enemy = new Enemy(game);
        this.projectiles = [];
        this.damageZones = [];
        this.gameState = 'combat';
        this.salvagedComponent = null;
        game.score = 0;
    },

    update(dt) {
        if (game.state !== 'playing') return;

        if (this.gameState === 'combat') {
            this.player.update(dt);
            this.enemy.update(dt);

            this.projectiles = this.projectiles.filter(p => {
                p.update(dt);
                return p.active && p.x > -100 && p.x < game.W + 100 && p.y > -100 && p.y < game.H + 100;
            });

            this.damageZones = this.damageZones.filter(z => {
                z.update(dt);
                return z.active;
            });

            this.checkCollisions();

            if (game.time < 15 && game.time > 1 && !this.enemy.isDefeated) {
                if (game.time % 0.5 < dt) { 
                    this.firePlayerProjectile();
                }
                this.player.x = GF.math.lerp(this.player.x, game.W / 4 + Math.sin(game.time * 5) * 50, 0.1);
                this.player.y = GF.math.lerp(this.player.y, game.H / 2 + Math.cos(game.time * 3) * 50, 0.1);
            }
        } else if (this.gameState === 'decision') {
            if (game.input.pressed('KeyI')) {
                this.makeDecision('install');
            } else if (game.input.pressed('KeyS')) {
                this.makeDecision('secure');
            } else if (game.input.pressed('KeyD')) {
                this.makeDecision('dismantle');
            }
        } else if (this.gameState === 'extraction') {
            if (game.input.pressed('KeyE')) {
                game.win({ message: 'EXTRACTION SUCCESSFUL' });
            } else if (game.input.pressed('KeyR')) {
                game.restart();
            }
        }

        if (game.input.pressed('KeyQ')) {
            this.enemy.cycleTarget(-1);
        }
        if (game.input.pressed('KeyE')) {
            this.enemy.cycleTarget(1);
        }
    },

    firePlayerProjectile() {
        const targetX = this.enemy.x + this.enemy.currentTarget.x;
        const targetY = this.enemy.y + this.enemy.currentTarget.y;
        const angle = Math.atan2(targetY - this.player.y, targetX - this.player.x);
        const speed = 400;
        this.projectiles.push(new Projectile(this.player.x, this.player.y, Math.cos(angle) * speed, Math.sin(angle) * speed, PLAYER_WEAPON_DAMAGE, true, PALETTE[1]));
    },

    fireEnemyProjectile(x, y) {
        const angle = Math.atan2(this.player.y - y, this.player.x - x);
        const speed = 250;
        this.projectiles.push(new Projectile(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, ENEMY_WEAPON_DAMAGE, false, PALETTE[2]));
    },

    addDamageZone(x, y, radius, duration, damage) {
        this.damageZones.push(new DamageZone(x, y, radius, duration, damage));
    },

    checkCollisions() {
        for (const p of this.projectiles) {
            if (!p.active) continue;

            if (p.isPlayer) {
                const enemyTarget = this.enemy.currentTarget;
                if (enemyTarget && !enemyTarget.destroyed) {
                    const globalSubX = this.enemy.x + enemyTarget.x;
                    const globalSubY = this.enemy.y + enemyTarget.y;
                    if (GF.math.dist(p.x, p.y, globalSubX, globalSubY) < p.size + enemyTarget.size / 2) {
                        this.enemy.takeDamage(p.damage, enemyTarget);
                        p.active = false;
                        game.flash(PALETTE[1], 0.1);
                        GF.Sfx.beep({ freq: 1200, dur: 0.03, type: 'sine', vol: 0.1 });
                    }
                }
            } else { 
                if (GF.math.dist(p.x, p.y, this.player.x, this.player.y) < p.size + this.player.size) {
                    this.player.takeDamage(p.damage);
                    p.active = false;
                }
            }
        }

        for (const zone of this.damageZones) {
            if (!zone.active) continue;
            if (GF.math.dist(zone.x, zone.y, this.player.x, this.player.y) < zone.radius + this.player.size) {
                if (!zone.hitPlayer) {
                    this.player.takeDamage(zone.damage);
                    zone.hitPlayer = true;
                }
            }
        }
    },

    showComponentDecision() {
        this.gameState = 'decision';
        const preservedSubsystems = this.enemy.subsystems.filter(s => !s.destroyed);
        if (preservedSubsystems.length > 0) {
            this.salvagedComponent = GF.math.pick(preservedSubsystems).type;
        } else {
            this.salvagedComponent = 'scrap';
        }
        game.flash('#ffffff', 0.6);
        GF.Sfx.melody([[800, 0.1], [1000, 0.1], [1200, 0.2]], { type: 'sine' });
    },

    makeDecision(choice) {
        GF.Sfx.beep({ freq: 880, to: 1320, dur: 0.08, type: 'triangle', vol: 0.3 });
        game.flash('#00BFFF', 0.3);

        if (choice === 'install') {
            this.player.installedComponents.push(this.salvagedComponent);
            this.player.repair(20);
            game.addScore(150);
        } else if (choice === 'secure') {
            game.addScore(100);
        } else if (choice === 'dismantle') {
            this.player.repair(30);
        }
        this.gameState = 'extraction';
    },

    draw(ctx) {
        ctx.fillStyle = PALETTE[0];
        ctx.fillRect(0, 0, game.W, game.H);

        ctx.save();
        ctx.translate(Math.sin(game.time * 0.1) * 5, Math.cos(game.time * 0.08) * 5);
        for (let i = 0; i < game.W; i += 50) {
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(i, 0);
            ctx.lineTo(i, game.H);
            ctx.moveTo(0, i);
            ctx.lineTo(game.W, i);
            ctx.stroke();
        }
        ctx.restore();

        this.player.draw(ctx);
        this.enemy.draw(ctx);

        for (const p of this.projectiles) {
            p.draw(ctx);
        }
        for (const zone of this.damageZones) {
            zone.draw(ctx);
        }

        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(20, 20, 150, 15);
        ctx.fillStyle = PALETTE[1];
        ctx.fillRect(20, 20, 150 * (this.player.hp / this.player.maxHp), 15);
        GF.Draw.text(ctx, `HP: ${this.player.hp}`, 95, 27, { size: 12, color: '#fff', align: 'center', baseline: 'middle', weight: 'bold' });

        if (this.gameState === 'decision') {
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0, 0, game.W, game.H);
            GF.Draw.text(ctx, 'COMPONENT SALVAGED!', game.W / 2, game.H / 2 - 80, { size: 30, color: PALETTE[1] });
            GF.Draw.text(ctx, `Type: ${this.salvagedComponent.toUpperCase()}`, game.W / 2, game.H / 2 - 20, { size: 24, color: PALETTE[3] });

            GF.Draw.text(ctx, '[I]NSTALL (Gain buff/HP)', game.W / 2, game.H / 2 + 50, { size: 20, color: PALETTE[1] });
            GF.Draw.text(ctx, '[S]ECURE (Keep for extraction)', game.W / 2, game.H / 2 + 90, { size: 20, color: PALETTE[3] });
            GF.Draw.text(ctx, '[D]ISMANTLE (Repair HP)', game.W / 2, game.H / 2 + 130, { size: 20, color: PALETTE[2] });
        } else if (this.gameState === 'extraction') {
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0, 0, game.W, game.H);
            GF.Draw.text(ctx, 'ENEMY DEFEATED!', game.W / 2, game.H / 2 - 80, { size: 30, color: PALETTE[1] });
            GF.Draw.text(ctx, 'Proceed to extraction?', game.W / 2, game.H / 2 - 20, { size: 24, color: PALETTE[3] });
            GF.Draw.text(ctx, '[E]XTRACT', game.W / 2, game.H / 2 + 50, { size: 20, color: PALETTE[1] });
            GF.Draw.text(ctx, '[R]ESTART (lose progress)', game.W / 2, game.H / 2 + 90, { size: 20, color: PALETTE[2] });
        }

        GF.Draw.vignette(ctx, game.W, game.H, 0.4);
    }
});

game.titleScreen({ subtitle: 'Press any key to start' });
GF.Sfx.melody([[262, 0.2], [330, 0.2], [392, 0.2], [523, 0.3]], { type: 'sine', vol: 0.15 });
</script>
