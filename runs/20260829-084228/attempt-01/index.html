html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071522}body{display:grid;place-items:center}canvas{display:block;image-rendering:auto;box-shadow:0 18px 70px rgba(0,0,0,.55);touch-action:none}

<body>

<script>
(function () {
  'use strict';
  const VERSION = '1.0.0';
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  const pick = (arr) => arr[(Math.random() * arr.length) | 0];
  const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
  const TAU = Math.PI * 2;
  function makeRng(seed) {
    let s = seed >>> 0 || 1;
    return function () {
      s ^= s << 13;
      s ^= s >>> 17;
      s ^= s << 5;
      s >>>= 0;
      return s / 4294967296;
    };
  }
  const Eases = {
    linear: (t) => t,
    outCubic: (t) => 1 - Math.pow(1 - t, 3),
    inCubic: (t) => t * t * t,
    outQuad: (t) => 1 - (1 - t) * (1 - t),
    outBack: (t) => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
    outElastic: (t) =>
      t === 0 || t === 1 ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * ((2 * Math.PI) / 3)) + 1
  };

  const Sfx = {
    ctx: null,
    master: null,
    muted: false,
    ensure() {
      if (this.ctx || this.muted) return;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.5;
        this.master.connect(this.ctx.destination);
      } catch (e) {}
    },
    resume() {
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    beep({ freq = 440, to = null, dur = 0.15, type = 'square', vol = 0.4, delay = 0 } = {}) {
      if (!this.ctx || this.muted) return;
      const t = this.ctx.currentTime + delay;
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(this.master);
      o.start(t);
      o.stop(t + dur + 0.02);
    },
    noise({ dur = 0.2, vol = 0.3, freq = 1200, delay = 0 } = {}) {
      if (!this.ctx || this.muted) return;
      const t = this.ctx.currentTime + delay;
      const len = Math.max(1, (dur * this.ctx.sampleRate) | 0);
      const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = this.ctx.createBufferSource();
      src.buffer = buf;
      const f = this.ctx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = freq;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f).connect(g).connect(this.master);
      src.start(t);
    },
    melody(notes, { type = 'square', vol = 0.35 } = {}) {
      let delay = 0;
      for (const [freq, dur] of notes) {
        this.beep({ freq, dur: dur * 0.95, type, vol, delay });
        delay += dur;
      }
    }
  };

  class Input {
    constructor(canvas) {
      this.keys = Object.create(null);
      this._edge = Object.create(null);
      this.pointer = { x: 0, y: 0, down: false, clicked: false };
      this._anyAction = [];
      const kd = (e) => {
        if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
        if (!this.keys[e.code]) this._edge[e.code] = true;
        this.keys[e.code] = true;
        Sfx.ensure();
        Sfx.resume();
        for (const fn of this._anyAction) fn(e.code);
      };
      const ku = (e) => {
        this.keys[e.code] = false;
      };
      window.addEventListener('keydown', kd);
      window.addEventListener('keyup', ku);
      const toLocal = (e) => {
        const r = canvas.getBoundingClientRect();
        return {
          x: ((e.clientX - r.left) / r.width) * canvas._lw,
          y: ((e.clientY - r.top) / r.height) * canvas._lh
        };
      };
      canvas.addEventListener('pointermove', (e) => {
        Object.assign(this.pointer, toLocal(e));
      });
      canvas.addEventListener('pointerdown', (e) => {
        Sfx.ensure();
        Sfx.resume();
        Object.assign(this.pointer, toLocal(e));
        this.pointer.down = true;
        this.pointer.clicked = true;
        for (const fn of this._anyAction) fn('PointerDown');
      });
      window.addEventListener('pointerup', () => {
        this.pointer.down = false;
      });
    }
    pressed(code) {
      return !!this._edge[code];
    }
    onAnyInput(fn) {
      this._anyAction.push(fn);
    }
    _endFrame() {
      this._edge = Object.create(null);
      this.pointer.clicked = false;
    }
  }

  class Particles {
    constructor(cap = 700) {
      this.pool = Array.from({ length: cap }, () => ({ active: false }));
    }
    emit(x, y, { count = 10, speed = 120, size = 4, life = 0.6, colors = ['#fff'], gravity = 200, spread = TAU, dir = 0 } = {}) {
      let made = 0;
      for (const p of this.pool) {
        if (p.active) continue;
        const a = dir + (spread === TAU ? rand(TAU) : rand(-spread / 2, spread / 2));
        const v = speed * rand(0.4, 1);
        p.active = true;
        p.x = x;
        p.y = y;
        p.vx = Math.cos(a) * v;
        p.vy = Math.sin(a) * v;
        p.life = p.maxLife = life * rand(0.6, 1.2);
        p.size = size * rand(0.6, 1.4);
        p.color = pick(colors);
        p.gravity = gravity;
        if (++made >= count) break;
      }
    }
    update(dt) {
      for (const p of this.pool) {
        if (!p.active) continue;
        p.life -= dt;
        if (p.life <= 0) {
          p.active = false;
          continue;
        }
        p.vy += p.gravity * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
      }
    }
    draw(ctx) {
      for (const p of this.pool) {
        if (!p.active) continue;
        ctx.globalAlpha = clamp(p.life / p.maxLife, 0, 1);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, TAU);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }

  class Tweens {
    constructor() {
      this.list = [];
    }
    add(obj, props, dur, ease = 'outCubic', onDone = null) {
      const from = {};
      for (const k of Object.keys(props)) from[k] = obj[k];
      this.list.push({ obj, props, from, t: 0, dur, ease: Eases[ease] || Eases.outCubic, onDone });
    }
    update(dt) {
      for (let i = this.list.length - 1; i >= 0; i--) {
        const tw = this.list[i];
        tw.t += dt;
        const k = clamp(tw.t / tw.dur, 0, 1);
        const e = tw.ease(k);
        for (const key of Object.keys(tw.props)) {
          tw.obj[key] = lerp(tw.from[key], tw.props[key], e);
        }
        if (k >= 1) {
          this.list.splice(i, 1);
          if (tw.onDone) tw.onDone();
        }
      }
    }
  };

  const Draw = {
    text(ctx, str, x, y, { size = 24, color = '#fff', align = 'center', baseline = 'middle', weight = '800', font = 'system-ui, sans-serif' } = {}) {
      ctx.fillStyle = color;
      ctx.textAlign = align;
      ctx.textBaseline = baseline;
      ctx.font = `${weight} ${size}px ${font}`;
      ctx.fillText(str, x, y);
    },
    roundRect(ctx, x, y, w, h, r, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h);
      ctx.fill();
    },
    vignette(ctx, w, h, strength = 0.35) {
      const g = ctx.createRadialGradient(w / 2, h / 2, h * 0.4, w / 2, h / 2, h * 0.85);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, `rgba(0,0,0,${strength})`);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
    }
  };

  class Game {
    constructor({ id = 'gf-game', title = 'Untitled', width = 960, height = 540, palette = ['#7c5cff', '#00e0ff', '#ff5c8a', '#ffd166'], background = '#0b0e1a', seed = (Number.isInteger(window.__GF_VERIFIER_SEED__) ? window.__GF_VERIFIER_SEED__ : Date.now() % 100000) } = {}) {
      this.id = id;
      this.title = title;
      this.W = width;
      this.H = height;
      this.palette = palette;
      this.background = background;
      this.seed = seed >>> 0;
      this.rng = makeRng(this.seed);
      this.scenes = {};
      this.sceneName = null;
      this.state = 'boot';
      this.score = 0;
      this.best = Number(localStorage.getItem('gf-best-' + id) || 0);
      this.time = 0;
      this.shakeMag = 0;
      this.shakeDur = 0;
      this.flashAlpha = 0;
      this.flashColor = '#ffffff';
      this._hitStopRemaining = 0;
      this._fpsFrames = 0;
      this._fpsTime = 0;
      this.fps = 60;
      this.particles = new Particles();
      this.tweens = new Tweens();
      this.probeErrors = [];

      const canvas = document.createElement('canvas');
      canvas.id = 'game';
      document.body.appendChild(canvas);
      this.canvas = canvas;
      canvas._lw = this.W;
      canvas._lh = this.H;
      const fit = () => {
        const s = Math.min(window.innerWidth / this.W, window.innerHeight / this.H);
        canvas.style.width = Math.floor(this.W * s) + 'px';
        canvas.style.height = Math.floor(this.H * s) + 'px';
      };
      window.addEventListener('resize', fit);
      fit();

      const ctx = canvas.getContext('2d');
      this.ctx = ctx;

      this.input = new Input(canvas);
      this.input.onAnyInput(() => {
        if (this.state === 'title' && this._titleStart) this._startFromTitle();
        else if ((this.state === 'gameover' || this.state === 'won') && this.time > 0.8) this.restart();
      });

      window.addEventListener('error', (e) => this._err(e.message));
      window.addEventListener('unhandledrejection', (e) => this._err(String(e.reason)));

      window.__GF__ = {
        version: VERSION,
        info: { title, id, engine: VERSION, seed: this.seed },
        errors: this.probeErrors,
        getState: () => this.state,
        getScore: () => this.score,
        getBest: () => this.best,
        getFps: () => this.fps,
        getTime: () => this.time,
        getSeed: () => this.seed,
        flags: {},
        restart: () => this.restart()
      };

      let last = performance.now();
      const frame = (now) => {
        requestAnimationFrame(frame);
        let dt = (now - last) / 1000;
        last = now;
        dt = Math.min(dt, 0.1);
        this._fpsFrames++;
        this._fpsTime += dt;
        if (this._fpsTime >= 0.5) {
          this.fps = Math.round(this._fpsFrames / this._fpsTime);
          this._fpsFrames = 0;
          this._fpsTime = 0;
        }
        this._update(dt);
        this._draw(ctx);
        this.input._endFrame();
      };
      requestAnimationFrame(frame);
    }

    get currentScene() {
      return this.sceneName ? this.scenes[this.sceneName] || null : null;
    }

    _err(msg) {
      if (this.probeErrors.length < 25 && !this.probeErrors.includes(msg)) this.probeErrors.push(String(msg));
    }

    add(name, scene) {
      scene.name = name;
      scene.game = this;
      this.scenes[name] = scene;
      return scene;
    }
    go(name) {
      const next = this.scenes[name];
      if (!next) return this._err('unknown scene: ' + name);
      this.sceneName = name;
      this.state = name === 'title' ? 'title' : 'playing';
      if (next.init) next.init();
      if (next.reset) next.reset();
      this.time = 0;
    }
    titleScreen({ subtitle = 'Press any key', onStart = null } = {}) {
      this._titleStart = onStart || (() => this.go(this._firstPlayScene()));
      this.state = 'title';
      this._subtitle = subtitle;
    }
    _firstPlayScene() {
      const names = Object.keys(this.scenes);
      return names.find((n) => n !== 'title') || names[0];
    }
    _startFromTitle() {
      Sfx.ensure();
      Sfx.resume();
      Sfx.beep({ freq: 520, to: 780, dur: 0.12, type: 'triangle', vol: 0.35 });
      this._titleStart();
    }
    addScore(n = 1) {
      if (this.state !== 'playing') return;
      this.score += n;
      if (this.score > this.best) {
        this.best = this.score;
        localStorage.setItem('gf-best-' + this.id, String(this.best));
      }
    }
    shake(mag = 6, dur = 0.3) {
      this.shakeMag = mag;
      this.shakeDur = dur;
    }
    flash(color = '#ffffff', alpha = 0.5) {
      this.flashColor = color;
      this.flashAlpha = alpha;
    }
    burst(x, y, opts) {
      this.particles.emit(x, y, opts);
    }
    hitStop(dur = 0.06) {
      this._hitStopRemaining = Math.max(this._hitStopRemaining, dur);
    }
    gameOver({ message = 'GAME OVER' } = {}) {
      if (this.state !== 'playing') return;
      this.state = 'gameover';
      this._endMessage = message;
      this.shake(9, 0.45);
      Sfx.melody([[392, 0.12], [330, 0.12], [262, 0.2]]);
    }
    win({ message = 'YOU WIN!' } = {}) {
      if (this.state !== 'playing') return;
      this.state = 'won';
      this._endMessage = message;
      Sfx.melody([[523, 0.1], [659, 0.1], [784, 0.18]], { type: 'triangle' });
    }
    restart() {
      this.score = 0;
      this.time = 0;
      this.particles = new Particles();
      this.tweens = new Tweens();
      const sc = this.scenes[this.sceneName];
      this.state = 'playing';
      if (sc && sc.reset) sc.reset();
      else if (sc && sc.init) sc.init();
      Sfx.beep({ freq: 660, dur: 0.08, vol: 0.3 });
    }

    _update(dtRaw) {
      this.tweens.update(dtRaw);
      if (this.shakeDur > 0) this.shakeDur -= dtRaw;
      if (this.flashAlpha > 0) this.flashAlpha = Math.max(0, this.flashAlpha - dtRaw * 2.5);
      if (this.state !== 'playing') return;
      if (this._hitStopRemaining > 0) {
        this._hitStopRemaining -= dtRaw;
        return;
      }
      const dt = Math.min(dtRaw, 1 / 20);
      this.time += dt;
      const sc = this.scenes[this.sceneName];
      if (sc && sc.update) sc.update(dt);
      this.particles.update(dt);
    }

    _draw(ctx) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = this.background;
      ctx.fillRect(0, 0, this.W, this.H);
      let sx = 0;
      let sy = 0;
      if (this.shakeDur > 0) {
        sx = rand(-this.shakeMag, this.shakeMag);
        sy = rand(-this.shakeMag, this.shakeMag);
      }
      ctx.translate(sx, sy);
      const sc = this.scenes[this.sceneName];
      if (sc && sc.draw) sc.draw(ctx);
      this.particles.draw(ctx);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      if (this.state === 'title') {
        ctx.fillStyle = 'rgba(5,8,16,0.55)';
        ctx.fillRect(0, 0, this.W, this.H);
        Draw.text(ctx, this.title, this.W / 2, this.H / 2 - 40, { size: 56, color: this.palette[0] });
        Draw.text(ctx, this._subtitle || '', this.W / 2, this.H / 2 + 24, { size: 22, color: '#dfe6ff', weight: '600' });
        Draw.text(ctx, 'BEST ' + this.best, this.W / 2, this.H - 40, { size: 18, color: '#8fa3d9', weight: '600' });
      } else if (this.state === 'gameover' || this.state === 'won') {
        ctx.fillStyle = this.state === 'won' ? 'rgba(10,30,20,0.55)' : 'rgba(30,5,15,0.55)';
        ctx.fillRect(0, 0, this.W, this.H);
        Draw.text(ctx, this._endMessage || (this.state === 'won' ? 'YOU WIN!' : 'GAME OVER'), this.W / 2, this.H / 2 - 50, { size: 52, color: this.state === 'won' ? '#7dffb2' : '#ff7d9c' });
        Draw.text(ctx, 'SCORE ' + this.score, this.W / 2, this.H / 2 + 12, { size: 30, color: '#fff' });
        Draw.text(ctx, 'BEST ' + this.best, this.W / 2, this.H / 2 + 52, { size: 20, color: '#cdd6f4' });
        Draw.text(ctx, 'Click / press R to retry', this.W / 2, this.H / 2 + 96, { size: 17, color: '#9fb0d8', weight: '600' });
      } else {
        Draw.text(ctx, String(this.score), this.W / 2, 44, { size: 34, color: 'rgba(255,255,255,0.92)' });
        Draw.text(ctx, 'BEST ' + this.best, this.W - 20, 30, { size: 15, color: 'rgba(255,255,255,0.55)', align: 'right', weight: '700' });
      }
      if (this.flashAlpha > 0) {
        ctx.globalAlpha = this.flashAlpha;
        ctx.fillStyle = this.flashColor;
        ctx.fillRect(0, 0, this.W, this.H);
        ctx.globalAlpha = 1;
      }
    }
  }

  window.GF = { VERSION, Game, Input, Particles, Tweens, Draw, Sfx, math: { clamp, lerp, rand, randInt, pick, dist, TAU, makeRng }, Eases };
})();


(function () {
  if (!window.GF || !window.GF.Game || window.GF.__probeExtended) return;
  const BaseGame = window.GF.Game;
  class EvidencedGame extends BaseGame {
    constructor(options) {
      super(options);
      if (this.canvas) {
        this.canvas.width = this.W;
        this.canvas.height = this.H;
      }
      this._probeEvents = [];
      this._probeSeq = 0;
      window.__GF__.events = this._probeEvents;
      window.__GF__.getEvents = () => this._probeEvents.map((event) => ({ ...event, data: { ...(event.data || {}) } }));
      window.__GF__.emit = (type, data) => this.event(type, data);
    }
    event(type, data = {}) {
      let safeData = {};
      try {
        const serialized = JSON.stringify(data ?? {});
        safeData = serialized.length <= 2048
          ? JSON.parse(serialized)
          : { truncated: true, preview: serialized.slice(0, 1900) };
      } catch (_) {
        safeData = { value: String(data).slice(0, 1900) };
      }
      const event = {
        seq: ++this._probeSeq,
        type: String(type || 'event').slice(0, 80),
        time: Math.round((this.time || 0) * 1000) / 1000,
        state: this.state,
        score: this.score,
        data: safeData
      };
      if (this._probeEvents.length >= 128) this._probeEvents.shift();
      this._probeEvents.push(event);
      return event;
    }
    addScore(n = 1) {
      const before = this.score;
      super.addScore(n);
      if (this.score !== before) this.event('score_changed', { before, after: this.score, delta: this.score - before });
    }
    go(name) {
      const before = this.state;
      super.go(name);
      this.event('state_changed', { from: before, to: this.state, scene: name });
    }
    gameOver(options) {
      const before = this.state;
      super.gameOver(options);
      if (this.state !== before) this.event('game_over', { from: before, to: this.state });
    }
    win(options) {
      const before = this.state;
      super.win(options);
      if (this.state !== before) this.event('game_won', { from: before, to: this.state });
    }
  }
  window.GF.Game = EvidencedGame;
  window.GF.__probeExtended = true;
})();

</script>
<script>
const game = new GF.Game({
  id: 'lumen-current',
  title: 'Lumen Current',
  width: 960,
  height: 540,
  palette: ['#54F5D2', '#B9FF82', '#103447', '#071522'],
  background: '#071522',
  seed: 41291
});

/* Provide bounded evidence storage when the host does not expose its telemetry hook. */
if (typeof game.event !== 'function') {
  game._events = [];
  game.event = function(type, data) {
    if (this._events.length < 80) this._events.push({ type: String(type), data: data || {}, time: this.time });
    if (window.__GF__) window.__GF__.events = this._events;
  };
}

const C = {
  ink: '#071522', deep: '#103447', cyan: '#54F5D2', mint: '#B9FF82',
  violet: '#a982ff', glass: '#79cfe6', white: '#eafff8', storm: '#b878e8'
};

const play = {
  init() {
    this.motes = [];
    for (let i = 0; i < 52; i++) {
      this.motes.push({ x: game.rng() * 960, y: game.rng() * 540, r: 1 + game.rng() * 2, s: 8 + game.rng() * 22, p: game.rng() * 6.28 });
    }
    this.trail = Array.from({ length: 18 }, () => ({ x: 480, y: 270 }));
    this.didRun = false;
    this.terminalRun = false;
  },

  reset() {
    const freshAfterTerminal = this.terminalRun === true;
    this.player = { x: 480, y: 270, slow: 0, pulse: 0, px: 480, py: 270 };
    this.nodes = [
      { x: 780, y: 270, name: 'EAST GLASS', active: false, glow: 0 },
      { x: 850, y: 430, name: 'SOUTH REED', active: false, glow: 0 },
      { x: 395, y: 480, name: 'WEST VINE', active: false, glow: 0 }
    ];
    this.ribbons = [
      { x: 160, y: 120, vx: 1, phase: 0.4, hit: 0 },
      { x: 640, y: 175, vx: -1, phase: 2.1, hit: 0 },
      { x: 340, y: 375, vx: 1, phase: 4.3, hit: 0 }
    ];
    this.progress = 0;
    this.pressure = 0;
    this.hazardSpeed = 35;
    this.contactCd = 0;
    this.musicClock = 0;
    this.inputRecorded = false;
    this.guidance = 0;
    this.terminalRun = false;
    for (let i = 0; i < this.trail.length; i++) { this.trail[i].x = 480; this.trail[i].y = 270; }
    if (freshAfterTerminal) game.event('fresh_run_started', { nodeProgress: 0 });
    this.didRun = true;
  },

  resonate() {
    const p = this.player;
    p.pulse = 0.48;
    game.flash('#54F5D2', 0.11);
    game.burst(p.x, p.y, { count: 16, speed: 105, size: 3, life: 0.48, colors: [C.cyan, C.mint, C.white], gravity: 0 });
    GF.Sfx.beep({ freq: 430, to: 700, dur: 0.18, type: 'sine', vol: 0.16 });
    if (this.progress > 0 && this.inputRecorded) {
      game.event('movement_and_resonance_input', { x: Math.round(p.x), y: Math.round(p.y), resonance: 1 });
      this.inputRecorded = false;
    }
    for (let i = 0; i < this.nodes.length; i++) {
      const n = this.nodes[i];
      if (!n.active && Math.hypot(p.x - n.x, p.y - n.y) < 112) {
        this.activateNode(i);
        break;
      }
    }
  },

  activateNode(index) {
    const n = this.nodes[index];
    if (!n || n.active) return;
    const before = this.progress;
    n.active = true;
    n.glow = 1;
    this.progress++;
    const award = 100 * this.progress;
    game.addScore(award);
    game.event('signal_node_activated', {
      nodeProgressBefore: before,
      nodeProgressAfter: this.progress,
      scoreAward: award
    });
    const speedBefore = this.hazardSpeed;
    this.hazardSpeed += 18;
    game.event('pressure_escalated', { hazardSpeedBefore: speedBefore, hazardSpeedAfter: this.hazardSpeed });
    this.pressure = Math.max(0, this.pressure - 5);
    game.burst(n.x, n.y, { count: 38, speed: 180, size: 4, life: 0.9, colors: [C.cyan, C.mint, C.white], gravity: 26 });
    game.flash('#B9FF82', 0.20);
    game.hitStop(this.progress === 3 ? 0.13 : 0.09);
    game.shake(this.progress === 3 ? 6 : 3, 0.22);
    GF.Sfx.melody([[523, 0.09], [659, 0.11], [784, 0.18]], { type: 'triangle', vol: 0.2 });
    if (this.progress === 3) {
      this.terminalRun = true;
      game.burst(480, 270, { count: 70, speed: 260, size: 5, life: 1.2, colors: [C.cyan, C.mint, C.white], gravity: 12 });
      game.win({ message: 'GARDEN RESTORED' });
    }
  },

  update(dt) {
    const p = this.player;
    const k = game.input.keys;
    let dx = (k.ArrowRight || k.KeyD ? 1 : 0) - (k.ArrowLeft || k.KeyA ? 1 : 0);
    let dy = (k.ArrowDown || k.KeyS ? 1 : 0) - (k.ArrowUp || k.KeyW ? 1 : 0);
    if (dx || dy) {
      const l = Math.hypot(dx, dy) || 1;
      dx /= l; dy /= l;
      this.inputRecorded = true;
      const speed = p.slow > 0 ? 125 : 220;
      p.px = p.x; p.py = p.y;
      p.x = GF.math.clamp(p.x + dx * speed * dt, 42, 918);
      p.y = GF.math.clamp(p.y + dy * speed * dt, 78, 498);
    }
    if (game.input.pressed('Space') || game.input.pressed('Enter') || game.input.pointer.clicked) this.resonate();
    p.slow = Math.max(0, p.slow - dt);
    p.pulse = Math.max(0, p.pulse - dt);
    this.contactCd = Math.max(0, this.contactCd - dt);
    this.guidance += dt;

    for (let i = this.trail.length - 1; i > 0; i--) {
      this.trail[i].x += (this.trail[i - 1].x - this.trail[i].x) * Math.min(1, dt * 14);
      this.trail[i].y += (this.trail[i - 1].y - this.trail[i].y) * Math.min(1, dt * 14);
    }
    this.trail[0].x = p.x; this.trail[0].y = p.y;

    this.pressure = GF.math.clamp(this.pressure + dt * (1.12 + this.progress * 0.48), 0, 100);
    for (const r of this.ribbons) {
      r.x += r.vx * this.hazardSpeed * dt;
      if (r.x < -100) { r.x = 1060; r.vx = -1; }
      if (r.x > 1060) { r.x = -100; r.vx = 1; }
      r.hit = Math.max(0, r.hit - dt);
      const ry = r.y + Math.sin(game.time * (0.8 + this.progress * 0.12) + r.phase) * 42;
      if (this.contactCd <= 0 && Math.abs(p.x - r.x) < 32 && Math.abs(p.y - ry) < 58) {
        this.contactCd = 0.7; p.slow = 0.5; r.hit = 0.35;
        this.pressure = GF.math.clamp(this.pressure + 8, 0, 100);
        game.shake(4, 0.18);
        game.burst(p.x, p.y, { count: 12, speed: 95, size: 3, life: 0.36, colors: [C.violet, '#dfb8ff'], gravity: 0 });
        GF.Sfx.noise({ dur: 0.12, vol: 0.11, freq: 900 });
      }
    }
    for (const n of this.nodes) n.glow = Math.max(0, n.glow - dt * 0.65);
    this.musicClock += dt;
    if (this.musicClock > 3.6 - this.progress * 0.38) {
      this.musicClock = 0;
      GF.Sfx.beep({ freq: 180 + this.pressure * 1.2, to: 250 + this.progress * 70, dur: 0.16, type: 'sine', vol: 0.035 });
    }
    if (this.pressure >= 100) {
      this.terminalRun = true;
      game.flash('#a982ff', 0.28);
      game.gameOver({ message: 'STORM PRESSURE OVERLOAD' });
    }
  },

  draw(ctx) {
    const W = 960, H = 540, t = game.time;
    const bg = ctx.createLinearGradient(0, 0, W, H);
    bg.addColorStop(0, '#071522'); bg.addColorStop(0.55, '#0b2937'); bg.addColorStop(1, '#071522');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    ctx.globalAlpha = 0.13;
    for (let i = 0; i < 5; i++) {
      const x = ((i * 227 + t * (8 + i * 2)) % 1100) - 70;
      ctx.fillStyle = i % 2 ? C.glass : C.cyan;
      ctx.beginPath(); ctx.moveTo(x, 70); ctx.lineTo(x + 160, 70); ctx.lineTo(x + 90, 510); ctx.lineTo(x - 70, 510); ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.strokeStyle = 'rgba(84,245,210,0.13)'; ctx.lineWidth = 1;
    for (let x = 60; x < 960; x += 90) { ctx.beginPath(); ctx.moveTo(x, 65); ctx.lineTo(x - 90, 510); ctx.stroke(); }
    for (const m of this.motes) {
      const y = (m.y + Math.sin(t * 0.7 + m.p) * 12 + t * m.s) % 520;
      ctx.globalAlpha = 0.22 + 0.18 * Math.sin(t + m.p);
      ctx.fillStyle = C.mint; ctx.beginPath(); ctx.arc(m.x, y, m.r, 0, GF.math.TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (let i = 0; i < this.nodes.length; i++) {
      const n = this.nodes[i];
      const next = i === this.progress;
      ctx.strokeStyle = n.active ? 'rgba(185,255,130,.62)' : next ? 'rgba(84,245,210,.62)' : 'rgba(84,245,210,.18)';
      ctx.lineWidth = n.active ? 4 : 2;
      ctx.beginPath(); ctx.moveTo(480, 270); ctx.quadraticCurveTo((480 + n.x) / 2, 270 + Math.sin(t + i) * 24, n.x, n.y); ctx.stroke();
      if (n.active) {
        ctx.fillStyle = 'rgba(84,245,210,.10)'; ctx.beginPath(); ctx.arc(n.x, n.y, 108, 0, GF.math.TAU); ctx.fill();
      }
    }

    for (const r of this.ribbons) {
      const y = r.y + Math.sin(t * (0.8 + this.progress * 0.12) + r.phase) * 42;
      const g = ctx.createLinearGradient(r.x - 52, y, r.x + 52, y);
      g.addColorStop(0, 'rgba(169,130,255,0)'); g.addColorStop(.5, 'rgba(184,120,232,.35)'); g.addColorStop(1, 'rgba(169,130,255,0)');
      ctx.fillStyle = g; ctx.fillRect(r.x - 65, y - 55, 130, 110);
      ctx.strokeStyle = 'rgba(218,174,255,.48)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(r.x - 46, y - 48); ctx.bezierCurveTo(r.x + 12, y - 22, r.x - 15, y + 19, r.x + 48, y + 48); ctx.stroke();
    }

    for (let i = 0; i < this.nodes.length; i++) {
      const n = this.nodes[i], next = i === this.progress;
      const pulse = next ? 1 + Math.sin(t * 4) * 0.08 : 1;
      ctx.globalAlpha = next || n.active ? 1 : 0.45;
      ctx.strokeStyle = n.active ? C.mint : C.cyan; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(n.x, n.y, (n.active ? 34 : 52) * pulse, 0, GF.math.TAU); ctx.stroke();
      ctx.fillStyle = n.active ? C.mint : C.cyan;
      ctx.beginPath(); ctx.arc(n.x, n.y, n.active ? 12 : 15, 0, GF.math.TAU); ctx.fill();
      ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(n.x, n.y, 5, 0, GF.math.TAU); ctx.fill();
      if (next) GF.Draw.text(ctx, 'NEXT SIGNAL', n.x, n.y - 72, { size: 13, color: C.mint, weight: '800' });
      ctx.globalAlpha = 1;
    }

    for (let i = this.trail.length - 1; i >= 0; i--) {
      const q = this.trail[i], a = (this.trail.length - i) / this.trail.length;
      ctx.globalAlpha = a * 0.42; ctx.fillStyle = C.cyan;
      ctx.beginPath(); ctx.arc(q.x, q.y, 3 + a * 7, 0, GF.math.TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    const p = this.player;
    if (p.pulse > 0) {
      ctx.globalAlpha = p.pulse / .48; ctx.strokeStyle = C.cyan; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(p.x, p.y, 28 + (1 - p.pulse / .48) * 86, 0, GF.math.TAU); ctx.stroke(); ctx.globalAlpha = 1;
    }
    const pg = ctx.createRadialGradient(p.x - 4, p.y - 5, 2, p.x, p.y, 27);
    pg.addColorStop(0, C.white); pg.addColorStop(.35, C.cyan); pg.addColorStop(1, 'rgba(84,245,210,0)');
    ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(p.x, p.y, 28, 0, GF.math.TAU); ctx.fill();
    ctx.fillStyle = C.white; ctx.beginPath(); ctx.arc(p.x, p.y, 9, 0, GF.math.TAU); ctx.fill();

    this.drawHud(ctx);
    GF.Draw.vignette(ctx, W, H, 0.42);
  },

  drawHud(ctx) {
    GF.Draw.roundRect(ctx, 18, 15, 210, 47, 10, 'rgba(4,18,28,.80)');
    GF.Draw.text(ctx, 'SIGNALS', 31, 31, { size: 13, color: C.cyan, align: 'left', weight: '800' });
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = i < this.progress ? C.mint : '#245263'; ctx.beginPath(); ctx.arc(145 + i * 23, 31, 7, 0, GF.math.TAU); ctx.fill();
    }
    GF.Draw.text(ctx, this.progress + ' / 3', 31, 49, { size: 17, color: C.white, align: 'left' });

    GF.Draw.roundRect(ctx, 748, 15, 194, 47, 10, 'rgba(4,18,28,.80)');
    GF.Draw.text(ctx, 'SCORE', 764, 31, { size: 13, color: C.mint, align: 'left', weight: '800' });
    GF.Draw.text(ctx, String(game.score).padStart(3, '0'), 927, 43, { size: 25, color: C.white, align: 'right' });

    GF.Draw.roundRect(ctx, 286, 490, 388, 36, 10, 'rgba(4,18,28,.84)');
    GF.Draw.text(ctx, 'STORM PRESSURE', 300, 502, { size: 12, color: '#d9baff', align: 'left', weight: '800' });
    ctx.fillStyle = '#173744'; ctx.fillRect(300, 510, 350, 8);
    const col = this.pressure > 70 ? '#df85ef' : C.cyan;
    ctx.fillStyle = col; ctx.fillRect(300, 510, 350 * this.pressure / 100, 8);
    GF.Draw.text(ctx, Math.ceil(this.pressure) + '%', 659, 504, { size: 13, color: C.white, align: 'right', weight: '800' });
    GF.Draw.text(ctx, 'MOVE  •  RESONATE [SPACE / ENTER]', 480, 82, { size: 13, color: 'rgba(234,255,248,.72)', weight: '700' });
  }
};

game.add('play', play);
game.titleScreen({
  subtitle: 'Arrow keys / WASD to flow  •  SPACE / ENTER to resonate',
  onStart: () => game.go('play')
});
</script>
