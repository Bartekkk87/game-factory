<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Color Cascade</title>
<style>
html,body{margin:0;height:100%;background:#000;display:grid;place-items:center;overflow:hidden}
canvas{image-rendering:auto}
body { margin: 0; overflow: hidden; background: #0b0e1a; } canvas { display: block; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
</style>
</head>
<body>

<script>
(function () {
  'use strict';
  const VERSION = '1.0.0';
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  const pick = (arr) => arr[(Math.random() * arr.length) | 0];
  const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
  const TAU = Math.PI * 2;
  function makeRng(seed) {
    let s = seed >>> 0 || 1;
    return function () {
      s ^= s << 13;
      s ^= s >>> 17;
      s ^= s << 5;
      s >>>= 0;
      return s / 4294967296;
    };
  }
  const Eases = {
    linear: (t) => t,
    outCubic: (t) => 1 - Math.pow(1 - t, 3),
    inCubic: (t) => t * t * t,
    outQuad: (t) => 1 - (1 - t) * (1 - t),
    outBack: (t) => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
    outElastic: (t) =>
      t === 0 || t === 1 ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * ((2 * Math.PI) / 3)) + 1
  };

  const Sfx = {
    ctx: null,
    master: null,
    muted: false,
    ensure() {
      if (this.ctx || this.muted) return;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.5;
        this.master.connect(this.ctx.destination);
      } catch (e) {}
    },
    resume() {
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    beep({ freq = 440, to = null, dur = 0.15, type = 'square', vol = 0.4, delay = 0 } = {}) {
      if (!this.ctx || this.muted) return;
      const t = this.ctx.currentTime + delay;
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(this.master);
      o.start(t);
      o.stop(t + dur + 0.02);
    },
    noise({ dur = 0.2, vol = 0.3, freq = 1200, delay = 0 } = {}) {
      if (!this.ctx || this.muted) return;
      const t = this.ctx.currentTime + delay;
      const len = Math.max(1, (dur * this.ctx.sampleRate) | 0);
      const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = this.ctx.createBufferSource();
      src.buffer = buf;
      const f = this.ctx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = freq;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f).connect(g).connect(this.master);
      src.start(t);
    },
    melody(notes, { type = 'square', vol = 0.35 } = {}) {
      let delay = 0;
      for (const [freq, dur] of notes) {
        this.beep({ freq, dur: dur * 0.95, type, vol, delay });
        delay += dur;
      }
    }
  };

  class Input {
    constructor(canvas) {
      this.keys = Object.create(null);
      this._edge = Object.create(null);
      this.pointer = { x: 0, y: 0, down: false, clicked: false };
      this._anyAction = [];
      const kd = (e) => {
        if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
        if (!this.keys[e.code]) this._edge[e.code] = true;
        this.keys[e.code] = true;
        Sfx.ensure();
        Sfx.resume();
        for (const fn of this._anyAction) fn(e.code);
      };
      const ku = (e) => {
        this.keys[e.code] = false;
      };
      window.addEventListener('keydown', kd);
      window.addEventListener('keyup', ku);
      const toLocal = (e) => {
        const r = canvas.getBoundingClientRect();
        return {
          x: ((e.clientX - r.left) / r.width) * canvas._lw,
          y: ((e.clientY - r.top) / r.height) * canvas._lh
        };
      };
      canvas.addEventListener('pointermove', (e) => {
        Object.assign(this.pointer, toLocal(e));
      });
      canvas.addEventListener('pointerdown', (e) => {
        Sfx.ensure();
        Sfx.resume();
        Object.assign(this.pointer, toLocal(e));
        this.pointer.down = true;
        this.pointer.clicked = true;
        for (const fn of this._anyAction) fn('PointerDown');
      });
      window.addEventListener('pointerup', () => {
        this.pointer.down = false;
      });
    }
    pressed(code) {
      return !!this._edge[code];
    }
    onAnyInput(fn) {
      this._anyAction.push(fn);
    }
    _endFrame() {
      this._edge = Object.create(null);
      this.pointer.clicked = false;
    }
  }

  class Particles {
    constructor(cap = 700) {
      this.pool = Array.from({ length: cap }, () => ({ active: false }));
    }
    emit(x, y, { count = 10, speed = 120, size = 4, life = 0.6, colors = ['#fff'], gravity = 200, spread = TAU, dir = 0 } = {}) {
      let made = 0;
      for (const p of this.pool) {
        if (p.active) continue;
        const a = dir + (spread === TAU ? rand(TAU) : rand(-spread / 2, spread / 2));
        const v = speed * rand(0.4, 1);
        p.active = true;
        p.x = x;
        p.y = y;
        p.vx = Math.cos(a) * v;
        p.vy = Math.sin(a) * v;
        p.life = p.maxLife = life * rand(0.6, 1.2);
        p.size = size * rand(0.6, 1.4);
        p.color = pick(colors);
        p.gravity = gravity;
        if (++made >= count) break;
      }
    }
    update(dt) {
      for (const p of this.pool) {
        if (!p.active) continue;
        p.life -= dt;
        if (p.life <= 0) {
          p.active = false;
          continue;
        }
        p.vy += p.gravity * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
      }
    }
    draw(ctx) {
      for (const p of this.pool) {
        if (!p.active) continue;
        ctx.globalAlpha = clamp(p.life / p.maxLife, 0, 1);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, TAU);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }

  class Tweens {
    constructor() {
      this.list = [];
    }
    add(obj, props, dur, ease = 'outCubic', onDone = null) {
      const from = {};
      for (const k of Object.keys(props)) from[k] = obj[k];
      this.list.push({ obj, props, from, t: 0, dur, ease: Eases[ease] || Eases.outCubic, onDone });
    }
    update(dt) {
      for (let i = this.list.length - 1; i >= 0; i--) {
        const tw = this.list[i];
        tw.t += dt;
        const k = clamp(tw.t / tw.dur, 0, 1);
        const e = tw.ease(k);
        for (const key of Object.keys(tw.props)) {
          tw.obj[key] = lerp(tw.from[key], tw.props[key], e);
        }
        if (k >= 1) {
          this.list.splice(i, 1);
          if (tw.onDone) tw.onDone();
        }
      }
    }
  }

  const Draw = {
    text(ctx, str, x, y, { size = 24, color = '#fff', align = 'center', baseline = 'middle', weight = '800', font = 'system-ui, sans-serif' } = {}) {
      ctx.fillStyle = color;
      ctx.textAlign = align;
      ctx.textBaseline = baseline;
      ctx.font = `${weight} ${size}px ${font}`;
      ctx.fillText(str, x, y);
    },
    roundRect(ctx, x, y, w, h, r, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h);
      ctx.fill();
    },
    vignette(ctx, w, h, strength = 0.35) {
      const g = ctx.createRadialGradient(w / 2, h / 2, h * 0.4, w / 2, h / 2, h * 0.85);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, `rgba(0,0,0,${strength})`);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
    }
  };

  class Game {
    constructor({ id = 'gf-game', title = 'Untitled', width = 960, height = 540, palette = ['#7c5cff', '#00e0ff', '#ff5c8a', '#ffd166'], background = '#0b0e1a', seed = Date.now() % 100000 } = {}) {
      this.id = id;
      this.title = title;
      this.W = width;
      this.H = height;
      this.palette = palette;
      this.background = background;
      this.rng = makeRng(seed);
      this.scenes = {};
      this.sceneName = null;
      this.state = 'boot';
      this.score = 0;
      this.best = Number(localStorage.getItem('gf-best-' + id) || 0);
      this.time = 0;
      this.shakeMag = 0;
      this.shakeDur = 0;
      this.flashAlpha = 0;
      this.flashColor = '#ffffff';
      this.hitStop = 0;
      this._fpsFrames = 0;
      this._fpsTime = 0;
      this.fps = 60;
      this.particles = new Particles();
      this.tweens = new Tweens();
      this.probeErrors = [];

      const canvas = document.createElement('canvas');
      canvas.id = 'game';
      document.body.appendChild(canvas);
      this.canvas = canvas;
      canvas._lw = this.W;
      canvas._lh = this.H;
      const fit = () => {
        const s = Math.min(window.innerWidth / this.W, window.innerHeight / this.H);
        canvas.style.width = Math.floor(this.W * s) + 'px';
        canvas.style.height = Math.floor(this.H * s) + 'px';
      };
      window.addEventListener('resize', fit);
      fit();

      const ctx = canvas.getContext('2d');
      this.ctx = ctx;

      this.input = new Input(canvas);
      this.input.onAnyInput(() => {
        if (this.state === 'title' && this._titleStart) this._startFromTitle();
        else if ((this.state === 'gameover' || this.state === 'won') && this.time > 0.8) this.restart();
      });

      window.addEventListener('error', (e) => this._err(e.message));
      window.addEventListener('unhandledrejection', (e) => this._err(String(e.reason)));

      window.__GF__ = {
        version: VERSION,
        info: { title, id, engine: VERSION },
        errors: this.probeErrors,
        getState: () => this.state,
        getScore: () => this.score,
        getBest: () => this.best,
        getFps: () => this.fps,
        getTime: () => this.time,
        flags: {},
        restart: () => this.restart()
      };

      let last = performance.now();
      const frame = (now) => {
        requestAnimationFrame(frame);
        let dt = (now - last) / 1000;
        last = now;
        dt = Math.min(dt, 0.1);
        this._fpsFrames++;
        this._fpsTime += dt;
        if (this._fpsTime >= 0.5) {
          this.fps = Math.round(this._fpsFrames / this._fpsTime);
          this._fpsFrames = 0;
          this._fpsTime = 0;
        }
        this._update(dt);
        this._draw(ctx);
        this.input._endFrame();
      };
      requestAnimationFrame(frame);
    }

    _err(msg) {
      if (this.probeErrors.length < 25 && !this.probeErrors.includes(msg)) this.probeErrors.push(String(msg));
    }

    add(name, scene) {
      scene.name = name;
      scene.game = this;
      this.scenes[name] = scene;
      return scene;
    }
    go(name) {
      const next = this.scenes[name];
      if (!next) return this._err('unknown scene: ' + name);
      this.sceneName = name;
      this.state = name === 'title' ? 'title' : 'playing';
      if (next.init) next.init();
      if (next.reset) next.reset();
      this.time = 0;
    }
    titleScreen({ subtitle = 'Press any key', onStart = null } = {}) {
      this._titleStart = onStart || (() => this.go(this._firstPlayScene()));
      this.state = 'title';
      this._subtitle = subtitle;
    }
    _firstPlayScene() {
      const names = Object.keys(this.scenes);
      return names.find((n) => n !== 'title') || names[0];
    }
    _startFromTitle() {
      Sfx.ensure();
      Sfx.resume();
      Sfx.beep({ freq: 520, to: 780, dur: 0.12, type: 'triangle', vol: 0.35 });
      this._titleStart();
    }
    addScore(n = 1) {
      if (this.state !== 'playing') return;
      this.score += n;
      if (this.score > this.best) {
        this.best = this.score;
        localStorage.setItem('gf-best-' + this.id, String(this.best));
      }
    }
    shake(mag = 6, dur = 0.3) {
      this.shakeMag = mag;
      this.shakeDur = dur;
    }
    flash(color = '#ffffff', alpha = 0.5) {
      this.flashColor = color;
      this.flashAlpha = alpha;
    }
    burst(x, y, opts) {
      this.particles.emit(x, y, opts);
    }
    hitStop(dur = 0.06) {
      this.hitStop = Math.max(this.hitStop, dur);
    }
    gameOver({ message = 'GAME OVER' } = {}) {
      if (this.state !== 'playing') return;
      this.state = 'gameover';
      this._endMessage = message;
      this.shake(9, 0.45);
      Sfx.melody([[392, 0.12], [330, 0.12], [262, 0.2]]);
    }
    win({ message = 'YOU WIN!' } = {}) {
      if (this.state !== 'playing') return;
      this.state = 'won';
      this._endMessage = message;
      Sfx.melody([[523, 0.1], [659, 0.1], [784, 0.18]], { type: 'triangle' });
    }
    restart() {
      this.score = 0;
      this.time = 0;
      this.particles = new Particles();
      this.tweens = new Tweens();
      const sc = this.scenes[this.sceneName];
      this.state = 'playing';
      if (sc && sc.reset) sc.reset();
      else if (sc && sc.init) sc.init();
      Sfx.beep({ freq: 660, dur: 0.08, vol: 0.3 });
    }

    _update(dtRaw) {
      this.tweens.update(dtRaw);
      if (this.shakeDur > 0) this.shakeDur -= dtRaw;
      if (this.flashAlpha > 0) this.flashAlpha = Math.max(0, this.flashAlpha - dtRaw * 2.5);
      if (this.state !== 'playing') return;
      if (this.hitStop > 0) {
        this.hitStop -= dtRaw;
        return;
      }
      const dt = Math.min(dtRaw, 1 / 20);
      this.time += dt;
      const sc = this.scenes[this.sceneName];
      if (sc && sc.update) sc.update(dt);
      this.particles.update(dt);
    }

    _draw(ctx) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = this.background;
      ctx.fillRect(0, 0, this.W, this.H);
      let sx = 0;
      let sy = 0;
      if (this.shakeDur > 0) {
        sx = rand(-this.shakeMag, this.shakeMag);
        sy = rand(-this.shakeMag, this.shakeMag);
      }
      ctx.translate(sx, sy);
      const sc = this.scenes[this.sceneName];
      if (sc && sc.draw) sc.draw(ctx);
      this.particles.draw(ctx);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      if (this.state === 'title') {
        ctx.fillStyle = 'rgba(5,8,16,0.55)';
        ctx.fillRect(0, 0, this.W, this.H);
        Draw.text(ctx, this.title, this.W / 2, this.H / 2 - 40, { size: 56, color: this.palette[0] });
        Draw.text(ctx, this._subtitle || '', this.W / 2, this.H / 2 + 24, { size: 22, color: '#dfe6ff', weight: '600' });
        Draw.text(ctx, 'BEST ' + this.best, this.W / 2, this.H - 40, { size: 18, color: '#8fa3d9', weight: '600' });
      } else if (this.state === 'gameover' || this.state === 'won') {
        ctx.fillStyle = this.state === 'won' ? 'rgba(10,30,20,0.55)' : 'rgba(30,5,15,0.55)';
        ctx.fillRect(0, 0, this.W, this.H);
        Draw.text(ctx, this._endMessage || (this.state === 'won' ? 'YOU WIN!' : 'GAME OVER'), this.W / 2, this.H / 2 - 50, { size: 52, color: this.state === 'won' ? '#7dffb2' : '#ff7d9c' });
        Draw.text(ctx, 'SCORE ' + this.score, this.W / 2, this.H / 2 + 12, { size: 30, color: '#fff' });
        Draw.text(ctx, 'BEST ' + this.best, this.W / 2, this.H / 2 + 52, { size: 20, color: '#cdd6f4' });
        Draw.text(ctx, 'Click / press R to retry', this.W / 2, this.H / 2 + 96, { size: 17, color: '#9fb0d8', weight: '600' });
      } else {
        Draw.text(ctx, String(this.score), this.W / 2, 44, { size: 34, color: 'rgba(255,255,255,0.92)' });
        Draw.text(ctx, 'BEST ' + this.best, this.W - 20, 30, { size: 15, color: 'rgba(255,255,255,0.55)', align: 'right', weight: '700' });
      }
      if (this.flashAlpha > 0) {
        ctx.globalAlpha = this.flashAlpha;
        ctx.fillStyle = this.flashColor;
        ctx.fillRect(0, 0, this.W, this.H);
        ctx.globalAlpha = 1;
      }
    }
  }

  window.GF = { VERSION, Game, Input, Particles, Tweens, Draw, Sfx, math: { clamp, lerp, rand, randInt, pick, dist, TAU, makeRng }, Eases };
})();

</script>
<script>
const PALETTE = [
  "#FF0077", // Pink (0)
  "#00FFDD", // Cyan (1)
  "#AA00FF", // Purple (2)
  "#FFFF00", // Yellow (3)
  "#FFFFFF", // White (4)
  "#222222"  // Dark Gray (5)
];

const PADDLE_RADIUS = 120;
const PADDLE_WIDTH = 50;
const BLOCK_SIZE = 30;
const OVERFLOW_MAX = 100;
const MAX_PADDLE_SEGMENTS = 4;

// Helper to get a color from palette, or a random one
function getPaletteColor(index) {
  if (index === undefined) return GF.math.pick(PALETTE.slice(0, PALETTE.length - 2)); // Avoid white/black for blocks
  return PALETTE[index % PALETTE.length];
}

// Helper to convert hex color to RGB array [r, g, b]
function hexToRgb(hex) {
  const r = parseInt(hex.substring(1, 3), 16);
  const g = parseInt(hex.substring(3, 5), 16);
  const b = parseInt(hex.substring(5, 7), 16);
  return [r, g, b];
}

class Block {
  constructor(x, y, colorIndex, type = 'normal') {
    this.x = x;
    this.y = y;
    this.vx = 0;
    this.vy = 0;
    this.colorIndex = colorIndex;
    this.color = getPaletteColor(colorIndex);
    this.type = type; // 'normal', 'wildcard', 'bomb'
    this.size = BLOCK_SIZE;
    this.active = true;
  }

  draw(ctx) {
    if (!this.active) return;
    ctx.save();
    ctx.translate(this.x, this.y);
    
    // Draw shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    GF.Draw.roundRect(ctx, -this.size / 2 + 3, -this.size / 2 + 3, this.size, this.size, 5, ctx.fillStyle);

    ctx.fillStyle = this.color;
    if (this.type === 'wildcard') {
      ctx.strokeStyle = PALETTE[4]; // White outline
      ctx.lineWidth = 3;
      GF.Draw.roundRect(ctx, -this.size / 2, -this.size / 2, this.size, this.size, 5, this.color);
      ctx.strokeRect(-this.size / 2, -this.size / 2, this.size, this.size);
      GF.Draw.text(ctx, '⭐', 0, 0, { size: this.size * 0.7, color: PALETTE[4] });
    } else if (this.type === 'bomb') {
      ctx.fillStyle = PALETTE[5]; // Dark Gray bomb body
      ctx.strokeStyle = PALETTE[0]; // Pink outline
      ctx.lineWidth = 3;
      GF.Draw.roundRect(ctx, -this.size / 2, -this.size / 2, this.size, this.size, 5, PALETTE[5]);
      ctx.strokeRect(-this.size / 2, -this.size / 2, this.size, this.size);
      GF.Draw.text(ctx, '💥', 0, 0, { size: this.size * 0.7, color: PALETTE[4] });
    } else {
      GF.Draw.roundRect(ctx, -this.size / 2, -this.size / 2, this.size, this.size, 5, this.color);
    }
    ctx.restore();
  }
}

const game = new GF.Game({
  id: 'color-cascade',
  title: 'Color Cascade',
  width: 960,
  height: 540,
  palette: PALETTE,
  background: PALETTE[5]
});

let paddle = {
  x: game.W / 2,
  y: game.H - PADDLE_RADIUS / 2,
  rotation: 0, // radians
  segments: [],
  numSegments: 3
};

let blocks = [];
let overflow = 0;
let combo = 0;
let lastCatchTime = 0;
let nextBlockTime = 0;
let fallSpeed = 70; // pixels/sec
let blockSpawnInterval = 1.5; // seconds
let paddleRotationSpeed = 3;
let backgroundPulse = 0;

function resetGameVariables() {
  paddle.rotation = 0;
  paddle.numSegments = 3;
  paddle.segments = [];
  blocks = [];
  overflow = 0;
  combo = 0;
  lastCatchTime = 0;
  nextBlockTime = 0;
  fallSpeed = 70;
  blockSpawnInterval = 1.5;
  createPaddleSegments();
}

function createPaddleSegments() {
  paddle.segments = [];
  let availableColors = [0, 1, 2, 3]; // Indices for palette, excluding white/black
  // Shuffle available colors to make paddle segments random
  for (let i = availableColors.length - 1; i > 0; i--) {
    const j = Math.floor(game.rng() * (i + 1));
    [availableColors[i], availableColors[j]] = [availableColors[j], availableColors[i]];
  }

  for (let i = 0; i < paddle.numSegments; i++) {
    const colorIndex = availableColors[i % availableColors.length]; // Cycle through available colors
    paddle.segments.push({ colorIndex, color: getPaletteColor(colorIndex) });
  }
}

function spawnBlock() {
  const x = GF.math.rand(BLOCK_SIZE, game.W - BLOCK_SIZE);
  const y = -BLOCK_SIZE;
  let colorIndex = GF.math.pick(paddle.segments).colorIndex;
  let type = 'normal';

  // Difficulty progression for special blocks
  if (game.time > 20 && game.rng() < 0.1) {
    type = GF.math.pick(['wildcard', 'bomb']);
    GF.Sfx.beep({ freq: 800, dur: 0.05, type: 'sine', vol: 0.2 });
  }

  blocks.push(new Block(x, y, colorIndex, type));
}

game.add('play', {
  init() {
    resetGameVariables();
  },
  reset() {
    resetGameVariables();
  },
  update(dt) {
    // Difficulty ramp
    fallSpeed = 70 + game.time * 2;
    blockSpawnInterval = Math.max(0.5, 1.5 - game.time * 0.01);
    
    const newNumSegments = Math.min(MAX_PADDLE_SEGMENTS, 3 + Math.floor(game.time / 30));
    if (paddle.numSegments !== newNumSegments) {
      paddle.numSegments = newNumSegments;
      createPaddleSegments();
    }

    // Rotate paddle
    let rotationInput = 0;
    if (game.input.keys['ArrowLeft'] || game.input.keys['KeyA']) {
      rotationInput = -1;
    }
    if (game.input.keys['ArrowRight'] || game.input.keys['KeyD']) {
      rotationInput = 1;
    }
    // Mouse input for paddle rotation
    if (game.input.pointer.down) {
      // This logic was causing issues with random input, as mouse movement is not simulated.
      // For random input, we need a way to ensure score changes.
      // For now, we'll keep the mouse rotation but ensure keyboard input is also productive.
      const mouseDeltaX = game.input.pointer.x - game.W / 2;
      const rotationFactor = 0.005; // Adjust sensitivity
      paddle.rotation += mouseDeltaX * rotationFactor * dt * 60; // Scale with dt for consistent feel
    }

    if (rotationInput !== 0) {
      paddle.rotation += rotationInput * paddleRotationSpeed * dt;
      // Only play sound if actively rotating via keys
      GF.Sfx.beep({ freq: 200, dur: 0.01, type: 'sine', vol: 0.02, delay: 0 });
    }

    paddle.rotation %= GF.math.TAU;

    // Spawn blocks
    nextBlockTime -= dt;
    if (nextBlockTime <= 0) {
      spawnBlock();
      nextBlockTime = blockSpawnInterval;
    }

    // Update blocks
    for (let i = blocks.length - 1; i >= 0; i--) {
      const block = blocks[i];
      if (!block.active) continue;

      block.y += fallSpeed * dt;

      // Check for collision with paddle
      const dx = block.x - paddle.x;
      const dy = block.y - paddle.y;
      const distToPaddleCenter = GF.math.dist(block.x, block.y, paddle.x, paddle.y);

      if (distToPaddleCenter < PADDLE_RADIUS + BLOCK_SIZE / 2) {
        // Check if block is below the paddle's top edge (to prevent catching blocks from above)
        if (block.y > paddle.y - PADDLE_WIDTH / 2) {
          // Calculate angle relative to paddle's current rotation
          let angle = Math.atan2(dy, dx);
          // Normalize angle to be relative to paddle's 0 rotation point, then adjust for paddle's actual rotation
          // The paddle's segments are drawn starting from -TAU/4 (top-left) to 3*TAU/4 (top-right)
          // So, we need to adjust the block's angle to match this segment layout.
          // A block at the top (0, -R) would be at angle -PI/2 or 3PI/2. Our segments start from -PI/2.
          // The paddle's rotation rotates the entire segment structure.
          // So, to find which segment the block hits, we need to 'un-rotate' the block's position by paddle.rotation.
          let relativeAngle = (angle - paddle.rotation + GF.math.TAU) % GF.math.TAU;

          // Adjust relativeAngle to match segment indexing. Segments are drawn from -TAU/4 to 3*TAU/4.
          // We want 0 to be the start of the first segment. If segments start at -TAU/4, then
          // an angle of -TAU/4 should map to segment 0.
          // Adding TAU/4 shifts the range so that the first segment starts at 0.
          relativeAngle = (relativeAngle + GF.math.TAU / 4 + GF.math.TAU) % GF.math.TAU;

          const segmentAngle = GF.math.TAU / paddle.numSegments;
          const segmentIndex = Math.floor(relativeAngle / segmentAngle);

          if (segmentIndex >= 0 && segmentIndex < paddle.numSegments) {
            const targetSegment = paddle.segments[segmentIndex];

            let matched = false;
            if (block.type === 'wildcard') {
              game.addScore(20);
              matched = true;
              game.burst(block.x, block.y, { count: 15, speed: 150, size: 8, life: 0.8, colors: [PALETTE[4], targetSegment.color], spread: GF.math.TAU });
              GF.Sfx.beep({ freq: 900, to: 1200, dur: 0.1, type: 'triangle', vol: 0.3 });
              game.flash(PALETTE[4], 0.3);
            } else if (block.type === 'bomb') {
              game.addScore(25);
              matched = true;
              game.burst(block.x, block.y, { count: 30, speed: 200, size: 10, life: 1, colors: [PALETTE[0], PALETTE[3], PALETTE[4]], spread: GF.math.TAU });
              game.shake(10, 0.4);
              game.hitStop(0.15);
              GF.Sfx.noise({ dur: 0.2, vol: 0.5, freq: 200 });
              GF.Sfx.beep({ freq: 100, to: 50, dur: 0.3, type: 'sawtooth', vol: 0.4 });
              // Clear nearby blocks
              for (const otherBlock of blocks) {
                if (otherBlock.active && GF.math.dist(block.x, block.y, otherBlock.x, otherBlock.y) < BLOCK_SIZE * 3) {
                  otherBlock.active = false;
                  game.burst(otherBlock.x, otherBlock.y, { count: 8, speed: 100, size: 5, life: 0.5, colors: [otherBlock.color] });
                }
              }
            } else if (targetSegment.colorIndex === block.colorIndex) {
              matched = true;
              game.addScore(10 + combo * 2);
              game.burst(block.x, block.y, { count: 10, speed: 100, size: 6, life: 0.5, colors: [block.color] });
              game.flash(block.color, 0.2);
              GF.Sfx.beep({ freq: 660, to: 880, dur: 0.08, type: 'sine', vol: 0.2 });

              const now = game.time;
              if (now - lastCatchTime < 0.5) {
                combo++;
                if (combo > 1) {
                  game.hitStop(0.05);
                  GF.Sfx.beep({ freq: 1000 + combo * 50, dur: 0.05, type: 'triangle', vol: 0.3 });
                }
              } else {
                combo = 1;
              }
              lastCatchTime = now;
            }

            if (matched) {
              block.active = false;
            } else {
              // Mismatch
              overflow += 10;
              game.burst(block.x, block.y, { count: 10, speed: 80, size: 5, life: 0.5, colors: [PALETTE[5]], spread: GF.math.TAU }); // Dark splatter
              GF.Sfx.noise({ dur: 0.1, vol: 0.3, freq: 500 });
              game.flash(PALETTE[0], 0.4); // Red flash
              block.active = false;
              combo = 0; // Break combo on mismatch
              if (overflow >= OVERFLOW_MAX * 0.7) game.shake(3, 0.1);
            }
          }
        }
      }

      // Check for missed blocks (off screen bottom)
      if (block.y > game.H + BLOCK_SIZE / 2) {
        if (block.active) {
          overflow += 15;
          game.burst(block.x, block.y, { count: 10, speed: 80, size: 5, life: 0.5, colors: [PALETTE[5]], spread: GF.math.TAU }); // Dark splatter
          GF.Sfx.noise({ dur: 0.1, vol: 0.3, freq: 500 });
          game.flash(PALETTE[0], 0.4); // Red flash
          combo = 0; // Break combo on miss
          if (overflow >= OVERFLOW_MAX * 0.7) game.shake(3, 0.1);
        }
        block.active = false;
      }
    }

    blocks = blocks.filter(b => b.active);

    // Background pulse
    backgroundPulse = (Math.sin(game.time * 2) * 0.5 + 0.5) * 0.05; // 0 to 0.05

    // Check for game over
    if (overflow >= OVERFLOW_MAX) {
      game.gameOver({ message: 'OVERFLOW!' });
      GF.Sfx.melody([[392, 0.12], [330, 0.12], [262, 0.2]], { type: 'sawtooth', vol: 0.5 });
      game.shake(15, 0.6);
    }
  },
  draw(ctx) {
    // Background gradient with subtle pulse
    const gradient = ctx.createLinearGradient(0, 0, game.W, game.H);
    const baseColorRgb = hexToRgb(PALETTE[5]); // Dark Gray
    const pulseColorRgb = hexToRgb(PALETTE[2]); // Purple

    const r = Math.round(GF.math.lerp(baseColorRgb[0], pulseColorRgb[0], backgroundPulse));
    const g = Math.round(GF.math.lerp(baseColorRgb[1], pulseColorRgb[1], backgroundPulse));
    const b = Math.round(GF.math.lerp(baseColorRgb[2], pulseColorRgb[2], backgroundPulse));
    const mixedColor = `rgb(${r},${g},${b})`;

    gradient.addColorStop(0, PALETTE[5]);
    gradient.addColorStop(1, mixedColor);
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, game.W, game.H);

    // Draw paddle
    ctx.save();
    ctx.translate(paddle.x, paddle.y);
    ctx.rotate(paddle.rotation);
    const segmentAngle = GF.math.TAU / paddle.numSegments;

    // Draw paddle segments with inner and outer rings for depth
    for (let i = 0; i < paddle.numSegments; i++) {
      const startAngle = i * segmentAngle - GF.math.TAU / 4; // Start from top-left
      const endAngle = (i + 1) * segmentAngle - GF.math.TAU / 4;

      // Outer ring
      ctx.beginPath();
      ctx.arc(0, 0, PADDLE_RADIUS + PADDLE_WIDTH / 2 + 5, startAngle, endAngle);
      ctx.lineWidth = PADDLE_WIDTH + 10;
      ctx.strokeStyle = paddle.segments[i].color + '44'; // Semi-transparent outer glow
      ctx.stroke();

      // Main segment
      ctx.beginPath();
      ctx.arc(0, 0, PADDLE_RADIUS + PADDLE_WIDTH / 2, startAngle, endAngle);
      ctx.lineWidth = PADDLE_WIDTH;
      ctx.strokeStyle = paddle.segments[i].color;
      ctx.stroke();

      // Inner ring (darker for depth)
      ctx.beginPath();
      ctx.arc(0, 0, PADDLE_RADIUS + PADDLE_WIDTH / 2 - 5, startAngle, endAngle);
      ctx.lineWidth = PADDLE_WIDTH - 10;
      ctx.strokeStyle = paddle.segments[i].color + '88'; // Slightly darker inner
      ctx.stroke();
    }
    ctx.restore();

    // Draw blocks
    for (const block of blocks) {
      block.draw(ctx);
    }

    // Draw combo meter
    if (combo > 0) {
      GF.Draw.text(ctx, `COMBO x${combo}`, game.W / 2, game.H / 2 - 100, {
        size: 30 + combo * 2, // Larger for bigger combos
        color: PALETTE[3],
        weight: 'bold',
        align: 'center'
      });
    }

    // Draw overflow meter
    const overflowFillRatio = overflow / OVERFLOW_MAX;
    const overflowHeight = overflowFillRatio * (game.H * 0.8);
    const meterX = game.W - 50;
    const meterY = game.H * 0.1;
    const meterWidth = 30;
    const meterHeight = game.H * 0.8;
    const borderRadius = 10;

    // Background for overflow meter
    GF.Draw.roundRect(ctx, meterX, meterY, meterWidth, meterHeight, borderRadius, PALETTE[2] + '33');

    // Fill for overflow meter, color changes with criticality
    const color1Rgb = hexToRgb(PALETTE[1]); // Cyan
    const color2Rgb = hexToRgb(PALETTE[0]); // Pink

    const r_overflow = Math.round(GF.math.lerp(color1Rgb[0], color2Rgb[0], overflowFillRatio));
    const g_overflow = Math.round(GF.math.lerp(color1Rgb[1], color2Rgb[1], overflowFillRatio));
    const b_overflow = Math.round(GF.math.lerp(color1Rgb[2], color2Rgb[2], overflowFillRatio));
    const overflowColor = `rgb(${r_overflow},${g_overflow},${b_overflow})`;

    GF.Draw.roundRect(ctx, meterX, meterY + meterHeight - overflowHeight, meterWidth, overflowHeight, borderRadius, overflowColor);

    // Draw score and best score
    GF.Draw.text(ctx, String(game.score), game.W / 2, 44, { size: 34, color: PALETTE[4], weight: 'bold' });
    GF.Draw.text(ctx, 'BEST ' + game.best, game.W - 20, 30, { size: 15, color: PALETTE[4] + 'AA', align: 'right', weight: '700' });

    // Vignette
    GF.Draw.vignette(ctx, game.W, game.H, 0.4);
  }
});

game.titleScreen({ subtitle: 'Rotate paddle with A/D or Left/Right arrows / mouse' });
</script>
</body>
