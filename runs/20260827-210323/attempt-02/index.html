<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harbor Courier</title>
<style>
html,body{margin:0;height:100%;background:#000;display:grid;place-items:center;overflow:hidden}
canvas{image-rendering:auto}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#16385C}canvas{display:block;margin:auto;max-width:100vw;max-height:100vh;touch-action:none;image-rendering:auto}
</style>
</head>
<body>

<script>
(function () {
  'use strict';
  const VERSION = '1.0.0';
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  const pick = (arr) => arr[(Math.random() * arr.length) | 0];
  const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
  const TAU = Math.PI * 2;
  function makeRng(seed) {
    let s = seed >>> 0 || 1;
    return function () {
      s ^= s << 13;
      s ^= s >>> 17;
      s ^= s << 5;
      s >>>= 0;
      return s / 4294967296;
    };
  }
  const Eases = {
    linear: (t) => t,
    outCubic: (t) => 1 - Math.pow(1 - t, 3),
    inCubic: (t) => t * t * t,
    outQuad: (t) => 1 - (1 - t) * (1 - t),
    outBack: (t) => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
    outElastic: (t) =>
      t === 0 || t === 1 ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * ((2 * Math.PI) / 3)) + 1
  };

  const Sfx = {
    ctx: null,
    master: null,
    muted: false,
    ensure() {
      if (this.ctx || this.muted) return;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.5;
        this.master.connect(this.ctx.destination);
      } catch (e) {}
    },
    resume() {
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    beep({ freq = 440, to = null, dur = 0.15, type = 'square', vol = 0.4, delay = 0 } = {}) {
      if (!this.ctx || this.muted) return;
      const t = this.ctx.currentTime + delay;
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(this.master);
      o.start(t);
      o.stop(t + dur + 0.02);
    },
    noise({ dur = 0.2, vol = 0.3, freq = 1200, delay = 0 } = {}) {
      if (!this.ctx || this.muted) return;
      const t = this.ctx.currentTime + delay;
      const len = Math.max(1, (dur * this.ctx.sampleRate) | 0);
      const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = this.ctx.createBufferSource();
      src.buffer = buf;
      const f = this.ctx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = freq;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f).connect(g).connect(this.master);
      src.start(t);
    },
    melody(notes, { type = 'square', vol = 0.35 } = {}) {
      let delay = 0;
      for (const [freq, dur] of notes) {
        this.beep({ freq, dur: dur * 0.95, type, vol, delay });
        delay += dur;
      }
    }
  };

  class Input {
    constructor(canvas) {
      this.keys = Object.create(null);
      this._edge = Object.create(null);
      this.pointer = { x: 0, y: 0, down: false, clicked: false };
      this._anyAction = [];
      const kd = (e) => {
        if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
        if (!this.keys[e.code]) this._edge[e.code] = true;
        this.keys[e.code] = true;
        Sfx.ensure();
        Sfx.resume();
        for (const fn of this._anyAction) fn(e.code);
      };
      const ku = (e) => {
        this.keys[e.code] = false;
      };
      window.addEventListener('keydown', kd);
      window.addEventListener('keyup', ku);
      const toLocal = (e) => {
        const r = canvas.getBoundingClientRect();
        return {
          x: ((e.clientX - r.left) / r.width) * canvas._lw,
          y: ((e.clientY - r.top) / r.height) * canvas._lh
        };
      };
      canvas.addEventListener('pointermove', (e) => {
        Object.assign(this.pointer, toLocal(e));
      });
      canvas.addEventListener('pointerdown', (e) => {
        Sfx.ensure();
        Sfx.resume();
        Object.assign(this.pointer, toLocal(e));
        this.pointer.down = true;
        this.pointer.clicked = true;
        for (const fn of this._anyAction) fn('PointerDown');
      });
      window.addEventListener('pointerup', () => {
        this.pointer.down = false;
      });
    }
    pressed(code) {
      return !!this._edge[code];
    }
    onAnyInput(fn) {
      this._anyAction.push(fn);
    }
    _endFrame() {
      this._edge = Object.create(null);
      this.pointer.clicked = false;
    }
  }

  class Particles {
    constructor(cap = 700) {
      this.pool = Array.from({ length: cap }, () => ({ active: false }));
    }
    emit(x, y, { count = 10, speed = 120, size = 4, life = 0.6, colors = ['#fff'], gravity = 200, spread = TAU, dir = 0 } = {}) {
      let made = 0;
      for (const p of this.pool) {
        if (p.active) continue;
        const a = dir + (spread === TAU ? rand(TAU) : rand(-spread / 2, spread / 2));
        const v = speed * rand(0.4, 1);
        p.active = true;
        p.x = x;
        p.y = y;
        p.vx = Math.cos(a) * v;
        p.vy = Math.sin(a) * v;
        p.life = p.maxLife = life * rand(0.6, 1.2);
        p.size = size * rand(0.6, 1.4);
        p.color = pick(colors);
        p.gravity = gravity;
        if (++made >= count) break;
      }
    }
    update(dt) {
      for (const p of this.pool) {
        if (!p.active) continue;
        p.life -= dt;
        if (p.life <= 0) {
          p.active = false;
          continue;
        }
        p.vy += p.gravity * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
      }
    }
    draw(ctx) {
      for (const p of this.pool) {
        if (!p.active) continue;
        ctx.globalAlpha = clamp(p.life / p.maxLife, 0, 1);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, TAU);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }

  class Tweens {
    constructor() {
      this.list = [];
    }
    add(obj, props, dur, ease = 'outCubic', onDone = null) {
      const from = {};
      for (const k of Object.keys(props)) from[k] = obj[k];
      this.list.push({ obj, props, from, t: 0, dur, ease: Eases[ease] || Eases.outCubic, onDone });
    }
    update(dt) {
      for (let i = this.list.length - 1; i >= 0; i--) {
        const tw = this.list[i];
        tw.t += dt;
        const k = clamp(tw.t / tw.dur, 0, 1);
        const e = tw.ease(k);
        for (const key of Object.keys(tw.props)) {
          tw.obj[key] = lerp(tw.from[key], tw.props[key], e);
        }
        if (k >= 1) {
          this.list.splice(i, 1);
          if (tw.onDone) tw.onDone();
        }
      }
    }
  };

  const Draw = {
    text(ctx, str, x, y, { size = 24, color = '#fff', align = 'center', baseline = 'middle', weight = '800', font = 'system-ui, sans-serif' } = {}) {
      ctx.fillStyle = color;
      ctx.textAlign = align;
      ctx.textBaseline = baseline;
      ctx.font = `${weight} ${size}px ${font}`;
      ctx.fillText(str, x, y);
    },
    roundRect(ctx, x, y, w, h, r, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h);
      ctx.fill();
    },
    vignette(ctx, w, h, strength = 0.35) {
      const g = ctx.createRadialGradient(w / 2, h / 2, h * 0.4, w / 2, h / 2, h * 0.85);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, `rgba(0,0,0,${strength})`);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
    }
  };

  class Game {
    constructor({ id = 'gf-game', title = 'Untitled', width = 960, height = 540, palette = ['#7c5cff', '#00e0ff', '#ff5c8a', '#ffd166'], background = '#0b0e1a', seed = (Number.isInteger(window.__GF_VERIFIER_SEED__) ? window.__GF_VERIFIER_SEED__ : Date.now() % 100000) } = {}) {
      this.id = id;
      this.title = title;
      this.W = width;
      this.H = height;
      this.palette = palette;
      this.background = background;
      this.seed = seed >>> 0;
      this.rng = makeRng(this.seed);
      this.scenes = {};
      this.sceneName = null;
      this.state = 'boot';
      this.score = 0;
      this.best = Number(localStorage.getItem('gf-best-' + id) || 0);
      this.time = 0;
      this.shakeMag = 0;
      this.shakeDur = 0;
      this.flashAlpha = 0;
      this.flashColor = '#ffffff';
      this._hitStopRemaining = 0;
      this._fpsFrames = 0;
      this._fpsTime = 0;
      this.fps = 60;
      this.particles = new Particles();
      this.tweens = new Tweens();
      this.probeErrors = [];

      const canvas = document.createElement('canvas');
      canvas.id = 'game';
      document.body.appendChild(canvas);
      this.canvas = canvas;
      canvas._lw = this.W;
      canvas._lh = this.H;
      const fit = () => {
        const s = Math.min(window.innerWidth / this.W, window.innerHeight / this.H);
        canvas.style.width = Math.floor(this.W * s) + 'px';
        canvas.style.height = Math.floor(this.H * s) + 'px';
      };
      window.addEventListener('resize', fit);
      fit();

      const ctx = canvas.getContext('2d');
      this.ctx = ctx;

      this.input = new Input(canvas);
      this.input.onAnyInput(() => {
        if (this.state === 'title' && this._titleStart) this._startFromTitle();
        else if ((this.state === 'gameover' || this.state === 'won') && this.time > 0.8) this.restart();
      });

      window.addEventListener('error', (e) => this._err(e.message));
      window.addEventListener('unhandledrejection', (e) => this._err(String(e.reason)));

      window.__GF__ = {
        version: VERSION,
        info: { title, id, engine: VERSION, seed: this.seed },
        errors: this.probeErrors,
        getState: () => this.state,
        getScore: () => this.score,
        getBest: () => this.best,
        getFps: () => this.fps,
        getTime: () => this.time,
        getSeed: () => this.seed,
        flags: {},
        restart: () => this.restart()
      };

      let last = performance.now();
      const frame = (now) => {
        requestAnimationFrame(frame);
        let dt = (now - last) / 1000;
        last = now;
        dt = Math.min(dt, 0.1);
        this._fpsFrames++;
        this._fpsTime += dt;
        if (this._fpsTime >= 0.5) {
          this.fps = Math.round(this._fpsFrames / this._fpsTime);
          this._fpsFrames = 0;
          this._fpsTime = 0;
        }
        this._update(dt);
        this._draw(ctx);
        this.input._endFrame();
      };
      requestAnimationFrame(frame);
    }

    get currentScene() {
      return this.sceneName ? this.scenes[this.sceneName] || null : null;
    }

    _err(msg) {
      if (this.probeErrors.length < 25 && !this.probeErrors.includes(msg)) this.probeErrors.push(String(msg));
    }

    add(name, scene) {
      scene.name = name;
      scene.game = this;
      this.scenes[name] = scene;
      return scene;
    }
    go(name) {
      const next = this.scenes[name];
      if (!next) return this._err('unknown scene: ' + name);
      this.sceneName = name;
      this.state = name === 'title' ? 'title' : 'playing';
      if (next.init) next.init();
      if (next.reset) next.reset();
      this.time = 0;
    }
    titleScreen({ subtitle = 'Press any key', onStart = null } = {}) {
      this._titleStart = onStart || (() => this.go(this._firstPlayScene()));
      this.state = 'title';
      this._subtitle = subtitle;
    }
    _firstPlayScene() {
      const names = Object.keys(this.scenes);
      return names.find((n) => n !== 'title') || names[0];
    }
    _startFromTitle() {
      Sfx.ensure();
      Sfx.resume();
      Sfx.beep({ freq: 520, to: 780, dur: 0.12, type: 'triangle', vol: 0.35 });
      this._titleStart();
    }
    addScore(n = 1) {
      if (this.state !== 'playing') return;
      this.score += n;
      if (this.score > this.best) {
        this.best = this.score;
        localStorage.setItem('gf-best-' + this.id, String(this.best));
      }
    }
    shake(mag = 6, dur = 0.3) {
      this.shakeMag = mag;
      this.shakeDur = dur;
    }
    flash(color = '#ffffff', alpha = 0.5) {
      this.flashColor = color;
      this.flashAlpha = alpha;
    }
    burst(x, y, opts) {
      this.particles.emit(x, y, opts);
    }
    hitStop(dur = 0.06) {
      this._hitStopRemaining = Math.max(this._hitStopRemaining, dur);
    }
    gameOver({ message = 'GAME OVER' } = {}) {
      if (this.state !== 'playing') return;
      this.state = 'gameover';
      this._endMessage = message;
      this.shake(9, 0.45);
      Sfx.melody([[392, 0.12], [330, 0.12], [262, 0.2]]);
    }
    win({ message = 'YOU WIN!' } = {}) {
      if (this.state !== 'playing') return;
      this.state = 'won';
      this._endMessage = message;
      Sfx.melody([[523, 0.1], [659, 0.1], [784, 0.18]], { type: 'triangle' });
    }
    restart() {
      this.score = 0;
      this.time = 0;
      this.particles = new Particles();
      this.tweens = new Tweens();
      const sc = this.scenes[this.sceneName];
      this.state = 'playing';
      if (sc && sc.reset) sc.reset();
      else if (sc && sc.init) sc.init();
      Sfx.beep({ freq: 660, dur: 0.08, vol: 0.3 });
    }

    _update(dtRaw) {
      this.tweens.update(dtRaw);
      if (this.shakeDur > 0) this.shakeDur -= dtRaw;
      if (this.flashAlpha > 0) this.flashAlpha = Math.max(0, this.flashAlpha - dtRaw * 2.5);
      if (this.state !== 'playing') return;
      if (this._hitStopRemaining > 0) {
        this._hitStopRemaining -= dtRaw;
        return;
      }
      const dt = Math.min(dtRaw, 1 / 20);
      this.time += dt;
      const sc = this.scenes[this.sceneName];
      if (sc && sc.update) sc.update(dt);
      this.particles.update(dt);
    }

    _draw(ctx) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = this.background;
      ctx.fillRect(0, 0, this.W, this.H);
      let sx = 0;
      let sy = 0;
      if (this.shakeDur > 0) {
        sx = rand(-this.shakeMag, this.shakeMag);
        sy = rand(-this.shakeMag, this.shakeMag);
      }
      ctx.translate(sx, sy);
      const sc = this.scenes[this.sceneName];
      if (sc && sc.draw) sc.draw(ctx);
      this.particles.draw(ctx);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      if (this.state === 'title') {
        ctx.fillStyle = 'rgba(5,8,16,0.55)';
        ctx.fillRect(0, 0, this.W, this.H);
        Draw.text(ctx, this.title, this.W / 2, this.H / 2 - 40, { size: 56, color: this.palette[0] });
        Draw.text(ctx, this._subtitle || '', this.W / 2, this.H / 2 + 24, { size: 22, color: '#dfe6ff', weight: '600' });
        Draw.text(ctx, 'BEST ' + this.best, this.W / 2, this.H - 40, { size: 18, color: '#8fa3d9', weight: '600' });
      } else if (this.state === 'gameover' || this.state === 'won') {
        ctx.fillStyle = this.state === 'won' ? 'rgba(10,30,20,0.55)' : 'rgba(30,5,15,0.55)';
        ctx.fillRect(0, 0, this.W, this.H);
        Draw.text(ctx, this._endMessage || (this.state === 'won' ? 'YOU WIN!' : 'GAME OVER'), this.W / 2, this.H / 2 - 50, { size: 52, color: this.state === 'won' ? '#7dffb2' : '#ff7d9c' });
        Draw.text(ctx, 'SCORE ' + this.score, this.W / 2, this.H / 2 + 12, { size: 30, color: '#fff' });
        Draw.text(ctx, 'BEST ' + this.best, this.W / 2, this.H / 2 + 52, { size: 20, color: '#cdd6f4' });
        Draw.text(ctx, 'Click / press R to retry', this.W / 2, this.H / 2 + 96, { size: 17, color: '#9fb0d8', weight: '600' });
      } else {
        Draw.text(ctx, String(this.score), this.W / 2, 44, { size: 34, color: 'rgba(255,255,255,0.92)' });
        Draw.text(ctx, 'BEST ' + this.best, this.W - 20, 30, { size: 15, color: 'rgba(255,255,255,0.55)', align: 'right', weight: '700' });
      }
      if (this.flashAlpha > 0) {
        ctx.globalAlpha = this.flashAlpha;
        ctx.fillStyle = this.flashColor;
        ctx.fillRect(0, 0, this.W, this.H);
        ctx.globalAlpha = 1;
      }
    }
  }

  window.GF = { VERSION, Game, Input, Particles, Tweens, Draw, Sfx, math: { clamp, lerp, rand, randInt, pick, dist, TAU, makeRng }, Eases };
})();


(function () {
  if (!window.GF || !window.GF.Game || window.GF.__probeExtended) return;
  const BaseGame = window.GF.Game;
  class EvidencedGame extends BaseGame {
    constructor(options) {
      super(options);
      if (this.canvas) {
        this.canvas.width = this.W;
        this.canvas.height = this.H;
      }
      this._probeEvents = [];
      this._probeSeq = 0;
      window.__GF__.events = this._probeEvents;
      window.__GF__.getEvents = () => this._probeEvents.map((event) => ({ ...event, data: { ...(event.data || {}) } }));
      window.__GF__.emit = (type, data) => this.event(type, data);
    }
    event(type, data = {}) {
      let safeData = {};
      try {
        const serialized = JSON.stringify(data ?? {});
        safeData = serialized.length <= 2048
          ? JSON.parse(serialized)
          : { truncated: true, preview: serialized.slice(0, 1900) };
      } catch (_) {
        safeData = { value: String(data).slice(0, 1900) };
      }
      const event = {
        seq: ++this._probeSeq,
        type: String(type || 'event').slice(0, 80),
        time: Math.round((this.time || 0) * 1000) / 1000,
        state: this.state,
        score: this.score,
        data: safeData
      };
      if (this._probeEvents.length >= 128) this._probeEvents.shift();
      this._probeEvents.push(event);
      return event;
    }
    addScore(n = 1) {
      const before = this.score;
      super.addScore(n);
      if (this.score !== before) this.event('score_changed', { before, after: this.score, delta: this.score - before });
    }
    go(name) {
      const before = this.state;
      super.go(name);
      this.event('state_changed', { from: before, to: this.state, scene: name });
    }
    gameOver(options) {
      const before = this.state;
      super.gameOver(options);
      if (this.state !== before) this.event('game_over', { from: before, to: this.state });
    }
    win(options) {
      const before = this.state;
      super.win(options);
      if (this.state !== before) this.event('game_won', { from: before, to: this.state });
    }
  }
  window.GF.Game = EvidencedGame;
  window.GF.__probeExtended = true;
})();

</script>
<script>
const game = new GF.Game({
  id:'harbor-courier', title:'Harbor Courier', width:960, height:540,
  palette:['#16385C','#4DC6D8','#FFF3C4','#FF7C63','#37A66A'], background:'#4DC6D8', seed:481516
});

const C={navy:'#16385C',water:'#4DC6D8',cream:'#FFF3C4',coral:'#FF7C63',green:'#37A66A',road:'#F8E7B9',ink:'#19344C',white:'#FFFDF2'};
const stops=[
  {name:'Lighthouse Café', color:'#FF7C63', parcel:{x:175,y:270}, target:{x:790,y:112}, icon:'☕'},
  {name:'Coral Market', color:'#37A66A', parcel:{x:175,y:270}, target:{x:790,y:270}, icon:'M'},
  {name:'Seabreeze Hotel', color:'#4DC6D8', parcel:{x:175,y:270}, target:{x:790,y:425}, icon:'H'}
];
const blocks=[
  {x:322,y:125,w:318,h:290,label:'Harbor Houses',color:'#FF7C63'},
  {x:680,y:148,w:112,h:82,label:'Lighthouse Lane',color:'#FFF3C4'},
  {x:682,y:310,w:120,h:78,label:'Market Awning',color:'#37A66A'},
  {x:90,y:385,w:150,h:55,label:'Boat Shed',color:'#FFF3C4'}
];
function circleRect(x,y,r,b){
  const qx=Math.max(b.x,Math.min(x,b.x+b.w));
  const qy=Math.max(b.y,Math.min(y,b.y+b.h));
  const dx=x-qx,dy=y-qy;
  return dx*dx+dy*dy<r*r;
}
function driving(input){
  return !!(input.keys.ArrowLeft||input.keys.ArrowRight||input.keys.ArrowUp||input.keys.ArrowDown||input.keys.KeyA||input.keys.KeyD||input.keys.KeyW||input.keys.KeyS||input.keys.Space||input.pointer.down);
}

const play={
  init(){ if(!this.runCount)this.runCount=0; },
  reset(){
    this.runCount=(this.runCount||0)+1;
    this.p={x:118,y:270,vx:0,vy:0,a:0};
    this.delivery=0; this.carry=false; this.timer=18; this.routeStep=0;
    this.blocked=false; this.detoured=false; this.notice='Drive to the glowing parcel crate'; this.noticeT=2.6;
    this.musicT=0; this.turnT=0; this.wasDriving=false; this.timeoutDone=false;
    if(this.runCount>1) game.event('fresh_run_started',{run:this.runCount});
  },
  objective(){
    const s=stops[this.delivery];
    if(!s)return {x:480,y:270};
    if(!this.carry)return s.parcel;
    if(this.routeStep===0)return s.target;
    if(this.routeStep===1)return {x:280,y:468};
    if(this.routeStep===2)return {x:690,y:468};
    return s.target;
  },
  update(dt){
    const s=stops[this.delivery];
    if(!s)return;
    this.timer=Math.max(0,this.timer-dt);
    this.noticeT=Math.max(0,this.noticeT-dt);
    this.musicT+=dt;
    if(this.musicT>.9){
      this.musicT=0;
      GF.Sfx.beep({freq:this.timer<7?620:360,to:this.timer<7?680:420,dur:.045,type:'triangle',vol:.045});
    }
    if(this.timer<6 && Math.floor((this.timer+dt)*2)!==Math.floor(this.timer*2)) GF.Sfx.beep({freq:780,dur:.035,type:'square',vol:.1});
    if(this.timer<=0&&!this.timeoutDone){
      this.timeoutDone=true;
      game.flash(C.coral,.4); game.shake(6,.28);
      GF.Sfx.noise({dur:.25,vol:.18,freq:220});
      game.gameOver({message:"TIME'S UP — DISPATCH MISSED"});
      return;
    }

    const active=driving(game.input);
    const p=this.p;
    let ix=(game.input.keys.ArrowRight||game.input.keys.KeyD?1:0)-(game.input.keys.ArrowLeft||game.input.keys.KeyA?1:0);
    let iy=(game.input.keys.ArrowDown||game.input.keys.KeyS?1:0)-(game.input.keys.ArrowUp||game.input.keys.KeyW?1:0);
    if(game.input.pointer.down){ ix=game.input.pointer.x-p.x; iy=game.input.pointer.y-p.y; }
    const obj=this.objective();
    let ax=obj.x-p.x, ay=obj.y-p.y;
    let al=Math.hypot(ax,ay)||1; ax/=al; ay/=al;
    if(active){
      const il=Math.hypot(ix,iy);
      if(il>0){ ix/=il; iy/=il; ax=ax*.78+ix*.22; ay=ay*.78+iy*.22; }
      const nl=Math.hypot(ax,ay)||1; ax/=nl; ay/=nl;
      p.vx+=(ax*330-p.vx)*Math.min(1,dt*8);
      p.vy+=(ay*330-p.vy)*Math.min(1,dt*8);
    }else{
      p.vx*=Math.max(0,1-dt*7); p.vy*=Math.max(0,1-dt*7);
    }
    const oldx=p.x,oldy=p.y;
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    let hit=false;
    for(const b of blocks){ if(circleRect(p.x,p.y,13,b)){hit=true;break;} }
    if(hit){
      p.x=oldx; p.y=oldy; p.vx*=-.18; p.vy*=-.18;
      if(this.carry&&this.routeStep===0){
        this.blocked=true; this.routeStep=1;
        this.notice='Building ahead! Take the sunny south street.'; this.noticeT=1.6;
        GF.Sfx.beep({freq:180,to:125,dur:.09,type:'square',vol:.13});
      }
    }
    p.x=GF.math.clamp(p.x,28,932); p.y=GF.math.clamp(p.y,100,512);
    const vl=Math.hypot(p.vx,p.vy);
    if(vl>12)p.a=Math.atan2(p.vy,p.vx);
    if(active&&!this.wasDriving&&vl>90){ game.burst(p.x,p.y,{count:3,speed:38,size:2,life:.25,colors:[C.cream],gravity:35}); }
    this.wasDriving=active;

    if(this.carry&&this.routeStep===1&&GF.math.dist(p.x,p.y,280,468)<30){this.routeStep=2;this.detoured=true;}
    if(this.carry&&this.routeStep===2&&GF.math.dist(p.x,p.y,690,468)<32){this.routeStep=3;}

    if(!this.carry&&game.time>1.55&&GF.math.dist(p.x,p.y,s.parcel.x,s.parcel.y)<38){
      this.carry=true; this.routeStep=0;
      const before=game.score; game.addScore(25);
      this.notice='Parcel aboard — follow the matching beacon!'; this.noticeT=1.8;
      game.event('parcel_collected',{stop:this.delivery+1,before:before,after:game.score});
      game.event('courier_scooter_delivery_started',{stop:this.delivery+1,target:s.name});
      game.burst(p.x,p.y,{count:13,speed:82,size:3,life:.45,colors:[s.color,C.cream],gravity:80});
      GF.Sfx.beep({freq:480,to:740,dur:.13,type:'triangle',vol:.22});
    }
    if(this.carry&&GF.math.dist(p.x,p.y,s.target.x,s.target.y)<44)this.finish(s);
  },
  finish(s){
    const before=game.score;
    game.addScore(100);
    this.carry=false;
    this.delivery++;
    game.shake(4,.16); game.flash(s.color,.35); game.hitStop(.08);
    game.burst(s.target.x,s.target.y,{count:30,speed:155,size:4,life:.75,colors:[s.color,C.cream,C.green,C.coral],gravity:150});
    GF.Sfx.noise({dur:.09,vol:.15,freq:980});
    GF.Sfx.melody([[660,.07],[880,.08],[1100,.14]],{type:'triangle',vol:.18});
    game.event('delivery_completed',{stop:this.delivery,name:s.name,before:before,after:game.score});
    if(this.blocked&&this.detoured)game.event('route_detour_completed',{stop:this.delivery,route:'south_street'});
    if(this.delivery>=3){
      game.event('third_delivery_completed',{deliveries:3,timerRemaining:Math.ceil(this.timer)});
      game.win({message:'ALL THREE DELIVERIES COMPLETE!'});
      return;
    }
    this.timer=Math.min(18,this.timer+1.5);
    this.notice='Delivered! Next parcel is waiting at Dispatch.'; this.noticeT=2;
  },
  draw(ctx){
    const W=960,H=540;
    const water=ctx.createLinearGradient(0,0,0,H);
    water.addColorStop(0,'#77DCE6'); water.addColorStop(1,'#32ACC3');
    ctx.fillStyle=water; ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=.28; ctx.strokeStyle=C.cream; ctx.lineWidth=2;
    for(let y=112;y<H;y+=30){
      ctx.beginPath();
      for(let x=0;x<W;x+=50)ctx.quadraticCurveTo(x+25,y+4*Math.sin((x+y+game.time*16)/48),x+50,y);
      ctx.stroke();
    }
    ctx.globalAlpha=1;
    ctx.fillStyle=C.road; ctx.fillRect(48,92,855,420);
    ctx.fillStyle='#FFF9DF'; ctx.fillRect(60,104,831,396);
    ctx.strokeStyle='#D8B979'; ctx.lineWidth=3; ctx.setLineDash([12,11]);
    ctx.beginPath();ctx.moveTo(282,112);ctx.lineTo(282,488);ctx.moveTo(74,468);ctx.lineTo(875,468);ctx.stroke();ctx.setLineDash([]);
    for(const b of blocks){
      GF.Draw.roundRect(ctx,b.x+5,b.y+7,b.w,b.h,13,'rgba(22,56,92,.22)');
      GF.Draw.roundRect(ctx,b.x,b.y,b.w,b.h,13,b.color);
      ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(b.x+13,b.y+13,b.w-26,9);
      GF.Draw.text(ctx,b.label,b.x+b.w/2,b.y+b.h/2,{size:13,color:C.ink,weight:'800'});
    }
    for(let i=0;i<stops.length;i++){
      const s=stops[i],on=i===this.delivery;
      ctx.globalAlpha=on?1:.38; ctx.strokeStyle=s.color;ctx.lineWidth=on?5:3;
      ctx.beginPath();ctx.arc(s.target.x,s.target.y,on?32:23,0,GF.math.TAU);ctx.stroke();
      ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(s.target.x,s.target.y,13,0,GF.math.TAU);ctx.fill();
      GF.Draw.text(ctx,s.icon,s.target.x,s.target.y+1,{size:13,color:'#fff'});
      if(on)GF.Draw.text(ctx,s.name,s.target.x,s.target.y-43,{size:14,color:C.ink,weight:'800'});
      ctx.globalAlpha=1;
    }
    const s=stops[this.delivery];
    if(s&&!this.carry){
      const q=s.parcel,sc=1+Math.sin(game.time*6)*.1;
      ctx.save();ctx.translate(q.x,q.y);ctx.scale(sc,sc);GF.Draw.roundRect(ctx,-16,-13,32,26,4,s.color);ctx.fillStyle=C.cream;ctx.fillRect(-11,-3,22,4);ctx.restore();
      GF.Draw.text(ctx,'PARCEL',q.x,q.y-27,{size:11,color:C.ink});
    }
    if(s){
      const o=this.objective(),p=this.p;let dx=o.x-p.x,dy=o.y-p.y,dl=Math.hypot(dx,dy)||1;dx/=dl;dy/=dl;
      const ex=480+dx*432,ey=305+dy*190;
      ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(ex,ey,11+Math.sin(game.time*5)*2,0,GF.math.TAU);ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(ex+dx*14,ey+dy*14);ctx.lineTo(ex-dy*8,ey+dx*8);ctx.lineTo(ex+dy*8,ey-dx*8);ctx.fill();
    }
    const p=this.p;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);
    ctx.fillStyle='rgba(22,56,92,.2)';ctx.beginPath();ctx.ellipse(-2,8,22,10,0,0,GF.math.TAU);ctx.fill();
    ctx.strokeStyle=C.ink;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-14,0);ctx.lineTo(14,0);ctx.stroke();
    ctx.fillStyle=C.navy;ctx.beginPath();ctx.arc(-13,0,7,0,GF.math.TAU);ctx.arc(14,0,7,0,GF.math.TAU);ctx.fill();
    GF.Draw.roundRect(ctx,-8,-10,22,18,7,C.water);ctx.fillStyle=C.cream;ctx.fillRect(7,-6,10,4);
    if(this.carry)GF.Draw.roundRect(ctx,-17,-14,13,12,2,s.color);
    ctx.restore();

    GF.Draw.roundRect(ctx,16,10,178,45,10,'rgba(22,56,92,.94)');
    GF.Draw.text(ctx,'TIDE-CLOCK',29,25,{size:11,color:C.cream,align:'left'});
    GF.Draw.text(ctx,Math.ceil(this.timer)+'s',180,37,{size:24,color:this.timer<6?C.coral:'#fff',align:'right'});
    GF.Draw.roundRect(ctx,210,10,202,45,10,'rgba(22,56,92,.94)');
    GF.Draw.text(ctx,this.carry?'DELIVER TO':'PICK UP FOR',223,25,{size:10,color:C.cream,align:'left'});
    GF.Draw.text(ctx,s?s.name:'Complete',{size:15,color:s?s.color:'#fff',align:'left'},0,0);
    GF.Draw.text(ctx,s?s.name:'Complete',223,40,{size:15,color:s?s.color:'#fff',align:'left'});
    GF.Draw.roundRect(ctx,550,10,174,45,10,'rgba(22,56,92,.94)');
    GF.Draw.text(ctx,'DELIVERIES',563,25,{size:10,color:C.cream,align:'left'});
    GF.Draw.text(ctx,this.delivery+' / 3',710,37,{size:21,color:'#fff',align:'right'});
    GF.Draw.roundRect(ctx,432,10,103,45,10,'rgba(22,56,92,.94)');
    GF.Draw.text(ctx,'SCORE',483,23,{size:10,color:C.cream});
    if(this.noticeT>0)GF.Draw.text(ctx,this.notice,480,520,{size:16,color:C.ink,weight:'800'});
    GF.Draw.vignette(ctx,W,H,.14);
  }
};

game.add('play',play);
game.titleScreen({subtitle:'Arrow Keys / WASD drive • Pick up parcels • Deliver before the tide-clock'});

</script>
