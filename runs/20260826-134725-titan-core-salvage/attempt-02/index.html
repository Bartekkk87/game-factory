<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Titan Core: Salvage</title>
<style>
html,body{margin:0;height:100%;background:#000;display:grid;place-items:center;overflow:hidden}
canvas{image-rendering:auto}
body{margin:0;background:#0d131a;overflow:hidden;display:flex;align-items:center;justify-content:center;height:100vh;font-family:system-ui,sans-serif;}canvas{display:block;box-shadow:0 0 24px rgba(0,240,255,0.2);}
</style>
</head>
<body>

<script>
(function () {
  'use strict';
  const VERSION = '1.0.0';
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  const pick = (arr) => arr[(Math.random() * arr.length) | 0];
  const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
  const TAU = Math.PI * 2;
  function makeRng(seed) {
    let s = seed >>> 0 || 1;
    return function () {
      s ^= s << 13;
      s ^= s >>> 17;
      s ^= s << 5;
      s >>>= 0;
      return s / 4294967296;
    };
  }
  const Eases = {
    linear: (t) => t,
    outCubic: (t) => 1 - Math.pow(1 - t, 3),
    inCubic: (t) => t * t * t,
    outQuad: (t) => 1 - (1 - t) * (1 - t),
    outBack: (t) => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
    outElastic: (t) =>
      t === 0 || t === 1 ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * ((2 * Math.PI) / 3)) + 1
  };

  const Sfx = {
    ctx: null,
    master: null,
    muted: false,
    ensure() {
      if (this.ctx || this.muted) return;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.5;
        this.master.connect(this.ctx.destination);
      } catch (e) {}
    },
    resume() {
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    beep({ freq = 440, to = null, dur = 0.15, type = 'square', vol = 0.4, delay = 0 } = {}) {
      if (!this.ctx || this.muted) return;
      const t = this.ctx.currentTime + delay;
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(this.master);
      o.start(t);
      o.stop(t + dur + 0.02);
    },
    noise({ dur = 0.2, vol = 0.3, freq = 1200, delay = 0 } = {}) {
      if (!this.ctx || this.muted) return;
      const t = this.ctx.currentTime + delay;
      const len = Math.max(1, (dur * this.ctx.sampleRate) | 0);
      const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = this.ctx.createBufferSource();
      src.buffer = buf;
      const f = this.ctx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = freq;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f).connect(g).connect(this.master);
      src.start(t);
    },
    melody(notes, { type = 'square', vol = 0.35 } = {}) {
      let delay = 0;
      for (const [freq, dur] of notes) {
        this.beep({ freq, dur: dur * 0.95, type, vol, delay });
        delay += dur;
      }
    }
  };

  class Input {
    constructor(canvas) {
      this.keys = Object.create(null);
      this._edge = Object.create(null);
      this.pointer = { x: 0, y: 0, down: false, clicked: false };
      this._anyAction = [];
      const kd = (e) => {
        if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
        if (!this.keys[e.code]) this._edge[e.code] = true;
        this.keys[e.code] = true;
        Sfx.ensure();
        Sfx.resume();
        for (const fn of this._anyAction) fn(e.code);
      };
      const ku = (e) => {
        this.keys[e.code] = false;
      };
      window.addEventListener('keydown', kd);
      window.addEventListener('keyup', ku);
      const toLocal = (e) => {
        const r = canvas.getBoundingClientRect();
        return {
          x: ((e.clientX - r.left) / r.width) * canvas._lw,
          y: ((e.clientY - r.top) / r.height) * canvas._lh
        };
      };
      canvas.addEventListener('pointermove', (e) => {
        Object.assign(this.pointer, toLocal(e));
      });
      canvas.addEventListener('pointerdown', (e) => {
        Sfx.ensure();
        Sfx.resume();
        Object.assign(this.pointer, toLocal(e));
        this.pointer.down = true;
        this.pointer.clicked = true;
        for (const fn of this._anyAction) fn('PointerDown');
      });
      window.addEventListener('pointerup', () => {
        this.pointer.down = false;
      });
    }
    pressed(code) {
      return !!this._edge[code];
    }
    onAnyInput(fn) {
      this._anyAction.push(fn);
    }
    _endFrame() {
      this._edge = Object.create(null);
      this.pointer.clicked = false;
    }
  }

  class Particles {
    constructor(cap = 700) {
      this.pool = Array.from({ length: cap }, () => ({ active: false }));
    }
    emit(x, y, { count = 10, speed = 120, size = 4, life = 0.6, colors = ['#fff'], gravity = 200, spread = TAU, dir = 0 } = {}) {
      let made = 0;
      for (const p of this.pool) {
        if (p.active) continue;
        const a = dir + (spread === TAU ? rand(TAU) : rand(-spread / 2, spread / 2));
        const v = speed * rand(0.4, 1);
        p.active = true;
        p.x = x;
        p.y = y;
        p.vx = Math.cos(a) * v;
        p.vy = Math.sin(a) * v;
        p.life = p.maxLife = life * rand(0.6, 1.2);
        p.size = size * rand(0.6, 1.4);
        p.color = pick(colors);
        p.gravity = gravity;
        if (++made >= count) break;
      }
    }
    update(dt) {
      for (const p of this.pool) {
        if (!p.active) continue;
        p.life -= dt;
        if (p.life <= 0) {
          p.active = false;
          continue;
        }
        p.vy += p.gravity * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
      }
    }
    draw(ctx) {
      for (const p of this.pool) {
        if (!p.active) continue;
        ctx.globalAlpha = clamp(p.life / p.maxLife, 0, 1);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, TAU);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }

  class Tweens {
    constructor() {
      this.list = [];
    }
    add(obj, props, dur, ease = 'outCubic', onDone = null) {
      const from = {};
      for (const k of Object.keys(props)) from[k] = obj[k];
      this.list.push({ obj, props, from, t: 0, dur, ease: Eases[ease] || Eases.outCubic, onDone });
    }
    update(dt) {
      for (let i = this.list.length - 1; i >= 0; i--) {
        const tw = this.list[i];
        tw.t += dt;
        const k = clamp(tw.t / tw.dur, 0, 1);
        const e = tw.ease(k);
        for (const key of Object.keys(tw.props)) {
          tw.obj[key] = lerp(tw.from[key], tw.props[key], e);
        }
        if (k >= 1) {
          this.list.splice(i, 1);
          if (tw.onDone) tw.onDone();
        }
      }
    }
  }

  const Draw = {
    text(ctx, str, x, y, { size = 24, color = '#fff', align = 'center', baseline = 'middle', weight = '800', font = 'system-ui, sans-serif' } = {}) {
      ctx.fillStyle = color;
      ctx.textAlign = align;
      ctx.textBaseline = baseline;
      ctx.font = `${weight} ${size}px ${font}`;
      ctx.fillText(str, x, y);
    },
    roundRect(ctx, x, y, w, h, r, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h);
      ctx.fill();
    },
    vignette(ctx, w, h, strength = 0.35) {
      const g = ctx.createRadialGradient(w / 2, h / 2, h * 0.4, w / 2, h / 2, h * 0.85);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, `rgba(0,0,0,${strength})`);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
    }
  };

  class Game {
    constructor({ id = 'gf-game', title = 'Untitled', width = 960, height = 540, palette = ['#7c5cff', '#00e0ff', '#ff5c8a', '#ffd166'], background = '#0b0e1a', seed = Date.now() % 100000 } = {}) {
      this.id = id;
      this.title = title;
      this.W = width;
      this.H = height;
      this.palette = palette;
      this.background = background;
      this.rng = makeRng(seed);
      this.scenes = {};
      this.sceneName = null;
      this.state = 'boot';
      this.score = 0;
      this.best = Number(localStorage.getItem('gf-best-' + id) || 0);
      this.time = 0;
      this.shakeMag = 0;
      this.shakeDur = 0;
      this.flashAlpha = 0;
      this.flashColor = '#ffffff';
      this.hitStop = 0;
      this._fpsFrames = 0;
      this._fpsTime = 0;
      this.fps = 60;
      this.particles = new Particles();
      this.tweens = new Tweens();
      this.probeErrors = [];

      const canvas = document.createElement('canvas');
      canvas.id = 'game';
      document.body.appendChild(canvas);
      this.canvas = canvas;
      canvas._lw = this.W;
      canvas._lh = this.H;
      const fit = () => {
        const s = Math.min(window.innerWidth / this.W, window.innerHeight / this.H);
        canvas.style.width = Math.floor(this.W * s) + 'px';
        canvas.style.height = Math.floor(this.H * s) + 'px';
      };
      window.addEventListener('resize', fit);
      fit();

      const ctx = canvas.getContext('2d');
      this.ctx = ctx;

      this.input = new Input(canvas);
      this.input.onAnyInput(() => {
        if (this.state === 'title' && this._titleStart) this._startFromTitle();
        else if ((this.state === 'gameover' || this.state === 'won') && this.time > 0.8) this.restart();
      });

      window.addEventListener('error', (e) => this._err(e.message));
      window.addEventListener('unhandledrejection', (e) => this._err(String(e.reason)));

      window.__GF__ = {
        version: VERSION,
        info: { title, id, engine: VERSION },
        errors: this.probeErrors,
        getState: () => this.state,
        getScore: () => this.score,
        getBest: () => this.best,
        getFps: () => this.fps,
        getTime: () => this.time,
        flags: {},
        restart: () => this.restart()
      };

      let last = performance.now();
      const frame = (now) => {
        requestAnimationFrame(frame);
        let dt = (now - last) / 1000;
        last = now;
        dt = Math.min(dt, 0.1);
        this._fpsFrames++;
        this._fpsTime += dt;
        if (this._fpsTime >= 0.5) {
          this.fps = Math.round(this._fpsFrames / this._fpsTime);
          this._fpsFrames = 0;
          this._fpsTime = 0;
        }
        this._update(dt);
        this._draw(ctx);
        this.input._endFrame();
      };
      requestAnimationFrame(frame);
    }

    _err(msg) {
      if (this.probeErrors.length < 25 && !this.probeErrors.includes(msg)) this.probeErrors.push(String(msg));
    }

    add(name, scene) {
      scene.name = name;
      scene.game = this;
      this.scenes[name] = scene;
      return scene;
    }
    go(name) {
      const next = this.scenes[name];
      if (!next) return this._err('unknown scene: ' + name);
      this.sceneName = name;
      this.state = name === 'title' ? 'title' : 'playing';
      if (next.init) next.init();
      if (next.reset) next.reset();
      this.time = 0;
    }
    titleScreen({ subtitle = 'Press any key', onStart = null } = {}) {
      this._titleStart = onStart || (() => this.go(this._firstPlayScene()));
      this.state = 'title';
      this._subtitle = subtitle;
    }
    _firstPlayScene() {
      const names = Object.keys(this.scenes);
      return names.find((n) => n !== 'title') || names[0];
    }
    _startFromTitle() {
      Sfx.ensure();
      Sfx.resume();
      Sfx.beep({ freq: 520, to: 780, dur: 0.12, type: 'triangle', vol: 0.35 });
      this._titleStart();
    }
    addScore(n = 1) {
      if (this.state !== 'playing') return;
      this.score += n;
      if (this.score > this.best) {
        this.best = this.score;
        localStorage.setItem('gf-best-' + this.id, String(this.best));
      }
    }
    shake(mag = 6, dur = 0.3) {
      this.shakeMag = mag;
      this.shakeDur = dur;
    }
    flash(color = '#ffffff', alpha = 0.5) {
      this.flashColor = color;
      this.flashAlpha = alpha;
    }
    burst(x, y, opts) {
      this.particles.emit(x, y, opts);
    }
    hitStop(dur = 0.06) {
      this.hitStop = Math.max(this.hitStop, dur);
    }
    gameOver({ message = 'GAME OVER' } = {}) {
      if (this.state !== 'playing') return;
      this.state = 'gameover';
      this._endMessage = message;
      this.shake(9, 0.45);
      Sfx.melody([[392, 0.12], [330, 0.12], [262, 0.2]]);
    }
    win({ message = 'YOU WIN!' } = {}) {
      if (this.state !== 'playing') return;
      this.state = 'won';
      this._endMessage = message;
      Sfx.melody([[523, 0.1], [659, 0.1], [784, 0.18]], { type: 'triangle' });
    }
    restart() {
      this.score = 0;
      this.time = 0;
      this.particles = new Particles();
      this.tweens = new Tweens();
      const sc = this.scenes[this.sceneName];
      this.state = 'playing';
      if (sc && sc.reset) sc.reset();
      else if (sc && sc.init) sc.init();
      Sfx.beep({ freq: 660, dur: 0.08, vol: 0.3 });
    }

    _update(dtRaw) {
      this.tweens.update(dtRaw);
      if (this.shakeDur > 0) this.shakeDur -= dtRaw;
      if (this.flashAlpha > 0) this.flashAlpha = Math.max(0, this.flashAlpha - dtRaw * 2.5);
      if (this.state !== 'playing') return;
      if (this.hitStop > 0) {
        this.hitStop -= dtRaw;
        return;
      }
      const dt = Math.min(dtRaw, 1 / 20);
      this.time += dt;
      const sc = this.scenes[this.sceneName];
      if (sc && sc.update) sc.update(dt);
      this.particles.update(dt);
    }

    _draw(ctx) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = this.background;
      ctx.fillRect(0, 0, this.W, this.H);
      let sx = 0;
      let sy = 0;
      if (this.shakeDur > 0) {
        sx = rand(-this.shakeMag, this.shakeMag);
        sy = rand(-this.shakeMag, this.shakeMag);
      }
      ctx.translate(sx, sy);
      const sc = this.scenes[this.sceneName];
      if (sc && sc.draw) sc.draw(ctx);
      this.particles.draw(ctx);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      if (this.state === 'title') {
        ctx.fillStyle = 'rgba(5,8,16,0.55)';
        ctx.fillRect(0, 0, this.W, this.H);
        Draw.text(ctx, this.title, this.W / 2, this.H / 2 - 40, { size: 56, color: this.palette[0] });
        Draw.text(ctx, this._subtitle || '', this.W / 2, this.H / 2 + 24, { size: 22, color: '#dfe6ff', weight: '600' });
        Draw.text(ctx, 'BEST ' + this.best, this.W / 2, this.H - 40, { size: 18, color: '#8fa3d9', weight: '600' });
      } else if (this.state === 'gameover' || this.state === 'won') {
        ctx.fillStyle = this.state === 'won' ? 'rgba(10,30,20,0.55)' : 'rgba(30,5,15,0.55)';
        ctx.fillRect(0, 0, this.W, this.H);
        Draw.text(ctx, this._endMessage || (this.state === 'won' ? 'YOU WIN!' : 'GAME OVER'), this.W / 2, this.H / 2 - 50, { size: 52, color: this.state === 'won' ? '#7dffb2' : '#ff7d9c' });
        Draw.text(ctx, 'SCORE ' + this.score, this.W / 2, this.H / 2 + 12, { size: 30, color: '#fff' });
        Draw.text(ctx, 'BEST ' + this.best, this.W / 2, this.H / 2 + 52, { size: 20, color: '#cdd6f4' });
        Draw.text(ctx, 'Click / press R to retry', this.W / 2, this.H / 2 + 96, { size: 17, color: '#9fb0d8', weight: '600' });
      } else {
        Draw.text(ctx, String(this.score), this.W / 2, 44, { size: 34, color: 'rgba(255,255,255,0.92)' });
        Draw.text(ctx, 'BEST ' + this.best, this.W - 20, 30, { size: 15, color: 'rgba(255,255,255,0.55)', align: 'right', weight: '700' });
      }
      if (this.flashAlpha > 0) {
        ctx.globalAlpha = this.flashAlpha;
        ctx.fillStyle = this.flashColor;
        ctx.fillRect(0, 0, this.W, this.H);
        ctx.globalAlpha = 1;
      }
    }
  }

  window.GF = { VERSION, Game, Input, Particles, Tweens, Draw, Sfx, math: { clamp, lerp, rand, randInt, pick, dist, TAU, makeRng }, Eases };
})();

</script>
<script>
const game = new GF.Game({
  id: 'titan-core-salvage',
  title: 'TITAN CORE: SALVAGE',
  width: 960,
  height: 540,
  palette: ['#0d131a', '#00f0ff', '#ff4400', '#ffc800'],
  background: '#0d131a'
});

game.hitStop = function(dur = 0.06) {
  const sc = this.scenes[this.sceneName];
  if (sc) sc.freezeTimer = Math.max(sc.freezeTimer || 0, dur);
};

game.add('play', {
  init() {
    this.reset();
  },
  reset() {
    this.modal = null;
    this.modalTimer = 0;
    this.salvageItem = null;
    this.freezeTimer = 0;
    this.px = 220;
    this.py = 270;
    this.php = 100;
    this.pMaxHp = 100;
    this.dashTimer = 0;
    this.dashCd = 0;
    this.fireCd = 0;
    this.damageMult = 1;
    this.level = 1;
    this.bullets = [];
    this.telegraphs = [];
    this.embers = Array.from({ length: 30 }, () => ({
      x: GF.math.rand(960),
      y: GF.math.rand(540),
      vx: GF.math.rand(-25, 25),
      vy: GF.math.rand(-35, -10),
      sz: GF.math.rand(1, 3.5),
      alpha: GF.math.rand(0.3, 0.85)
    }));
    this.spawnTitan();
  },

  spawnTitan() {
    const hpM = 1 + (this.level - 1) * 0.45;
    this.titan = {
      x: 700,
      y: 270,
      attackCd: 1.0,
      subsystems: [
        { id: 'weapon', name: 'PLASMA CANNON', hp: 80 * hpM, maxHp: 80 * hpM, ox: -42, oy: -55, r: 24, destroyed: false, col: '#ff4400' },
        { id: 'shield', name: 'FORGE SHIELD', hp: 75 * hpM, maxHp: 75 * hpM, ox: -42, oy: 55, r: 22, destroyed: false, col: '#ffc800' },
        { id: 'core', name: 'TITAN REACTOR', hp: 200 * hpM, maxHp: 200 * hpM, ox: 0, oy: 0, r: 38, destroyed: false, col: '#00f0ff' }
      ]
    };
  },

  update(dt) {
    if (this.freezeTimer > 0) {
      this.freezeTimer -= dt;
      return;
    }

    for (const e of this.embers) {
      e.x += e.vx * dt;
      e.y += e.vy * dt;
      if (e.x < 0) e.x = 960;
      if (e.x > 960) e.x = 0;
      if (e.y < 0) e.y = 540;
    }

    if (this.modal) {
      this.updateModalInput(dt);
      return;
    }

    if (this.dashTimer > 0) this.dashTimer -= dt;
    if (this.dashCd > 0) this.dashCd -= dt;
    if (this.fireCd > 0) this.fireCd -= dt;

    let dx = 0, dy = 0;
    const keys = game.input.keys;
    if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) dx += 1;
    if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
    if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }

    if (game.input.pressed('Space') && this.dashCd <= 0) {
      this.dashTimer = 0.25;
      this.dashCd = 0.65;
      GF.Sfx.noise({ dur: 0.12, vol: 0.25, freq: 900 });
      game.burst(this.px, this.py, { count: 14, speed: 130, colors: ['#00f0ff', '#ffffff'], gravity: 0 });
    }

    const moveSpd = (this.dashTimer > 0 ? 540 : 230);
    this.px = GF.math.clamp(this.px + dx * moveSpd * dt, 40, 920);
    this.py = GF.math.clamp(this.py + dy * moveSpd * dt, 40, 500);

    const ptr = game.input.pointer;
    const isPrimaryFiring = ptr.down || ptr.clicked;
    const isMoving = dx !== 0 || dy !== 0;

    if ((isPrimaryFiring || isMoving) && this.fireCd <= 0) {
      this.fireCd = 0.13;
      let targetX = ptr.x;
      let targetY = ptr.y;
      if (!isPrimaryFiring) {
        let targetSub = this.titan.subsystems.find(s => !s.destroyed) || this.titan.subsystems[2];
        targetX = this.titan.x + targetSub.ox;
        targetY = this.titan.y + targetSub.oy;
      }
      const angle = Math.atan2(targetY - this.py, targetX - this.px);
      this.bullets.push({
        x: this.px,
        y: this.py,
        vx: Math.cos(angle) * 780,
        vy: Math.sin(angle) * 780,
        life: 1.2,
        damage: 15 * this.damageMult
      });
      GF.Sfx.beep({ freq: 540, to: 200, dur: 0.06, type: 'sawtooth', vol: 0.18 });
    }

    for (let i = this.bullets.length - 1; i >= 0; i--) {
      const b = this.bullets[i];
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.life -= dt;
      let hit = false;
      for (const sub of this.titan.subsystems) {
        if (sub.destroyed) continue;
        const sx = this.titan.x + sub.ox;
        const sy = this.titan.y + sub.oy;
        if (GF.math.dist(b.x, b.y, sx, sy) < sub.r + 8) {
          hit = true;
          sub.hp -= b.damage;
          game.addScore(10);
          game.burst(b.x, b.y, { count: 6, colors: ['#ffc800', '#ff4400'], speed: 110, gravity: 0 });
          GF.Sfx.beep({ freq: 170, dur: 0.04, vol: 0.12 });

          if (sub.hp <= 0) {
            sub.destroyed = true;
            game.addScore(250);
            game.hitStop(0.08);
            game.shake(8, 0.35);
            game.burst(sx, sy, { count: 32, colors: ['#ffc800', '#ff4400', '#00f0ff'], speed: 220, gravity: 40 });
            GF.Sfx.noise({ dur: 0.3, vol: 0.4, freq: 400 });
            this.modalTimer = 0;
            if (sub.id === 'core') {
              this.modal = 'extraction';
            } else {
              this.modal = 'salvage';
              this.salvageItem = sub;
            }
          }
          break;
        }
      }
      if (hit || b.life <= 0 || b.x < 0 || b.x > 960 || b.y < 0 || b.y > 540) {
        this.bullets.splice(i, 1);
      }
    }

    const wpnDestroyed = this.titan.subsystems[0].destroyed;
    const coreHpRatio = this.titan.subsystems[2].hp / this.titan.subsystems[2].maxHp;
    const enraged = coreHpRatio < 0.45 && !this.titan.subsystems[2].destroyed;

    this.titan.attackCd -= dt * (enraged ? 1.6 : 1.0) * (wpnDestroyed ? 0.65 : 1.0);
    if (this.titan.attackCd <= 0 && !this.titan.subsystems[2].destroyed) {
      this.titan.attackCd = GF.math.rand(1.7, 2.7);
      const atkType = GF.math.randInt(0, 2);
      if (atkType === 0) {
        const angle = Math.atan2(this.py - this.titan.y, this.px - this.titan.x);
        this.telegraphs.push({
          type: 'beam', x: this.titan.x, y: this.titan.y,
          angle: angle, len: 800, w: 34, timer: 0, maxTimer: enraged ? 0.65 : 0.95,
          dmg: 18
        });
      } else if (atkType === 1) {
        const angle = Math.atan2(this.py - this.titan.y, this.px - this.titan.x);
        this.telegraphs.push({
          type: 'cone', x: this.titan.x, y: this.titan.y,
          angle: angle, r: 440, spread: 0.85, timer: 0, maxTimer: enraged ? 0.75 : 1.1,
          dmg: 22
        });
      } else {
        this.telegraphs.push({
          type: 'ring', x: this.px + GF.math.rand(-35, 35), y: this.py + GF.math.rand(-35, 35),
          r: 58, timer: 0, maxTimer: enraged ? 0.65 : 1.0,
          dmg: 20
        });
      }
      GF.Sfx.beep({ freq: 220, to: 440, dur: 0.14, type: 'triangle', vol: 0.2 });
    }

    for (let i = this.telegraphs.length - 1; i >= 0; i--) {
      const t = this.telegraphs[i];
      t.timer += dt;
      if (t.timer >= t.maxTimer) {
        game.shake(6, 0.25);
        let hitPlayer = false;
        if (this.dashTimer <= 0) {
          if (t.type === 'ring') {
            if (GF.math.dist(this.px, this.py, t.x, t.y) < t.r) hitPlayer = true;
          } else if (t.type === 'beam') {
            const dx = Math.cos(t.angle), dy = Math.sin(t.angle);
            const px = this.px - t.x, py = this.py - t.y;
            const proj = px * dx + py * dy;
            if (proj >= 0 && proj <= t.len) {
              const perpDist = Math.abs(-px * dy + py * dx);
              if (perpDist < t.w / 2 + 12) hitPlayer = true;
            }
          } else if (t.type === 'cone') {
            const d = GF.math.dist(this.px, this.py, t.x, t.y);
            if (d < t.r) {
              let a = Math.atan2(this.py - t.y, this.px - t.x) - t.angle;
              while (a < -Math.PI) a += Math.PI * 2;
              while (a > Math.PI) a -= Math.PI * 2;
              if (Math.abs(a) < t.spread / 2) hitPlayer = true;
            }
          }
        }

        if (hitPlayer) {
          this.php -= t.dmg;
          game.flash('#ff4400', 0.45);
          game.shake(9, 0.3);
          GF.Sfx.noise({ dur: 0.2, vol: 0.4, freq: 250 });
          if (this.php <= 0) {
            this.php = 0;
            game.gameOver({ message: 'TITAN OVERWHELMED CORE' });
          }
        }
        game.burst(t.x, t.y, { count: 18, colors: ['#ff4400', '#ffc800'], speed: 180, gravity: 0 });
        GF.Sfx.noise({ dur: 0.15, vol: 0.3, freq: 500 });
        this.telegraphs.splice(i, 1);
      }
    }
  },

  updateModalInput(dt) {
    this.modalTimer += dt;
    const ptr = game.input.pointer;
    const keys = game.input.keys;

    if (this.modal === 'salvage') {
      let choice = -1;
      if (game.input.pressed('Digit1') || keys['KeyI'] || keys['KeyA']) choice = 0;
      else if (game.input.pressed('Digit2') || keys['KeyS'] || keys['KeyW']) choice = 1;
      else if (game.input.pressed('Digit3') || keys['KeyD'] || keys['Space']) choice = 2;
      else if (ptr.clicked) {
        if (ptr.y >= 310 && ptr.y <= 370) {
          if (ptr.x >= 220 && ptr.x <= 380) choice = 0;
          else if (ptr.x >= 400 && ptr.x <= 560) choice = 1;
          else if (ptr.x >= 580 && ptr.x <= 740) choice = 2;
        } else {
          choice = 1;
        }
      } else if (this.modalTimer > 1.8) {
        choice = 1;
      }

      if (choice === 0) {
        this.damageMult += 0.35;
        this.php = Math.min(this.pMaxHp, this.php + 20);
        game.flash('#00f0ff', 0.5);
        GF.Sfx.beep({ freq: 440, to: 880, dur: 0.2, type: 'triangle', vol: 0.4 });
        this.modal = null;
      } else if (choice === 1) {
        game.addScore(500);
        game.flash('#ffc800', 0.4);
        GF.Sfx.melody([[523, 0.08], [659, 0.1], [784, 0.12]]);
        this.modal = null;
      } else if (choice === 2) {
        this.php = Math.min(this.pMaxHp, this.php + 50);
        game.flash('#00f0ff', 0.3);
        GF.Sfx.beep({ freq: 300, to: 600, dur: 0.18, vol: 0.3 });
        this.modal = null;
      }
    } else if (this.modal === 'extraction') {
      let choice = -1;
      if (game.input.pressed('KeyE') || game.input.pressed('Digit1') || keys['KeyA']) choice = 0;
      else if (game.input.pressed('KeyV') || game.input.pressed('Digit2') || keys['KeyD']) choice = 1;
      else if (ptr.clicked) {
        if (ptr.y >= 310 && ptr.y <= 370) {
          if (ptr.x >= 280 && ptr.x <= 450) choice = 0;
          else if (ptr.x >= 510 && ptr.x <= 680) choice = 1;
        } else {
          choice = 0;
        }
      } else if (this.modalTimer > 2.0) {
        choice = 0;
      }

      if (choice === 0) {
        game.addScore(1000);
        game.win({ message: 'TITAN DISMANTLED & EXTRACTED!' });
      } else if (choice === 1) {
        this.level++;
        this.modal = null;
        this.spawnTitan();
        game.flash('#ff4400', 0.4);
        GF.Sfx.beep({ freq: 200, to: 600, dur: 0.25, type: 'sawtooth' });
      }
    }
  },

  draw(ctx) {
    const bgGrad = ctx.createLinearGradient(0, 0, 960, 540);
    bgGrad.addColorStop(0, '#0a1018');
    bgGrad.addColorStop(1, '#131e2b');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, 960, 540);

    ctx.strokeStyle = 'rgba(0, 240, 255, 0.08)';
    ctx.lineWidth = 1;
    for (let x = 0; x < 960; x += 40) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 540); ctx.stroke();
    }
    for (let y = 0; y < 540; y += 40) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(960, y); ctx.stroke();
    }

    for (const e of this.embers) {
      ctx.fillStyle = `rgba(255, 200, 0, ${e.alpha})`;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.sz, 0, Math.PI * 2); ctx.fill();
    }

    for (const t of this.telegraphs) {
      const progress = t.timer / t.maxTimer;
      ctx.save();
      if (t.type === 'ring') {
        ctx.fillStyle = 'rgba(255, 68, 0, 0.25)';
        ctx.strokeStyle = '#ff4400'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = 'rgba(255, 200, 0, 0.45)';
        ctx.beginPath(); ctx.arc(t.x, t.y, t.r * progress, 0, Math.PI * 2); ctx.fill();
      } else if (t.type === 'beam') {
        ctx.translate(t.x, t.y); ctx.rotate(t.angle);
        ctx.fillStyle = 'rgba(255, 68, 0, 0.25)'; ctx.strokeStyle = '#ff4400'; ctx.lineWidth = 2;
        ctx.fillRect(0, -t.w / 2, t.len, t.w); ctx.strokeRect(0, -t.w / 2, t.len, t.w);
        ctx.fillStyle = 'rgba(255, 200, 0, 0.5)';
        ctx.fillRect(0, -t.w / 2 * progress, t.len, t.w * progress);
      } else if (t.type === 'cone') {
        ctx.translate(t.x, t.y);
        ctx.fillStyle = 'rgba(255, 68, 0, 0.25)'; ctx.strokeStyle = '#ff4400'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(0, 0);
        ctx.arc(0, 0, t.r, t.angle - t.spread / 2, t.angle + t.spread / 2);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = 'rgba(255, 200, 0, 0.45)';
        ctx.beginPath(); ctx.moveTo(0, 0);
        ctx.arc(0, 0, t.r * progress, t.angle - t.spread / 2, t.angle + t.spread / 2);
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }

    if (this.titan) {
      ctx.fillStyle = '#162332'; ctx.strokeStyle = '#00f0ff'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(this.titan.x, this.titan.y, 60, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = '#ff4400'; ctx.lineWidth = 4;
      for (const sub of this.titan.subsystems) {
        if (sub.destroyed) continue;
        ctx.beginPath(); ctx.moveTo(this.titan.x, this.titan.y);
        ctx.lineTo(this.titan.x + sub.ox, this.titan.y + sub.oy); ctx.stroke();
      }
      for (const sub of this.titan.subsystems) {
        const sx = this.titan.x + sub.ox;
        const sy = this.titan.y + sub.oy;
        if (sub.destroyed) {
          ctx.fillStyle = '#222d3a';
          ctx.beginPath(); ctx.arc(sx, sy, sub.r * 0.7, 0, Math.PI * 2); ctx.fill();
          continue;
        }
        ctx.fillStyle = '#0d1520'; ctx.strokeStyle = sub.col; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(sx, sy, sub.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = sub.col;
        ctx.beginPath(); ctx.arc(sx, sy, sub.r * 0.5, 0, Math.PI * 2); ctx.fill();
        const hpPct = Math.max(0, sub.hp / sub.maxHp);
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(sx, sy, sub.r + 5, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * hpPct);
        ctx.stroke();
      }
    }

    for (const b of this.bullets) {
      ctx.fillStyle = '#00f0ff';
      ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI * 2); ctx.fill();
    }

    ctx.save();
    ctx.translate(this.px, this.py);
    if (this.dashTimer > 0) {
      ctx.strokeStyle = '#00f0ff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.fillStyle = '#101e2c'; ctx.strokeStyle = '#00f0ff'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#00f0ff';
    ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.fill();
    const ptr = game.input.pointer;
    const pAngle = Math.atan2(ptr.y - this.py, ptr.x - this.px);
    ctx.rotate(pAngle);
    ctx.fillStyle = '#00f0ff';
    ctx.fillRect(10, -3, 14, 6);
    ctx.restore();

    ctx.strokeStyle = '#00f0ff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(ptr.x, ptr.y, 10, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ptr.x - 14, ptr.y); ctx.lineTo(ptr.x + 14, ptr.y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ptr.x, ptr.y - 14); ctx.lineTo(ptr.x, ptr.y + 14); ctx.stroke();

    GF.Draw.roundRect(ctx, 20, 20, 220, 20, 4, 'rgba(13, 19, 26, 0.85)');
    const pHealthPct = Math.max(0, this.php / this.pMaxHp);
    GF.Draw.roundRect(ctx, 22, 22, 216 * pHealthPct, 16, 3, '#00f0ff');
    GF.Draw.text(ctx, `CORE INTEGRITY ${Math.ceil(this.php)}%`, 25, 50, { size: 13, color: '#00f0ff', align: 'left' });
    GF.Draw.text(ctx, `SECTOR ${this.level} TITAN`, 940, 25, { size: 14, color: '#ffc800', align: 'right' });

    if (this.modal === 'salvage' && this.salvageItem) {
      ctx.fillStyle = 'rgba(13, 19, 26, 0.88)';
      ctx.fillRect(0, 0, 960, 540);
      GF.Draw.roundRect(ctx, 180, 120, 600, 300, 12, '#121d28');
      ctx.strokeStyle = '#00f0ff'; ctx.lineWidth = 3;
      ctx.strokeRect(180, 120, 600, 300);
      GF.Draw.text(ctx, 'COMPONENT SEVERED!', 480, 160, { size: 28, color: '#ffc800', weight: '900' });
      GF.Draw.text(ctx, `SALVAGED: ${this.salvageItem.name}`, 480, 200, { size: 20, color: '#00f0ff' });
      GF.Draw.text(ctx, 'SELECT SALVAGE DIRECTIVE:', 480, 250, { size: 16, color: '#ffffff' });

      GF.Draw.roundRect(ctx, 220, 310, 160, 60, 6, '#00f0ff');
      GF.Draw.text(ctx, '[1] INSTALL', 300, 332, { size: 16, color: '#0d131a', weight: '800' });
      GF.Draw.text(ctx, '+DMG & Hull', 300, 352, { size: 12, color: '#0d131a' });

      GF.Draw.roundRect(ctx, 400, 310, 160, 60, 6, '#ffc800');
      GF.Draw.text(ctx, '[2] SECURE', 480, 332, { size: 16, color: '#0d131a', weight: '800' });
      GF.Draw.text(ctx, '+500 Score', 480, 352, { size: 12, color: '#0d131a' });

      GF.Draw.roundRect(ctx, 580, 310, 160, 60, 6, '#ff4400');
      GF.Draw.text(ctx, '[3] DISMANTLE', 660, 332, { size: 16, color: '#ffffff', weight: '800' });
      GF.Draw.text(ctx, 'Repair +50 HP', 660, 352, { size: 12, color: '#ffffff' });
    } else if (this.modal === 'extraction') {
      ctx.fillStyle = 'rgba(13, 19, 26, 0.9)';
      ctx.fillRect(0, 0, 960, 540);
      GF.Draw.roundRect(ctx, 220, 120, 520, 300, 12, '#121d28');
      ctx.strokeStyle = '#ffc800'; ctx.lineWidth = 3;
      ctx.strokeRect(220, 120, 520, 300);
      GF.Draw.text(ctx, 'TITAN REACTOR DESTROYED!', 480, 165, { size: 26, color: '#7dffb2', weight: '900' });
      GF.Draw.text(ctx, 'Chamber Cleared - Proceed or Extract?', 480, 220, { size: 18, color: '#ffffff' });

      GF.Draw.roundRect(ctx, 280, 310, 170, 60, 6, '#7dffb2');
      GF.Draw.text(ctx, '[E] EXTRACT', 365, 332, { size: 16, color: '#0d131a', weight: '800' });
      GF.Draw.text(ctx, '+1000 Victory Bonus', 365, 352, { size: 11, color: '#0d131a' });

      GF.Draw.roundRect(ctx, 510, 310, 170, 60, 6, '#ff4400');
      GF.Draw.text(ctx, '[V] VENTURE DEEPER', 595, 332, { size: 14, color: '#ffffff', weight: '800' });
      GF.Draw.text(ctx, 'Next Chamber +50% HP', 595, 352, { size: 11, color: '#ffffff' });
    }
    GF.Draw.vignette(ctx, 960, 540, 0.35);
  }
});

game.titleScreen({
  subtitle: 'WASD / Move | Space / Dash | Mouse / Aim & Fire | 1, 2, 3 / Directives',
  onStart: () => game.go('play')
});
</script>
