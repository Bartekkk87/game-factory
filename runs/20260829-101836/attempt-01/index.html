<body>

<script>
(function () {
  'use strict';
  const VERSION = '1.0.0';
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  const pick = (arr) => arr[(Math.random() * arr.length) | 0];
  const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
  const TAU = Math.PI * 2;
  function makeRng(seed) {
    let s = seed >>> 0 || 1;
    return function () {
      s ^= s << 13;
      s ^= s >>> 17;
      s ^= s << 5;
      s >>>= 0;
      return s / 4294967296;
    };
  }
  const Eases = {
    linear: (t) => t,
    outCubic: (t) => 1 - Math.pow(1 - t, 3),
    inCubic: (t) => t * t * t,
    outQuad: (t) => 1 - (1 - t) * (1 - t),
    outBack: (t) => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
    outElastic: (t) =>
      t === 0 || t === 1 ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * ((2 * Math.PI) / 3)) + 1
  };

  const Sfx = {
    ctx: null,
    master: null,
    muted: false,
    ensure() {
      if (this.ctx || this.muted) return;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.5;
        this.master.connect(this.ctx.destination);
      } catch (e) {}
    },
    resume() {
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    beep({ freq = 440, to = null, dur = 0.15, type = 'square', vol = 0.4, delay = 0 } = {}) {
      if (!this.ctx || this.muted) return;
      const t = this.ctx.currentTime + delay;
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(this.master);
      o.start(t);
      o.stop(t + dur + 0.02);
    },
    noise({ dur = 0.2, vol = 0.3, freq = 1200, delay = 0 } = {}) {
      if (!this.ctx || this.muted) return;
      const t = this.ctx.currentTime + delay;
      const len = Math.max(1, (dur * this.ctx.sampleRate) | 0);
      const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = this.ctx.createBufferSource();
      src.buffer = buf;
      const f = this.ctx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = freq;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f).connect(g).connect(this.master);
      src.start(t);
    },
    melody(notes, { type = 'square', vol = 0.35 } = {}) {
      let delay = 0;
      for (const [freq, dur] of notes) {
        this.beep({ freq, dur: dur * 0.95, type, vol, delay });
        delay += dur;
      }
    }
  };

  class Input {
    constructor(canvas) {
      this.keys = Object.create(null);
      this._edge = Object.create(null);
      this.pointer = { x: 0, y: 0, down: false, clicked: false };
      this._anyAction = [];
      const kd = (e) => {
        if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
        if (!this.keys[e.code]) this._edge[e.code] = true;
        this.keys[e.code] = true;
        Sfx.ensure();
        Sfx.resume();
        for (const fn of this._anyAction) fn(e.code);
      };
      const ku = (e) => {
        this.keys[e.code] = false;
      };
      window.addEventListener('keydown', kd);
      window.addEventListener('keyup', ku);
      const toLocal = (e) => {
        const r = canvas.getBoundingClientRect();
        return {
          x: ((e.clientX - r.left) / r.width) * canvas._lw,
          y: ((e.clientY - r.top) / r.height) * canvas._lh
        };
      };
      canvas.addEventListener('pointermove', (e) => {
        Object.assign(this.pointer, toLocal(e));
      });
      canvas.addEventListener('pointerdown', (e) => {
        Sfx.ensure();
        Sfx.resume();
        Object.assign(this.pointer, toLocal(e));
        this.pointer.down = true;
        this.pointer.clicked = true;
        for (const fn of this._anyAction) fn('PointerDown');
      });
      window.addEventListener('pointerup', () => {
        this.pointer.down = false;
      });
    }
    pressed(code) {
      return !!this._edge[code];
    }
    onAnyInput(fn) {
      this._anyAction.push(fn);
    }
    _endFrame() {
      this._edge = Object.create(null);
      this.pointer.clicked = false;
    }
  }

  class Particles {
    constructor(cap = 700) {
      this.pool = Array.from({ length: cap }, () => ({ active: false }));
    }
    emit(x, y, { count = 10, speed = 120, size = 4, life = 0.6, colors = ['#fff'], gravity = 200, spread = TAU, dir = 0 } = {}) {
      let made = 0;
      for (const p of this.pool) {
        if (p.active) continue;
        const a = dir + (spread === TAU ? rand(TAU) : rand(-spread / 2, spread / 2));
        const v = speed * rand(0.4, 1);
        p.active = true;
        p.x = x;
        p.y = y;
        p.vx = Math.cos(a) * v;
        p.vy = Math.sin(a) * v;
        p.life = p.maxLife = life * rand(0.6, 1.2);
        p.size = size * rand(0.6, 1.4);
        p.color = pick(colors);
        p.gravity = gravity;
        if (++made >= count) break;
      }
    }
    update(dt) {
      for (const p of this.pool) {
        if (!p.active) continue;
        p.life -= dt;
        if (p.life <= 0) {
          p.active = false;
          continue;
        }
        p.vy += p.gravity * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
      }
    }
    draw(ctx) {
      for (const p of this.pool) {
        if (!p.active) continue;
        ctx.globalAlpha = clamp(p.life / p.maxLife, 0, 1);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, TAU);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }

  class Tweens {
    constructor() {
      this.list = [];
    }
    add(obj, props, dur, ease = 'outCubic', onDone = null) {
      const from = {};
      for (const k of Object.keys(props)) from[k] = obj[k];
      this.list.push({ obj, props, from, t: 0, dur, ease: Eases[ease] || Eases.outCubic, onDone });
    }
    update(dt) {
      for (let i = this.list.length - 1; i >= 0; i--) {
        const tw = this.list[i];
        tw.t += dt;
        const k = clamp(tw.t / tw.dur, 0, 1);
        const e = tw.ease(k);
        for (const key of Object.keys(tw.props)) {
          tw.obj[key] = lerp(tw.from[key], tw.props[key], e);
        }
        if (k >= 1) {
          this.list.splice(i, 1);
          if (tw.onDone) tw.onDone();
        }
      }
    }
  };

  const Draw = {
    text(ctx, str, x, y, { size = 24, color = '#fff', align = 'center', baseline = 'middle', weight = '800', font = 'system-ui, sans-serif' } = {}) {
      ctx.fillStyle = color;
      ctx.textAlign = align;
      ctx.textBaseline = baseline;
      ctx.font = `${weight} ${size}px ${font}`;
      ctx.fillText(str, x, y);
    },
    roundRect(ctx, x, y, w, h, r, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h);
      ctx.fill();
    },
    vignette(ctx, w, h, strength = 0.35) {
      const g = ctx.createRadialGradient(w / 2, h / 2, h * 0.4, w / 2, h / 2, h * 0.85);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, `rgba(0,0,0,${strength})`);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
    }
  };

  class Game {
    constructor({ id = 'gf-game', title = 'Untitled', width = 960, height = 540, palette = ['#7c5cff', '#00e0ff', '#ff5c8a', '#ffd166'], background = '#0b0e1a', seed = (Number.isInteger(window.__GF_VERIFIER_SEED__) ? window.__GF_VERIFIER_SEED__ : Date.now() % 100000) } = {}) {
      this.id = id;
      this.title = title;
      this.W = width;
      this.H = height;
      this.palette = palette;
      this.background = background;
      this.seed = seed >>> 0;
      this.rng = makeRng(this.seed);
      this.scenes = {};
      this.sceneName = null;
      this.state = 'boot';
      this.score = 0;
      this.best = Number(localStorage.getItem('gf-best-' + id) || 0);
      this.time = 0;
      this.shakeMag = 0;
      this.shakeDur = 0;
      this.flashAlpha = 0;
      this.flashColor = '#ffffff';
      this._hitStopRemaining = 0;
      this._fpsFrames = 0;
      this._fpsTime = 0;
      this.fps = 60;
      this.particles = new Particles();
      this.tweens = new Tweens();
      this.probeErrors = [];

      const canvas = document.createElement('canvas');
      canvas.id = 'game';
      document.body.appendChild(canvas);
      this.canvas = canvas;
      canvas._lw = this.W;
      canvas._lh = this.H;
      const fit = () => {
        const s = Math.min(window.innerWidth / this.W, window.innerHeight / this.H);
        canvas.style.width = Math.floor(this.W * s) + 'px';
        canvas.style.height = Math.floor(this.H * s) + 'px';
      };
      window.addEventListener('resize', fit);
      fit();

      const ctx = canvas.getContext('2d');
      this.ctx = ctx;

      this.input = new Input(canvas);
      this.input.onAnyInput(() => {
        if (this.state === 'title' && this._titleStart) this._startFromTitle();
        else if ((this.state === 'gameover' || this.state === 'won') && this.time > 0.8) this.restart();
      });

      window.addEventListener('error', (e) => this._err(e.message));
      window.addEventListener('unhandledrejection', (e) => this._err(String(e.reason)));

      window.__GF__ = {
        version: VERSION,
        info: { title, id, engine: VERSION, seed: this.seed },
        errors: this.probeErrors,
        getState: () => this.state,
        getScore: () => this.score,
        getBest: () => this.best,
        getFps: () => this.fps,
        getTime: () => this.time,
        getSeed: () => this.seed,
        flags: {},
        restart: () => this.restart()
      };

      let last = performance.now();
      const frame = (now) => {
        requestAnimationFrame(frame);
        let dt = (now - last) / 1000;
        last = now;
        dt = Math.min(dt, 0.1);
        this._fpsFrames++;
        this._fpsTime += dt;
        if (this._fpsTime >= 0.5) {
          this.fps = Math.round(this._fpsFrames / this._fpsTime);
          this._fpsFrames = 0;
          this._fpsTime = 0;
        }
        this._update(dt);
        this._draw(ctx);
        this.input._endFrame();
      };
      requestAnimationFrame(frame);
    }

    get currentScene() {
      return this.sceneName ? this.scenes[this.sceneName] || null : null;
    }

    _err(msg) {
      if (this.probeErrors.length < 25 && !this.probeErrors.includes(msg)) this.probeErrors.push(String(msg));
    }

    add(name, scene) {
      scene.name = name;
      scene.game = this;
      this.scenes[name] = scene;
      return scene;
    }
    go(name) {
      const next = this.scenes[name];
      if (!next) return this._err('unknown scene: ' + name);
      this.sceneName = name;
      this.state = name === 'title' ? 'title' : 'playing';
      if (next.init) next.init();
      if (next.reset) next.reset();
      this.time = 0;
    }
    titleScreen({ subtitle = 'Press any key', onStart = null } = {}) {
      this._titleStart = onStart || (() => this.go(this._firstPlayScene()));
      this.state = 'title';
      this._subtitle = subtitle;
    }
    _firstPlayScene() {
      const names = Object.keys(this.scenes);
      return names.find((n) => n !== 'title') || names[0];
    }
    _startFromTitle() {
      Sfx.ensure();
      Sfx.resume();
      Sfx.beep({ freq: 520, to: 780, dur: 0.12, type: 'triangle', vol: 0.35 });
      this._titleStart();
    }
    addScore(n = 1) {
      if (this.state !== 'playing') return;
      this.score += n;
      if (this.score > this.best) {
        this.best = this.score;
        localStorage.setItem('gf-best-' + this.id, String(this.best));
      }
    }
    shake(mag = 6, dur = 0.3) {
      this.shakeMag = mag;
      this.shakeDur = dur;
    }
    flash(color = '#ffffff', alpha = 0.5) {
      this.flashColor = color;
      this.flashAlpha = alpha;
    }
    burst(x, y, opts) {
      this.particles.emit(x, y, opts);
    }
    hitStop(dur = 0.06) {
      this._hitStopRemaining = Math.max(this._hitStopRemaining, dur);
    }
    gameOver({ message = 'GAME OVER' } = {}) {
      if (this.state !== 'playing') return;
      this.state = 'gameover';
      this._endMessage = message;
      this.shake(9, 0.45);
      Sfx.melody([[392, 0.12], [330, 0.12], [262, 0.2]]);
    }
    win({ message = 'YOU WIN!' } = {}) {
      if (this.state !== 'playing') return;
      this.state = 'won';
      this._endMessage = message;
      Sfx.melody([[523, 0.1], [659, 0.1], [784, 0.18]], { type: 'triangle' });
    }
    restart() {
      this.score = 0;
      this.time = 0;
      this.particles = new Particles();
      this.tweens = new Tweens();
      const sc = this.scenes[this.sceneName];
      this.state = 'playing';
      if (sc && sc.reset) sc.reset();
      else if (sc && sc.init) sc.init();
      Sfx.beep({ freq: 660, dur: 0.08, vol: 0.3 });
    }

    _update(dtRaw) {
      this.tweens.update(dtRaw);
      if (this.shakeDur > 0) this.shakeDur -= dtRaw;
      if (this.flashAlpha > 0) this.flashAlpha = Math.max(0, this.flashAlpha - dtRaw * 2.5);
      if (this.state !== 'playing') return;
      if (this._hitStopRemaining > 0) {
        this._hitStopRemaining -= dtRaw;
        return;
      }
      const dt = Math.min(dtRaw, 1 / 20);
      this.time += dt;
      const sc = this.scenes[this.sceneName];
      if (sc && sc.update) sc.update(dt);
      this.particles.update(dt);
    }

    _draw(ctx) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = this.background;
      ctx.fillRect(0, 0, this.W, this.H);
      let sx = 0;
      let sy = 0;
      if (this.shakeDur > 0) {
        sx = rand(-this.shakeMag, this.shakeMag);
        sy = rand(-this.shakeMag, this.shakeMag);
      }
      ctx.translate(sx, sy);
      const sc = this.scenes[this.sceneName];
      if (sc && sc.draw) sc.draw(ctx);
      this.particles.draw(ctx);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      if (this.state === 'title') {
        ctx.fillStyle = 'rgba(5,8,16,0.55)';
        ctx.fillRect(0, 0, this.W, this.H);
        Draw.text(ctx, this.title, this.W / 2, this.H / 2 - 40, { size: 56, color: this.palette[0] });
        Draw.text(ctx, this._subtitle || '', this.W / 2, this.H / 2 + 24, { size: 22, color: '#dfe6ff', weight: '600' });
        Draw.text(ctx, 'BEST ' + this.best, this.W / 2, this.H - 40, { size: 18, color: '#8fa3d9', weight: '600' });
      } else if (this.state === 'gameover' || this.state === 'won') {
        ctx.fillStyle = this.state === 'won' ? 'rgba(10,30,20,0.55)' : 'rgba(30,5,15,0.55)';
        ctx.fillRect(0, 0, this.W, this.H);
        Draw.text(ctx, this._endMessage || (this.state === 'won' ? 'YOU WIN!' : 'GAME OVER'), this.W / 2, this.H / 2 - 50, { size: 52, color: this.state === 'won' ? '#7dffb2' : '#ff7d9c' });
        Draw.text(ctx, 'SCORE ' + this.score, this.W / 2, this.H / 2 + 12, { size: 30, color: '#fff' });
        Draw.text(ctx, 'BEST ' + this.best, this.W / 2, this.H / 2 + 52, { size: 20, color: '#cdd6f4' });
        Draw.text(ctx, 'Click / press R to retry', this.W / 2, this.H / 2 + 96, { size: 17, color: '#9fb0d8', weight: '600' });
      } else {
        Draw.text(ctx, String(this.score), this.W / 2, 44, { size: 34, color: 'rgba(255,255,255,0.92)' });
        Draw.text(ctx, 'BEST ' + this.best, this.W - 20, 30, { size: 15, color: 'rgba(255,255,255,0.55)', align: 'right', weight: '700' });
      }
      if (this.flashAlpha > 0) {
        ctx.globalAlpha = this.flashAlpha;
        ctx.fillStyle = this.flashColor;
        ctx.fillRect(0, 0, this.W, this.H);
        ctx.globalAlpha = 1;
      }
    }
  }

  window.GF = { VERSION, Game, Input, Particles, Tweens, Draw, Sfx, math: { clamp, lerp, rand, randInt, pick, dist, TAU, makeRng }, Eases };
})();


(function () {
  if (!window.GF || !window.GF.Game || window.GF.__probeExtended) return;
  const BaseGame = window.GF.Game;
  class EvidencedGame extends BaseGame {
    constructor(options) {
      super(options);
      if (this.canvas) {
        this.canvas.width = this.W;
        this.canvas.height = this.H;
      }
      this._probeEvents = [];
      this._probeSeq = 0;
      window.__GF__.events = this._probeEvents;
      window.__GF__.getEvents = () => this._probeEvents.map((event) => ({ ...event, data: { ...(event.data || {}) } }));
      window.__GF__.emit = (type, data) => this.event(type, data);
    }
    event(type, data = {}) {
      let safeData = {};
      try {
        const serialized = JSON.stringify(data ?? {});
        safeData = serialized.length <= 2048
          ? JSON.parse(serialized)
          : { truncated: true, preview: serialized.slice(0, 1900) };
      } catch (_) {
        safeData = { value: String(data).slice(0, 1900) };
      }
      const event = {
        seq: ++this._probeSeq,
        type: String(type || 'event').slice(0, 80),
        time: Math.round((this.time || 0) * 1000) / 1000,
        state: this.state,
        score: this.score,
        data: safeData
      };
      if (this._probeEvents.length >= 128) this._probeEvents.shift();
      this._probeEvents.push(event);
      return event;
    }
    addScore(n = 1) {
      const before = this.score;
      super.addScore(n);
      if (this.score !== before) this.event('score_changed', { before, after: this.score, delta: this.score - before });
    }
    go(name) {
      const before = this.state;
      super.go(name);
      this.event('state_changed', { from: before, to: this.state, scene: name });
    }
    gameOver(options) {
      const before = this.state;
      super.gameOver(options);
      if (this.state !== before) this.event('game_over', { from: before, to: this.state });
    }
    win(options) {
      const before = this.state;
      super.win(options);
      if (this.state !== before) this.event('game_won', { from: before, to: this.state });
    }
  }
  window.GF.Game = EvidencedGame;
  window.GF.__probeExtended = true;
})();

</script>
<script>
(function(){
'use strict';
const M = GF.math;
const TEAL='#3ff2c8', GOLD='#ffd977', DIM='#0d2b33';
function emit(g,type,data){
  data=data||{};
  try{ if(typeof g.event==='function') g.event(type,data); }catch(e){}
  try{ (window.__gfEvents=window.__gfEvents||[]).push(Object.assign({type:type},data)); }catch(e){}
}

const scene = {
  init(){
    const g=this.game, ctx=g.ctx;
    this.bg=ctx.createLinearGradient(0,0,0,540);
    this.bg.addColorStop(0,'#08141c');
    this.bg.addColorStop(0.5,'#060d14');
    this.bg.addColorStop(1,'#0a2029');
  },
  reset(){
    const g=this.game;
    const before=(g.__runCount||0);
    g.__runCount=before+1;
    emit(g,'run_restarted',{runCount:before+1,before:before,after:before+1});
    this.px=480; this.py=270; this.vx=0; this.vy=0;
    this.stab=100; this.nodes=0; this.hazard=1.0;
    this.inv=0; this.trail=[];
    this.pulses=[]; this.spores=[];
    this.pulseT=1.4; this.sporeT=0.6; this.beatT=0.5; this.emitT=0;
    this.warned=false; this.vineProg=0; this.t=0;
    this.nodesArr=[
      {x:680,y:300,on:false,ph:0},
      {x:740,y:470,on:false,ph:2},
      {x:200,y:460,on:false,ph:4}
    ];
    this.motes=[];
    const rng=g.rng;
    for(let i=0;i<42;i++) this.motes.push({x:rng()*960,y:rng()*540,s:0.6+rng()*1.6,v:6+rng()*16});
  },

  activateNode(n){
    const g=this.game;
    n.on=true;
    this.nodes++;
    const before=this.hazard;
    this.hazard=[1.0,1.35,1.7][this.nodes-1]||1.7;
    emit(g,'pressure_escalated',{hazardSpeed:this.hazard,before:before,after:this.hazard});
    g.addScore(100);
    this.stab=M.clamp(this.stab+30,0,100);
    g.hitStop(0.06);
    g.shake(8,0.3);
    g.flash('#bfffe9',0.4);
    g.burst(n.x,n.y,{count:36,speed:220,size:4,life:0.9,colors:[TEAL,GOLD,'#ffffff'],gravity:0});
    GF.Sfx.melody([[523,0.09],[659,0.09],[784,0.09],[1046,0.22]],{type:'triangle',vol:0.4});
    this.vineProg=this.nodes;
    if(this.nodes>=3){
      emit(g,'state_reached',{state:'success'});
      g.win({message:'SIGNAL GARDEN AWAKE'});
    }
  },

  tryChannel(){
    for(const n of this.nodesArr){
      if(!n.on && M.dist(this.px,this.py,n.x,n.y)<80){
        this.activateNode(n);
        return true;
      }
    }
    return false;
  },

  hurt(amount){
    if(this.inv>0) return;
    const g=this.game;
    this.stab=Math.max(0,this.stab-amount);
    this.inv=1.0;
    g.shake(5,0.25);
    g.hitStop(0.04);
    g.burst(this.px,this.py,{count:12,speed:140,size:3,life:0.5,colors:['#ff9d6b','#ffd977'],gravity:60});
    GF.Sfx.noise({dur:0.18,vol:0.3,freq:700});
    GF.Sfx.beep({freq:220,to:110,dur:0.2,type:'sawtooth',vol:0.25});
    if(this.stab<25 && !this.warned){
      this.warned=true;
      g.flash('#ff7d4d',0.3);
      GF.Sfx.beep({freq:880,to:440,dur:0.4,type:'triangle',vol:0.3});
    }
  },

  update(dt){
    const g=this.game, k=g.input.keys;
    this.t+=dt;

    // movement
    let tx=0,ty=0;
    if(k['ArrowLeft']||k['KeyA'])tx-=1;
    if(k['ArrowRight']||k['KeyD'])tx+=1;
    if(k['ArrowUp']||k['KeyW'])ty-=1;
    if(k['ArrowDown']||k['KeyS'])ty+=1;
    if(tx||ty){ const l=Math.hypot(tx,ty); tx/=l; ty/=l; }
    const SP=300;
    const f=Math.min(1,dt*8);
    this.vx+=(tx*SP-this.vx)*f;
    this.vy+=(ty*SP-this.vy)*f;
    this.px=M.clamp(this.px+this.vx*dt,26,934);
    this.py=M.clamp(this.py+this.vy*dt,26,514);

    this.emitT-=dt;
    if(this.emitT<=0){ this.emitT=0.25; emit(g,'player_moved',{playerX:Math.round(this.px),before:Math.round(this.px-this.vx*0.25),after:Math.round(this.px)}); }

    // channel input
    if(g.input.pressed('Space')||g.input.pressed('Enter')||g.input.pointer.clicked){
      this.tryChannel();
    }

    // stability drain
    this.stab-=(1.0+0.5*this.nodes)*dt;
    if(this.inv>0)this.inv-=dt;
    if(this.stab<=0){
      this.stab=0;
      emit(g,'state_reached',{state:'failure'});
      g.gameOver({message:'THE CURRENT GUTTERS OUT'});
      return;
    }
    if(this.stab>=30)this.warned=false;

    // pulses: expanding rings
    this.pulseT-=dt;
    if(this.pulseT<=0 && this.pulses.length<14){
      this.pulseT=2.6/this.hazard;
      const edge=(g.rng()*4)|0;
      let x,y;
      if(edge===0){x=-20;y=g.rng()*540;}
      else if(edge===1){x=980;y=g.rng()*540;}
      else if(edge===2){x=g.rng()*960;y=-20;}
      else {x=g.rng()*960;y=560;}
      this.pulses.push({x:x,y:y,r:10,sp:85});
      GF.Sfx.beep({freq:160,to:90,dur:0.3,type:'sine',vol:0.12});
    }
    for(let i=this.pulses.length-1;i>=0;i--){
      const p=this.pulses[i];
      p.r+=p.sp*this.hazard*dt;
      if(p.r>1100){this.pulses.splice(i,1);continue;}
      const d=M.dist(this.px,this.py,p.x,p.y);
      if(Math.abs(d-p.r)<16) this.hurt(10);
    }

    // spores: drifting orbs
    this.sporeT-=dt;
    if(this.sporeT<=0 && this.spores.length<26){
      this.sporeT=1.6/this.hazard;
      const edge=(g.rng()*4)|0;
      let x,y;
      if(edge===0){x=-30;y=g.rng()*540;}
      else if(edge===1){x=990;y=g.rng()*540;}
      else if(edge===2){x=g.rng()*960;y=-30;}
      else {x=g.rng()*960;y=570;}
      const ang=Math.atan2(270-y,480-x)+ (g.rng()-0.5)*1.2;
      const v=55*this.hazard;
      this.spores.push({x:x,y:y,vx:Math.cos(ang)*v,vy:Math.sin(ang)*v,r:7});
    }
    for(let i=this.spores.length-1;i>=0;i--){
      const s=this.spores[i];
      s.x+=s.vx*dt; s.y+=s.vy*dt;
      if(s.x<-50||s.x>1010||s.y<-50||s.y>590){this.spores.splice(i,1);continue;}
      if(M.dist(this.px,this.py,s.x,s.y)<19) this.hurt(6);
    }

    // trail
    this.trail.push({x:this.px,y:this.py});
    if(this.trail.length>16)this.trail.shift();

    // motes drift
    for(const m of this.motes){ m.y-=m.v*dt; if(m.y<-4){m.y=544;m.x=g.rng()*960;} }

    // ambient beat quickens with pressure
    this.beatT-=dt;
    if(this.beatT<=0){
      this.beatT=1.3/this.hazard;
      GF.Sfx.beep({freq:96+this.hazard*22,dur:0.35,type:'sine',vol:0.12});
      GF.Sfx.beep({freq:192+this.hazard*44,dur:0.18,type:'triangle',vol:0.05,delay:0.15});
    }
  },

  draw(ctx){
    const g=this.game, W=960, H=540;
    ctx.fillStyle=this.bg; ctx.fillRect(0,0,W,H);

    // water caustic shimmer
    ctx.globalAlpha=0.05; ctx.strokeStyle=TEAL; ctx.lineWidth=2;
    for(let i=0;i<5;i++){
      ctx.beginPath();
      for(let x=0;x<=W;x+=40){
        const y=90+i*95+Math.sin(x*0.02+this.t*(0.6+i*0.13)+i)*14;
        x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
    ctx.globalAlpha=1;

    // motes
    for(const m of this.motes){
      ctx.globalAlpha=0.25; ctx.fillStyle=TEAL;
      ctx.beginPath(); ctx.arc(m.x,m.y,m.s,0,M.TAU); ctx.fill();
    }
    ctx.globalAlpha=1;

    // vine circuitry between nodes (lights up with progress)
    ctx.lineWidth=3;
    const links=[[{x:480,y:270},this.nodesArr[0]],[this.nodesArr[0],this.nodesArr[1]],[this.nodesArr[1],this.nodesArr[2]]];
    for(let i=0;i<links.length;i++){
      const [a,b]=links[i];
      const lit=this.vineProg>i;
      const pulse=0.5+0.5*Math.sin(this.t*3+i);
      ctx.strokeStyle=lit?'rgba(255,217,119,'+(0.5+0.4*pulse)+')':'rgba(63,242,200,0.12)';
      ctx.beginPath();
      const mx=(a.x+b.x)/2, my=(a.y+b.y)/2-40;
      ctx.moveTo(a.x,a.y); ctx.quadraticCurveTo(mx,my,b.x,b.y); ctx.stroke();
    }

    // nodes
    for(const n of this.nodesArr){
      const p=0.5+0.5*Math.sin(this.t*2+n.ph);
      if(n.on){
        ctx.fillStyle='rgba(255,217,119,0.15)';
        ctx.beginPath(); ctx.arc(n.x,n.y,60+8*p,0,M.TAU); ctx.fill();
        ctx.strokeStyle=GOLD; ctx.lineWidth=3;
        ctx.beginPath(); ctx.arc(n.x,n.y,26,0,M.TAU); ctx.stroke();
        ctx.fillStyle=GOLD;
        ctx.beginPath(); ctx.arc(n.x,n.y,12,0,M.TAU); ctx.fill();
      } else {
        const near=M.dist(this.px,this.py,n.x,n.y)<80;
        ctx.strokeStyle='rgba(63,242,200,'+(0.35+0.3*p)+')'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(n.x,n.y,70,0,M.TAU); ctx.stroke();
        ctx.setLineDash([6,10]);
        ctx.strokeStyle=near?'rgba(63,242,200,0.7)':'rgba(63,242,200,0.25)';
        ctx.beginPath(); ctx.arc(n.x,n.y,44+6*p,0,M.TAU); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle='rgba(63,242,200,'+(0.5+0.3*p)+')';
        ctx.beginPath(); ctx.arc(n.x,n.y,9,0,M.TAU); ctx.fill();
      }
    }

    // pulses: expanding rings
    for(const p of this.pulses){
      const a=M.clamp(1-p.r/1000,0,1);
      ctx.globalAlpha=0.7*a;
      ctx.strokeStyle='#7dfce0'; ctx.lineWidth=5;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,M.TAU); ctx.stroke();
      ctx.globalAlpha=0.15*a;
      ctx.lineWidth=14;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,M.TAU); ctx.stroke();
    }
    ctx.globalAlpha=1;

    // spores
    for(const s of this.spores){
      ctx.fillStyle='rgba(125,255,178,0.9)';
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,M.TAU); ctx.fill();
      ctx.globalAlpha=0.25;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r+6,0,M.TAU); ctx.fill();
      ctx.globalAlpha=1;
    }

    // player trail
    for(let i=0;i<this.trail.length;i++){
      const t=this.trail[i], k=i/this.trail.length;
      ctx.globalAlpha=k*0.35; ctx.fillStyle=TEAL;
      ctx.beginPath(); ctx.arc(t.x,t.y,3+6*k,0,M.TAU); ctx.fill();
    }
    ctx.globalAlpha=1;

    // player: luminous teardrop
    const ang=Math.atan2(this.vy,this.vx);
    const blink=this.inv>0 && (Math.floor(this.t*14)%2===0);
    ctx.globalAlpha=blink?0.4:1;
    ctx.fillStyle='rgba(63,242,200,0.25)';
    ctx.beginPath(); ctx.arc(this.px,this.py,20,0,M.TAU); ctx.fill();
    ctx.fillStyle='#eafffa';
    ctx.beginPath(); ctx.arc(this.px,this.py,10,0,M.TAU); ctx.fill();
    ctx.strokeStyle=TEAL; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(this.px,this.py,10,0,M.TAU); ctx.stroke();
    ctx.strokeStyle='rgba(63,242,200,0.8)'; ctx.lineWidth=4;
    ctx.beginPath();
    ctx.moveTo(this.px-Math.cos(ang)*10,this.py-Math.sin(ang)*10);
    ctx.lineTo(this.px-Math.cos(ang)*26,this.py-Math.sin(ang)*26);
    ctx.stroke();
    ctx.globalAlpha=1;

    // pointer shimmer (cosmetic)
    const pt=g.input.pointer;
    if(pt.x||pt.y){
      ctx.globalAlpha=0.2; ctx.strokeStyle='#ffffff'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(pt.x,pt.y,14+3*Math.sin(this.t*5),0,M.TAU); ctx.stroke();
      ctx.globalAlpha=1;
    }

    // ---- HUD: three non-overlapping edge regions ----
    // top-left: node progress pips
    GF.Draw.roundRect(ctx,16,14,168,40,10,'rgba(6,13,20,0.75)');
    GF.Draw.text(ctx,'NODES',28,34,{size:13,color:'#8fd9cc',align:'left',weight:'700'});
    for(let i=0;i<3;i++){
      const on=i<this.nodes;
      ctx.fillStyle=on?GOLD:'rgba(63,242,200,0.2)';
      ctx.beginPath(); ctx.arc(96+i*26,34,8,0,M.TAU); ctx.fill();
      if(on){ ctx.strokeStyle='rgba(255,217,119,0.5)'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(96+i*26,34,12,0,M.TAU); ctx.stroke(); }
    }
    // top-right: stability bar
    GF.Draw.roundRect(ctx,700,14,244,40,10,'rgba(6,13,20,0.75)');
    GF.Draw.text(ctx,'STABILITY',714,34,{size:13,color:'#8fd9cc',align:'left',weight:'700'});
    const bw=130;
    ctx.fillStyle='rgba(63,242,200,0.15)';
    ctx.fillRect(796,26,bw,16);
    const sc=this.stab/100;
    ctx.fillStyle=sc>0.25?TEAL:'#ff7d4d';
    ctx.fillRect(796,26,bw*sc,16);
    ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=1;
    ctx.strokeRect(796,26,bw,16);
    // center score is drawn by engine overlay at top-center

    GF.Draw.vignette(ctx,W,H,0.4);
  }
};

const game=new GF.Game({
  id:'lumen-current',
  title:'Lumen Current: Signal Garden',
  width:960, height:540,
  palette:['#3ff2c8','#ffd977','#7dfcb2','#0d2b33'],
  background:'#060d14'
});
game.add('play',scene);
game.titleScreen({subtitle:'Arrow / WASD to drift  ·  Space to channel a node  ·  press any key'});
})();
</script>
